# West command registration for the nano-ros module.
#
# Referenced from the workspace `west.yml`'s `self.west-commands:` key, so any
# west workspace listing nano-ros as a project picks these up with no manual
# `west config` step.
#
# `west fvp` USED TO BE HERE and was deleted by RFC-0064 R5 D4 / phase-215.K.3.
# It was 117 lines whose whole body was: read NROS_BOARD_RUNNER from
# CMakeCache.txt, refuse unless it said `armfvp`, shell out to
# `scripts/zephyr/resolve-fvp-bin.sh`, export ARMFVP_BIN_PATH, and then
# `os.execvpe('west', ['west','build','-t','run'])`. A verb whose last statement
# is the stock verb is env wiring, and env wiring belongs in the caller's
# environment: the two `just zephyr run-fvp-*` recipes export the resolver's
# output and invoke `west build -t run` directly.
#
# Worth stating because the reasoning that ADDED it was not wrong, only
# misapplied: phase-215's note argued that `west` should own a run verb rather
# than `nros`. Correct -- and `west` already owned it.
west-commands:
  - file: scripts/west_commands/nros.py
    commands:
      - name: nros
        class: NrosRun
        help: run the nano-ros CLI against this west workspace
