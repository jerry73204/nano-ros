# ===========================================================================
# zephyr (west) — phase-350 W1.
#
# These 70 rows were the LAST fixture builds with no manifest row, and so with
# no `row_coord()` (issue 0535). Their matrix lived in
# `scripts/build/fixture-matrix.sh` + `zephyr-fixture-leaves.sh` as nested bash
# loops, a second copy sat in `west-fixtures.sh`, and a third in
# `examples_fixture_coverage.rs` — so a lane could only include or exclude the
# whole zephyr MODULE, never a coordinate inside it, and the run side had to
# treat every leaf as unattributable.
#
# `builder = "west"` — the row is built by `west build`, not cargo/cmake, so
# `is_cargo_row()` is false and the cargo/cmake lane (`fixtures-build.sh`)
# never sees it. Same seam phase-344 W2 used for `builder = "cmake"`.
#
# What a row carries is IDENTITY only. The six role leaves derive their
# `build_name`, `id`, and zenoh/xrce/cyclone isolation values from
# (lang, role, rmw) through the allocator offsets in
# `zephyr-fixture-leaves.sh`, exactly as before — putting those in a row would
# duplicate the allocator's OUTPUT as literals, which is the drift this phase
# exists to remove. The other leaves already held literals in the script, so
# their rows carry the same literal: a move, not a new spelling.
#
#   west_role       role when it is not the dir basename (entry, logging-smoke)
#   west_build_name west build-dir name when not `build-<tag>-<role>-<rmw>`
#   west_id         leaf id when not `zephyr/<board>/<lang>/<role>/<rmw>`
#   west_zenoh_locator / west_xrce_agent_port / west_cyclone_domain
#                   isolation value when the row does not derive one
#   conf_files      the RELATIVE Kconfig overlays; the absolute board/NSOS
#                   tail stays in the script (it is a host path, not a fact
#                   about the fixture)
# ===========================================================================

