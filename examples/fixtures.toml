# Phase 225.O — ESP32-C3 QEMU (OpenETH) workspace Entry. Built by the
# cargo lane (`scripts/build/workspace-fixtures-build.sh esp32 rust`):
# nightly + `-Z build-std` via the per-row `env` (a global `[unstable]
# build-std` in the shared `.cargo/config.toml` would break the
# native/freertos/threadx rows). The riscv link flags come from the
# workspace `.cargo/config.toml` `[target.riscv32imc-unknown-none-elf]`
# block. ESP_LOG / arena / UDP-socket knobs match the single-node esp32
# example so the booted image fits + the executor arena is sized.
[[workspace_fixture]]
id = "workspace-rust-esp32"
platform = "esp32"
lang = "rust"
rmw = "zenoh"
dir = "examples/workspaces/rust"
bringup = "src/demo_bringup"
entry = "esp32_entry"
codegen_out = "build-fixtures/demo_bringup"
target_dir = "target-fixtures/esp32"
target = "riscv32imc-unknown-none-elf"
# phase-320 W1.d — `skip_probe = true` was REMOVED here. Its stated reason was
# "esp32 is NOT in the `build-test-fixtures` platform fan-out", which stopped
# being true when esp32 was added to that fan-out; the justification was never
# revisited. The consequence was a fixture backing a real two-way QEMU e2e
# (`esp32_emulator.rs`) sitting outside the staleness gate, i.e. the
# museum-binary class (issues 0148/0164/0196) — the sweep can "pass" on a
# binary built before the change under test.
#
# The original worry (hard-failing the preflight on hosts without the esp
# toolchain) is handled properly by `workspace_toolchain_present` in
# scripts/check-fixtures-stale.sh, which drops the row with an info note when
# the riscv32imc target is absent instead of failing the suite.
# ZPICO_SUBSCRIBER_LARGE_SIZE: shrink the Phase 231 (RFC-0038) size-class large
# receive buffer from the 16 KiB default to 4 KiB on esp32 (issue #24). The
# static large-payload blocks are MAX_LARGE_SUBSCRIBERS(2) × RING_DEPTH(4) ×
# LARGE_SIZE, i.e. 128 KiB at the default — which overflows esp32 DRAM `.bss`
# by ~54 KiB. 4 KiB cuts that block to 32 KiB (saves ~96 KiB); 4096 > the 2048
# size threshold so the small/large split holds, and esp32 cannot buffer 16 KiB
# messages anyway.
# NROS_RUNTIME_MAX_CELL_ENTITIES: issue 0857 — the phase-391 W5 inline cell
# registries cost CELL_REG_CAP × ~1.35 KiB (EmbeddedRawPublisher embeds a 1 KiB
# TxArena) on the Rust heap PER COMPONENT; at the default 8 the second
# component's ~17.5 KiB Arc<ComponentCell> OOMs the 48 KiB esp-alloc heap. The
# two components here declare one publisher + one subscription, so 2 is exact.
# Interim until the W5-endgame per-class exact cells retire the worst-case pad.
# ZPICO_MAX_QUERYABLES: this image is a talker and a listener — pub/sub only,
# no service servers, and `entity-facts` reports INFRA_QUERYABLES=none. The
# undeclared embedded budget is 8, which costs 35,424 B of SERVICE_BUFFERS
# (`ZPICO_MAX_SESSIONS * ZPICO_MAX_QUERYABLES`) for services this image does
# not have — and that is what overflowed DRAM by 8,804 B, blocking the whole
# esp32 nightly lane.
#
# 2, not 0, and the difference is the point: a model cannot describe service
# wiring (ZERO of the tree's 115 resolved models carry any), so `entity-facts`
# correctly REFUSES to report a count rather than guess. This row is where the
# image's own author can state it. The build prints
#   `ZPICO_MAX_QUERYABLES=2 is under the budgeted 8 (0 provably claimed at
#    boot, plus 8 of headroom …). It will boot; an application declaring more
#    than 2 service servers will not`
# which is the tradeoff stated out loud — the checked-override behaviour
# phase-392 W5.f added for exactly this.
env = { RUSTUP_TOOLCHAIN = "nightly-2026-04-11", CARGO_UNSTABLE_BUILD_STD = "core,alloc", ESP_LOG = "info", NROS_EXECUTOR_ARENA_SIZE = "16384", NROS_SMOLTCP_MAX_UDP_SOCKETS = "2", ZPICO_SUBSCRIBER_LARGE_SIZE = "4096", NROS_RUNTIME_MAX_CELL_ENTITIES = "2", ZPICO_MAX_QUERYABLES = "2" }

