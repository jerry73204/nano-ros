# ===========================================================================
# freertos (qemu MPS2-AN385) — Rust. The six role Entry pkgs. Codegen runs in
# the recipe.
#
# phase-340 P2 — these rows used to carry `no_default_features = true` +
# `target_dir = "target-zenoh"`, and `just freertos build-examples` ALSO built
# the same six dirs with a bare in-leaf `cargo build`. Two builds of one thing,
# and only the bare one had a live consumer:
#
#   * `--no-default-features` was a NO-OP — none of the six packages declares a
#     `[features]` table, so there are no default features to turn off. The two
#     builds compiled byte-identical inputs; they differed only in WHERE they
#     wrote and at which profile.
#   * the `target-zenoh/` output had no live reader: its only resolver is
#     `build_freertos_rust_example_rmw`, whose two callers are the `#[ignore]`d
#     cyclonedds tests in `tests/freertos_qemu.rs` (they take the Cyclonedds
#     arm and error before the path is built).
#   * the bare build's `target/` output has TWO live readers —
#     `fixtures::binaries::freertos` (rtos_e2e's freertos rust lanes) and
#     `tests/freertos_run_plan_runtime.rs`.
#
# So the row is repointed at the build the tests actually consume, and the bare
# loop is deleted. The row is now the only builder, which gives it a coordinate
# and therefore the shared cargo group (phase-340 B3 migrated `freertos`); the
# bare loop had no row, hence no coordinate, hence no group — which is exactly
# why it fell outside B2/B3 and kept re-creating `examples/**/target/`.
#
# The recipe runs this lane at the `freertos-qemu` carve-out profile
# (`NROS_CARGO_PROFILE`, the same shape `just nuttx build-fixtures` uses for
# `nuttx-rust`), because that is the profile every FreeRTOS resolver looks for.
# ===========================================================================

