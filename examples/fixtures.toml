# Phase 274.W3 (RFC-0015 Model 1 embedded) — 2-tier C++ realtime workspace on
# FreeRTOS/mps2-an385 (QEMU). The codegen gate (board_is_freertos_embedded) emits
# per-tier setup functions + NativeTierSpec array + nros_app_main calling
# FreertosBoard::run_tiers, which delegates to nros_board_freertos_run_tiers
# (nros-board-freertos glue): one RTOS task per tier over one shared session.
# ctrl (high tier, prio=5, 10 ms) + telem (low tier, prio=2, 100 ms).
# Consumed by tests/realtime_tiers_cpp_freertos_e2e.rs.
# issue 0636 gap 2 — the RUST 2-tier realtime workspace on FreeRTOS/mps2-an385
# (QEMU), sibling of workspace-{c,cpp}-freertos-realtime.
#
# The Rust FreeRTOS multi-tier path (`Mps2An385Freertos::run_tiers` →
# `nros-board-freertos`'s `run_tiers_entry`) was exported, reachable from the
# `nros::main!` macro, and called by NOTHING: every FreeRTOS realtime fixture
# was C or C++, and the one Rust FreeRTOS entry (`workspaces/rust`) is
# single-tier `run_entry`. So #0636's boot-tier fix landed on this arm by
