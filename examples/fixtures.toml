# ---------------------------------------------------------------------------
# west compile-check lane — phase-350 W2 (issue 0536).
#
# The four fixtures `scripts/build/west-fixtures.sh` used to hold as two bash
# arrays. They are compile-check rows because that is what they assert:
# "configure (or build) succeeded and artifact X exists". `output` is the gate.
#
# THREE OF THE FOUR NEED NO IMAGE. Their consumers read a configure-time
# artifact and nothing else, so they build with `west-configure`
# (`west build --cmake-only`) instead of paying for a kernel link:
#
#   west_board_import        board_import.rs reads CMakeCache.txt, 4 vars
#   zephyr_self_pkg_rust     zephyr_self_pkg.rs reads system_config.h
#   zephyr_self_pkg_sibling  ditto
#
# The self-pkg pair is the sharpest case: the old block ran a link it KNEW
# would fail ("the link needs the rest of the runtime — out of scope"), threw
# the failure away, and stamped on a file written before the link began. The
# `output` field says that plainly now, and `--cmake-only` stops paying for it.
#
# `west_bringup_zephyr` genuinely boots its `zephyr.exe`, so it stays a full
# `west-build`. The difference is visible in `output`, which is what makes
# "configure only" a checkable property rather than a claim in a comment.
#
# Built by the WEST lane (west-fixtures.sh), never by compile-check-fixtures.sh:
# west needs a provisioned Zephyr workspace, so the lane that owns one runs them.
# ---------------------------------------------------------------------------

[[compile_check_fixture]]
id = "west_bringup_zephyr"
builder = "west-build"
dir = "packages/testing/nros-tests/fixtures/multi_pkg_workspace_zephyr"
west_subdir = "zephyr_app"
west_board = "native_sim/native/64"
west_extra = "-DCONF_FILE=prj.conf;prj-zenoh.conf"
output = "zephyr/zephyr.exe"

# phase-206 W2 — the RTOS half of the config-passthrough acceptance.
#
# W2's acceptance said "the same file, hosted and one RTOS build". The
# byte-identity and composition halves were proven on the host lane by
# `nros_rmw_cyclonedds_user_config`; NO RTOS IMAGE WAS EVER BUILT FOR IT, so
# the embedded half rested on the shared `session.cpp` path rather than on a
# measurement. This row is that measurement.
#
# Same dir and same bringup as the zenoh row above, deliberately. `demo_bringup/
# rmw/` holds `cyclonedds.xml` and no `zenoh.conf`, so the zenoh image bakes
# nothing and this one bakes the XML: the ACTIVE BACKEND decides which file is
# read, and the pair proves that rather than asserting it. The zenoh row is also
# the negative control -- an image whose bringup ships no config for its backend
# must still build, with no cmake participation at all (`__has_include`).
[[compile_check_fixture]]
id = "west_bringup_zephyr_cyclone_user_config"
builder = "west-build"
dir = "packages/testing/nros-tests/fixtures/multi_pkg_workspace_zephyr"
