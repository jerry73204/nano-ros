# core 1, not 0, because an UNPINNED tier lands on cpu 0 anyway — measured on
# this board, both ways:
#
#     unpinned          -> nros: core pin observed tier=`high` running_on=0
#     core = 1 declared -> nros: core pin tier=`high` cpu=1
#                          nros: core pin observed tier=`high` running_on=1
#
# The locator is QEMU's user-mode gateway (10.0.2.2). The native_sim rows use
