# RMW overlay: zenoh-pico backend.

CONFIG_NROS_RMW_ZENOH=y

# Zenoh-pico uses TCP to reach zenohd.
CONFIG_NET_TCP=y

# zenoh-pico thread + mutex requirements.
CONFIG_POSIX_API=y
CONFIG_MAX_PTHREAD_MUTEX_COUNT=32
CONFIG_MAX_PTHREAD_COND_COUNT=16
CONFIG_POSIX_THREAD_THREADS_MAX=16

# Resource sizing — zenoh-pico is lighter than DDS.
CONFIG_MAIN_STACK_SIZE=16384
# Issue 0155 — phase-271 moved the executor's default backing to a leaked
# heap allocation (~75 KB at Executor::open); 64 KB OOM'd at boot.
CONFIG_HEAP_MEM_POOL_SIZE=131072
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

CONFIG_NET_PKT_RX_COUNT=32
CONFIG_NET_PKT_TX_COUNT=32
CONFIG_NET_BUF_RX_COUNT=64
CONFIG_NET_BUF_TX_COUNT=64

CONFIG_NET_SHELL=y
CONFIG_NET_CONNECTION_MANAGER=y
CONFIG_DEBUG=y

# Issue 0163 — the Zephyr Rust global allocator is picolibc malloc, so the
# in-image backend's buffers come from COMMON_LIBC_MALLOC_ARENA_SIZE
# (default 16 KB), NOT the kernel heap. Mirrors prj-cyclonedds.conf's bump.
#
# issue 1145 / phase-392 W6 — the executor backing NO LONGER comes from here.
# It was a `Box::leak` out of this arena; W6 made it the named `.bss` static
# `nros_node::executor::backing::EXECUTOR_BACKING`. Leaving the arena at
# 1048576 reserves those bytes TWICE — once in the static, once as arena
# headroom nothing draws on any more.
#
# issue 1171 — the size is STATED, not measured. `nm` reports a DERIVED backing
# of 87,256 B on mps2_an385 and 88,328 B on native_sim/native/64 for this one
# conf (the carved tables hold pointers), so no copied number can pair both
# boards, and any copied number goes stale the next time an executor knob moves.
# Stating the word count makes the reservation `8 x` it on every target, so the
# arithmetic below is exact by construction:
#
#     1048576 - 8 * 11041 = 960248
#
# 11041 words = 88,328 B, the larger of the two boards' derived sizes. A value
# below what this image's executor needs is a COMPILE error naming the knob
# (`executor::backing`'s const assertion), never a silent under-payment.
# `check-executor-backing-arena-pairing` holds the three numbers together.
# nros-arena-base: 1048576
CONFIG_NROS_EXECUTOR_BACKING_U64S=11041
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=960248
