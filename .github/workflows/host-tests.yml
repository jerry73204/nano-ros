# Host-test tier (CI reorg / phase-253) — the host-side regression net.
#
# Folds the two host suites into one tier file (separate jobs, separate
# concurrency so the cheap unit lane can cancel-on-PR while the heavy
# integration lane always completes):
#   - unit        : `just test-unit` — workspace unit tests
#                   (`cargo nextest --workspace --exclude nros-tests`).
#   - integration : `just test-integration` — the nros-tests crate (QEMU/Zephyr/
#                   ROS-interop groups excluded), the scaffold/launch/codegen net.
#
# Medium/heavy lanes: PR (path-scoped) + nightly + on-demand — NOT every direct
# push to main (a per-push run was cancelled by the next push within ~10 min and
# never completed; #57 root). See docs/development/ci-workflow-reorg.md.
#
# EVERY step that invokes `just` or `nros` sources `./activate.sh` first. That is
# the repo's activation SSoT and CLAUDE.md's sweep contract; three steps here
# used to source `/opt/ros/humble/setup.bash` alone and six sourced nothing.
# activate.sh is a strict superset of the ROS line — it sources ROS itself
# (nounset-guarded, issue 0639) and additionally exports `nano_ros_ROOT`, which
# is how `find_package(nano_ros)` resolves: the config lives at the checkout
# root, not in a CMake prefix. Without it the workspace fixture build died at
#
#   CMake Error at CMakeLists.txt:23 (find_package):
#     ... CMake did not find one.
#
# for every generated workspace root, because a generated root deliberately sets
# no prefix. activate.sh only ever PREPENDS to PATH, so the `$GITHUB_PATH`
# entries earlier steps add (the in-tree CLI, play_launch_parser) survive it.
name: host-tests

on:
  # phase-395 — POST-merge, not pre-merge. This lane needs ROS on the runner and
  # its two jobs failed on every pull request; a red that is STRUCTURAL is not a
  # gate, it is the noise that teaches people to ignore CI. It gates nothing
  # (only `check` is required), so running it per-PR bought no safety and cost a
  # concurrent runner on every agent push.
  #
  # `push` to main rather than schedule-only: this is L2, and bounding a
  # regression to one commit is most of what post-submit is for. It comes back
  # pre-merge when a self-hosted runner can actually satisfy it (W6).
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "examples/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "justfile"
      - "just/**"
      - "cmake/**"
      - "zephyr/cmake/**"
      - "nros-sdk-index.toml"
      - ".github/workflows/host-tests.yml"
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  # ----- workspace unit tests (cheap; cancel-on-PR) -----
  unit:
    name: workspace unit tests
    runs-on: ubuntu-22.04
    # Per-job concurrency: the cheap unit lane supersedes its older PR run; the
    # heavy integration lane below uses its own group (cancel: false).
    concurrency:
      group: host-tests-unit-${{ github.ref }}-${{ github.event_name }}
      # Was keyed on `pull_request`, which this workflow no longer fires on —
      # the condition would have been permanently false, silently disabling
      # superseding. On push-to-main superseding is CORRECT: post-submit asks
      # "is main good now", so a newer commit's answer subsumes an older one's.
      cancel-in-progress: ${{ github.event_name == 'push' }}
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/newslabntu/nano-ros-ci:humble
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout nano-ros
        uses: actions/checkout@v4

      - name: Cache CLI build (Phase 218)
        uses: actions/cache@v4
        with:
          path: packages/cli/target
          key: nros-cli-${{ runner.os }}-${{ hashFiles('packages/cli/Cargo.lock', 'packages/cli/**/Cargo.toml', 'packages/cli/**/*.rs') }}
          restore-keys: |
            nros-cli-${{ runner.os }}-

      - name: Build nros CLI from packages/cli/ (Phase 218)
        run: |
          git submodule update --init --depth 1 packages/cli/third-party/play_launch
          cargo build --release --manifest-path packages/cli/Cargo.toml --bin nros
          # phase-429 W5 — ASSERT the binary matches the checkout, do not hope.
          # The CLI cache key is narrower than `source_stamp.rs`'s watch set
          # (it misses `.jinja`, `cli-source-dirs.txt`, the out-of-tree crate
          # dirs and the `play_launch` pin), so an exact-key hit exists for a
          # tree whose stamp has moved. Fresh-checkout mtimes usually make
          # cargo rebuild; usually is not a guarantee, and a binary emitting
          # code the runtime did not expect is what RFC-0090 exists to stop.
          "$GITHUB_WORKSPACE/packages/cli/target/release/nros" source-stamp >/dev/null
          echo "$GITHUB_WORKSPACE/packages/cli/target/release" >> "$GITHUB_PATH"

      # phase-413 W5 — the scope verb, same as the integration job below.
      # `just setup native` expands to `nros setup --build-sources` and
      # `just ci provision-zenohd`, which is exactly what this job spelled out,
      # plus the CLI/resolver and the host facts every tier asserts.
      #
      # It also fetches qemu and the XRCE agent, which the unit tests do not
      # use. That is the price of one vocabulary: a job body is
      # `just setup <scope>` plus one command, and both are prebuilt tarball
      # fetches from the index rather than source builds.
      - name: just setup native
        run: |
          source ./activate.sh
          just setup native

      - name: just test-unit
        run: |
          source ./activate.sh
          just test-unit

  # ----- nros-tests integration (heavy; always completes) -----
  integration:
    name: nros-tests integration (host)
    runs-on: ubuntu-22.04
    concurrency:
      group: host-tests-integration-${{ github.ref }}-${{ github.event_name }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/newslabntu/nano-ros-ci:humble
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout nano-ros
        uses: actions/checkout@v4

      - name: Cache CLI build (Phase 218)
        uses: actions/cache@v4
        with:
          path: packages/cli/target
          key: nros-cli-${{ runner.os }}-${{ hashFiles('packages/cli/Cargo.lock', 'packages/cli/**/Cargo.toml', 'packages/cli/**/*.rs') }}
          restore-keys: |
            nros-cli-${{ runner.os }}-

      - name: Build nros CLI from packages/cli/ (Phase 218)
        run: |
          git submodule update --init --depth 1 packages/cli/third-party/play_launch
          cargo build --release --manifest-path packages/cli/Cargo.toml --bin nros
          # phase-429 W5 — ASSERT the binary matches the checkout, do not hope.
          # The CLI cache key is narrower than `source_stamp.rs`'s watch set
          # (it misses `.jinja`, `cli-source-dirs.txt`, the out-of-tree crate
          # dirs and the `play_launch` pin), so an exact-key hit exists for a
          # tree whose stamp has moved. Fresh-checkout mtimes usually make
          # cargo rebuild; usually is not a guarantee, and a binary emitting
          # code the runtime did not expect is what RFC-0090 exists to stop.
          "$GITHUB_WORKSPACE/packages/cli/target/release/nros" source-stamp >/dev/null
          echo "$GITHUB_WORKSPACE/packages/cli/target/release" >> "$GITHUB_PATH"

      # phase-437 — the fixture builders' rustc fan-out, DERIVED.
      #
      # Every consumer below used the literal "2". That number was measured on
      # the 2-vCPU / 7 GB runner of issue #57 and this job no longer runs on
      # one: `just ci tier1` in this same job sets no cap and its own summary
      # reports `249 gate(s) ran at -P4`, because `run-gates-parallel.sh` asks
      # `nproc`. So the cap was halving exactly the two steps that are most of
      # this job's wall clock, to respect a machine that is gone.
      #
      # The bound is MEMORY, not CPU, and that is why this is not simply
      # `nproc`. What issue #57 saw was the OOM killer taking rustc mid-compile;
      # cores were never the scarce thing. ~2 GB per concurrent rustc is the
      # rule of thumb this uses, so the runner is free to grow in either
      # dimension and the cap follows whichever runs out first.
      #
      # Written to $GITHUB_ENV rather than repeated per step: the fixture builds
      # and `just ci tier1` must agree, and three literals that must match is
      # how they stop matching.
      - name: Derive the build parallelism
        run: |
          cpus="$(nproc)"
          mem_gb="$(awk '/MemTotal/ {print int($2 / 1024 / 1024)}' /proc/meminfo)"
          by_mem=$(( mem_gb / 2 ))
          [ "$by_mem" -lt 1 ] && by_mem=1
          jobs=$(( cpus < by_mem ? cpus : by_mem ))
          echo "NROS_CI_BUILD_JOBS=$jobs" >> "$GITHUB_ENV"
          echo "runner: ${cpus} cpu, ${mem_gb} GiB -> NROS_CI_BUILD_JOBS=${jobs}"

      # phase-413 W5 — provision with the SCOPE VERB, not four hand-rolled
      # steps. `just setup native` is what a user runs, and it expands to the
      # same sequence this lane spelled out: `nros setup --build-sources` (the
      # union of vendored sources), `just ci provision-zenohd`, and the qemu /
      # xrce-agent / play_launch_parser tools.
      #
      # It also runs `_setup-common`, which builds the CLI and
      # `nros-launch-resolve` AND provisions the two host facts every tier
      # asserts — cross Rust targets and pinned corrosion. That is what this
      # lane was missing: `just ci tier1` failed on three unmet preconditions
      # that no step here provisioned, so the tier never started.
      - name: just setup native
        run: |
          source ./activate.sh
          just setup native

      # CI-only: export the provisioned play_launch_parser for later steps.
      # `just setup native` installs it into the store; a container job still
      # has to put it on PATH, and it stays best-effort (workspace-entry
      # fixtures SKIP without it, every other fixture builds).
      - name: Export play_launch_parser on PATH
        run: |
          plp_bin="$(dirname "$(find "$HOME/.nros/sdk/play_launch_parser" -type f -name play_launch_parser -path '*/bin/*' 2>/dev/null | head -1)")"
          [ -n "$plp_bin" ] && echo "$plp_bin" >> "$GITHUB_PATH" || true

      # The native integration tests spawn PREBUILT example binaries via
      # `require_prebuilt_binary`. Stage them by building the fixtures the way a
      # user does. Issue #29 — split into per-stage steps with `df` checkpoints
      # (a build that fills the shared ~146 GB disk kills the agent + discards the
      # step's log); `build-fixture-rust-core` only (+17 GB), extras (~52 GB) NOT
      # run (would starve test-integration → ENOSPC). CI-build env scoped to the
      # fixture steps only (never the job — test-integration asserts on symbols).
      - name: Build rust core fixtures
        env:
          # `CARGO_PROFILE_RELEASE_LTO: "off"` USED TO BE HERE. It was the only
          # thing that differed between this step and "Build workspace fixtures"
          # below, and it is what made the two share NOTHING: cargo hashes the
          # profile into `-C metadata`, so every crate they have in common was
          # compiled twice — across the two steps that are ~53 of this job's ~91
          # minutes.
          #
          # It was also an in-place MUTATION of `profile.release` through the
          # environment, which is worse than a slow build: the artifacts landed
          # in `target/release/` while not being release builds, so nothing
          # downstream could tell this tree from a real one. The repo has a
          # named profile for exactly this shape (`nros-iterate` = release with
          # `lto = "off"`), reached through `NROS_CARGO_PROFILE` / `nros
          # profile`, and an env override reaches around it.
          #
          # Dropping it rather than naming a profile, because naming one keeps
          # the two steps in different profile directories and the duplication
          # with them. Plain `release` for both is the only spelling that lets
          # the workspace step start warm. The trade is real and one-directional:
          # THIS step gets slower (it now pays fat LTO), and the step below
          # should save more than that by reusing it. If CI says otherwise,
          # the answer is a shared named profile for both steps — never this
          # env var back on one of them.
          #
          # `RUSTFLAGS: "-C debuginfo=0"` is gone for a different reason: it is
          # redundant. Cargo's `release` default is already `debug = false`, and
          # `[profile.release]` in `Cargo.toml` does not override it.
          #
          # Issue #71 is UNAFFECTED: it forbids `lto = "off"` on the workspace
          # step (two Rust staticlibs each bundle `std`, and without LTO's DCE
          # both keep `rust_begin_unwind` -> `multiple definition`). This change
          # removes an `lto = "off"`; it does not add one.
          #
          # Issue #57 Cause-1: cap the fixture builder's rustc fan-out — a rustc
          # OOM-killed mid-compile is what this prevents. DERIVED, not "2":
          # the literal was measured on the 2-vCPU / 7 GB runner this job no
          # longer gets (it runs 4 vCPU / ~16 GB today — `just ci tier1` in the
          # step below sets no cap and its own summary line reports `-P4`), so
          # the cap was halving the two steps that are most of this job's wall
          # clock. See "Derive the build parallelism" above for how it is
          # computed and why the bound is MEMORY rather than CPU.
          NROS_BUILD_JOBS: ${{ env.NROS_CI_BUILD_JOBS }}
          CARGO_BUILD_JOBS: ${{ env.NROS_CI_BUILD_JOBS }}
        run: |
          source ./activate.sh
          mkdir -p build/ci-logs
          echo "before:"; df -h / | tail -1
          # FAIL, do not swallow. This used to end `|| { tail; echo "partial —
          # [SKIPPED]"; }`, so a build that died at line one reported the step as
          # SUCCESS; the tests then skipped for absent fixtures and the run blamed
          # a skip budget. Ten runs of a green step over a failed build.
          # `check-skip-budget` (issue 0584) rejects exactly this laundering — a
          # missing in-lane fixture is a hard failure — so the swallow could only
          # ever produce a red whose stated reason was wrong.
          just native build-fixture-rust-core > build/ci-logs/rust-core.log 2>&1 \
            || { echo "::group::rust-core FAILED tail"; tail -120 build/ci-logs/rust-core.log; echo "::endgroup::"; exit 1; }
          echo "after rust-core ($(wc -l < build/ci-logs/rust-core.log) lines suppressed):"; df -h / | tail -1

      - name: Build workspace fixtures
        env:
          # NB (issue #71): do NOT add `CARGO_PROFILE_RELEASE_LTO: "off"` here. The
          # native C++/mixed workspace Entry links two Rust staticlibs that each
          # bundle `std`; the FFI crate's `lto = true` DCE-strips the redundant
          # `rust_begin_unwind`. Forcing LTO off keeps it → `multiple definition`.
          # `RUSTFLAGS: "-C debuginfo=0"` dropped: redundant. Cargo's `release`
          # default is `debug = false` and `[profile.release]` does not override
          # it, so this set a flag that changed nothing while making RUSTFLAGS a
          # fingerprint input the step above had to match exactly.
          NROS_BUILD_JOBS: ${{ env.NROS_CI_BUILD_JOBS }}
          CARGO_BUILD_JOBS: ${{ env.NROS_CI_BUILD_JOBS }}
        run: |
          source ./activate.sh
          just native build-workspace-fixtures > build/ci-logs/workspace.log 2>&1 \
            || { echo "::group::workspace FAILED tail"; tail -120 build/ci-logs/workspace.log; echo "::endgroup::"; \
                 echo "::group::issue 0919 — feature resolution for zpico-sys"; \
                 for ws in bridge-cyclonedds rust; do \
                   echo "--- examples/workspaces/$ws"; \
                   ( cd "examples/workspaces/$ws" 2>/dev/null \
                     && cargo tree -e features -i zpico-sys --offline 2>&1 | head -40 ) || true; \
                   echo "--- $ws generated selection crate"; \
                   cat "examples/workspaces/$ws/generated/nros-selection/native_entry/Cargo.toml" 2>/dev/null | grep -v '^#' | grep . || true; \
                   echo "--- $ws generated entry root"; \
                   cat "examples/workspaces/$ws/build/posix-zenoh/native_entry/Cargo.toml" 2>/dev/null | grep -v '^#' | grep . || true; \
                 done; \
                 echo "::endgroup::"; \
                 exit 1; }
          echo "after workspace ($(wc -l < build/ci-logs/workspace.log) lines suppressed):"; df -h / | tail -1

      # phase-411 — run the TIER, not a hand-rolled approximation of it.
      #
      # This lane built `native build-fixture-rust-core` + `build-workspace-
      # fixtures` and then `just test-integration`, which is roughly tier 1 —
      # and "roughly" is the problem: `check-tier-has-ci-owner` found Tier1
      # declared in the RFC-0061 ladder and invoked by NO workflow, so the
      # tier's definition and this lane's behaviour could drift with nothing
      # to notice. `just ci tier1` is preconditions + check +
      # rust-rtos-link-check + test-all, narrowed to the tier-1 coordinates.
      #
      # The fixture builds above stay: the tier ASSERTS its preconditions, it
      # does not provision them.
      - name: just ci tier1
        env:
          CARGO_BUILD_JOBS: ${{ env.NROS_CI_BUILD_JOBS }}
          # This lane builds a DELIBERATE SUBSET of the native fixtures --
          # `build-fixture-rust-core` + `build-workspace-fixtures`, with the
          # ~52 GB extras omitted so test-integration does not hit ENOSPC (see
          # the steps above). So it cannot honestly claim the `lane=native`
          # coverage that `_require-fixtures` checks for, and writing that
          # stamp would be a lie rather than a fix.
          #
          # The documented bypass is exactly this case ("built them another
          # way?"). It only skips the PRE-FLIGHT: a missing in-lane fixture is
          # still a hard failure at test time via `check-skip-budget` (issue
          # 0584), so nothing is laundered into a skip.
          NROS_SKIP_FIXTURE_CHECK: "1"
        run: |
          source ./activate.sh
          mkdir -p build/ci-logs
          set +e
          just ci tier1 > build/ci-logs/ci-tier1.log 2>&1
          rc=$?
          set -e
          echo "::group::ci tier1 output (tail)"; tail -200 build/ci-logs/ci-tier1.log; echo "::endgroup::"
          exit $rc

      - name: Report skipped fixtures (post-run)
        if: always()
        run: |
          if [ -f target/nextest/default/junit.xml ]; then
            echo "::group::skipped fixtures"
            grep -E '<skipped|\[SKIPPED\]' target/nextest/default/junit.xml \
              | head -100 || echo "(no skips recorded)"
            echo "::endgroup::"
          else
            echo "(no junit.xml — test-integration may have failed before any test ran)"
          fi

      - name: Upload nextest JUnit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-integration-tests-junit
          path: target/nextest/default/junit.xml
          if-no-files-found: ignore
          retention-days: 7
