# Merge-queue lane — phase-395 W7.
#
# Runs on `merge_group`, the event GitHub fires for a batch it has speculatively
# merged. This is the ONLY place a pre-merge lane may be expensive: it runs once
# per batch rather than once per push, which is the whole economic argument for
# batching.
#
# WHY THE SELF-HOSTED JOB IS GATED ON A VARIABLE
#
# A required check that can never start does not fail — it stays PENDING, and a
# merge queue waits for pending forever. So a self-hosted job made required
# before a runner exists does not degrade the repo, it FREEZES it: nothing
# merges, and the symptom (a spinner) looks like GitHub being slow rather than
# like a misconfiguration.
#
# `vars.NROS_SELF_HOSTED_READY` is that interlock. Until a runner is registered
# and the variable is set, the L3 job is skipped and the queue is carried by the
# hosted job alone — which is a real gate, just a narrower one. Turn it on with
# `scripts/ci/enable-merge-queue.sh --self-hosted-ready` AFTER
# `just runner-doctor <labels>` passes on the machine.
#
# WHY LOGS UPLOAD UNCONDITIONALLY
#
# A self-hosted runner behind NAT cannot be reached to look at afterwards. If
# the logs are not pushed at the moment of failure they do not exist, and
# `if: always()` is the difference between a diagnosable red and a rerun.
name: queue

on:
  merge_group:
  workflow_dispatch:

concurrency:
  # NOT cancel-in-progress. Cancelling a queue job makes the batch fail with no
  # verdict, and GitHub then ejects PRs that were never actually tested.
  group: queue-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  # phase-395 W13 — the L1 job that used to live here is GONE.
  #
  # `pr-checks`'s `check` job now runs the compile tier on `merge_group`, and it
  # covers strictly more than `just ci-l1` did (check-fast + check-build +
  # no_std + test-unit, plus the 133 source gates). Both ran on every merge
  # group, so the same tree compiled TWICE on the critical path to landing —
  # pure latency on the one lane that bounds how fast ten agents can merge.
  #
  # `check` is also the REQUIRED context, so this job gated nothing. Keeping it
  # meant paying for a second opinion nobody consulted.

  # L3 — cross build + link + symbol checks. Needs the RTOS toolchains, so it is
  # self-hosted, so it is gated. See the header: a required check that cannot
  # start freezes the queue rather than failing it.
  l3:
    name: L3 (cross build + link)
    if: ${{ vars.NROS_SELF_HOSTED_READY == 'true' }}
    runs-on: [self-hosted, linux, nros-sdk-zephyr, nros-big]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # phase-411 W4 — a CI job is `just setup <scope>` then one command a
      # developer can type. Nothing here is CI-only orchestration.
      #
      # WHAT THIS REPLACES, AND WHY IT WAS HERE
      #
      # Four hand-rolled steps stood here until phase-413 W1b: `just setup-cli`,
      # `just setup-launch-resolve`, `nros sync` on the rust workspace, and a
      # loop syncing the three leaves L3 cross-builds. They existed because the
      # leaves carry a `.cargo/config.toml` whose `include` names the GITIGNORED
      # `nros-patch.toml` that only `nros sync` writes, and cargo treats a
      # missing include as a HARD error during manifest parse (issue 0463):
      #
      #   error: 54 unresolved `include` target(s) across 54 of 73 tracked
      #          .cargo/config.toml files
      #
      # That is issue 0992: the codegen stage was mandatory and reachable from
      # no verb, so this lane did it by hand. The workaround was LOAD-BEARING —
      # it is what kept the queue green while `build-wide.yml`, running the same
      # recipe without it, failed on that exact error for a day (issue 0996).
      #
      # `just setup <scope>` now runs `_setup-common` (the guarded play_launch
      # submodule init, the CLI, the launch resolver) and the build verb runs
      # `_codegen` for every scope, in dependency order. The steps are gone
      # because the toolchain does the work, not because the work stopped
      # mattering — and that is the point of the phase: a hand-rolled step in a
      # workflow is a claim the toolchain cannot do the thing itself, and each
      # true one is a defect nobody is looking at.
      #
      # NROS_SKIP_LEAF_INCLUDE_CHECK went with them. It skipped
      # `_require-leaf-includes`, never the sync itself, and post-0992 the sync
      # happens inside `_codegen` regardless — so the variable would now
      # suppress only the ASSERT that the codegen this lane just ran produced a
      # resolvable tree. That is the one thing worth keeping.
      - name: just setup tier2
        run: |
          source ./activate.sh
          just setup tier2

      # AFTER `setup` — phase-413 W2, same reason as `run-matrix.yml`.
      #
      # `runner-doctor.sh` checks `$root/build/qemu/bin/qemu-system-arm` first
      # ("the project-local patched build is the PRIMARY path (phase-143)") and
      # only falls back to the system qemu. That path is inside the CHECKOUT and
      # `just setup tier2` creates it — the tier-2 preset includes the `qemu`
      # module, whose `setup` ends in `just qemu setup-qemu`. Asserting before
      # provisioning asks the host for something the next step supplies, which
      # is what killed every `run-matrix` run at step 2 on a system qemu 6.2.
      #
      # A genuinely mislabeled runner still fails here, and `setup` would have
      # failed on it first.
      - name: Verify this runner's labels are true
        run: ./scripts/ci/runner-doctor.sh nros-sdk-zephyr,nros-big

      # `ci matrix build` — the (breadth, depth) pair, not a lane letter.
      # phase-410 W4: `l3` survives as the implementation; this spelling says
      # WHICH breadth at WHICH depth, which is what the file is for. It is the
      # same recipe (`_matrix-build`'s body IS `l3`), now with one spelling
      # across the repo instead of two.
      - name: just ci matrix build
        run: |
          source ./activate.sh
          just ci matrix build
      - name: Upload logs and size reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: queue-l3-logs
          path: |
            target/nextest/**/junit*.xml
            build/**/*.log
          if-no-files-found: ignore
          retention-days: 7
      # Between jobs on a shared runner, one leaked peer is every later job's
      # flake. `always()` because a cancelled job leaks the most.
      - name: Sweep orphans and disk
        if: always()
        run: ./scripts/ci/runner-sweep.sh || true

  # phase-405 — make the interlocked job's SKIP visible in the run that skipped
  # it. See scripts/ci/report-interlock-coverage.sh for why this warns rather
  # than fails when no runner is registered, and fails when one supposedly is.
  #
  # `if: always()` so it reports on a skip; `needs` so it sees the result.
  coverage:
    name: coverage report (did L3 run?)
    needs: [l3]
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Report whether the interlocked lane ran
        run: ./scripts/ci/report-interlock-coverage.sh "L3 (cross build + link)" "${{ needs.l3.result }}" "${{ vars.NROS_SELF_HOSTED_READY }}"
