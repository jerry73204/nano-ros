  # Clean-system bootstrap probe (issue #204): execute the book's documented
  # setup steps VERBATIM in a pristine ubuntu:24.04 container (steps are
  # extracted from the `probe=NN`-tagged book blocks — scripts/probe/ — so
  # the probe cannot drift from what users read) and assert the first-node
  # chapter's documented outcome (talker prints `Publishing: 'Hello World: 1'`).
  # 07:00 cron + dispatch only — NOT per-PR (cold bootstrap builds the nros
  # CLI + the talker from source inside the container, ~45 min).
  bootstrap-probe:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '0 7 * * *' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: nightly-bootstrap-probe-${{ github.ref }}-${{ github.event_name }}
    permissions:
      contents: read
    steps:
      # Full history: the probe container clones from this checkout
      # (mounted read-only), and cloning from a shallow repo fails.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Hosted runners leave ~14 GB free; the in-container rustup + CLI +
      # talker builds need more. Drop the preinstalled SDK bloat.
      - name: Reclaim host disk
        run: |
          echo "before:"; df -h / | tail -1
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache/CodeQL \
              /usr/share/dotnet /usr/local/.ghcup 2>/dev/null || true
          echo "after:";  df -h / | tail -1

      # actions/checkout leaves a detached HEAD; the probe clones by branch.
      - name: Name the commit under test
        run: git switch -c probe-under-test 2>/dev/null || git checkout -b probe-under-test

      - name: Run bootstrap probe
        run: PROBE_BRANCH=probe-under-test ./scripts/probe/run-bootstrap-probe.sh

  # phase-411 — tier 2 NIGHTLY, actually invoked.
  #
  # This file's header has said "the 07:00 cron is also where
  # `just ci-matrix-nightly` lives" since RFC-0061, and three places echo that
  # string into a summary — but nothing ran it. `check-tier-has-ci-owner`
  # found the tier declared in the ladder and owned by no workflow. Prose is
  # not an owner.
  #
  # Interlocked like post-submit's tier-2 job: the pairwise cover needs the
  # RTOS toolchains, so it is self-hosted, so a job that cannot start must not
  # look like one that passed. `coverage-matrix-nightly` reports the skip.
  matrix-nightly:
    name: tier 2 nightly (pairwise cover)
    if: ${{ vars.NROS_SELF_HOSTED_READY == 'true' }}
    runs-on: [self-hosted, linux, nros-qemu, nros-sdk-zephyr, nros-big]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: just setup tier2-nightly
        run: |
          source ./activate.sh
          just setup tier2-nightly
      # AFTER `setup` — phase-413 W2, same as run-matrix (#279), queue (#253)
      # and build-wide (#249).
      #
      # `runner-doctor.sh` checks `$root/build/qemu/bin/qemu-system-arm` FIRST
      # ("the project-local patched build is the PRIMARY path (phase-143) … a
      # host with it needs nothing from the system") and falls back to the
      # system qemu only when that is absent. That path is inside the CHECKOUT,
      # and `just setup tier2-nightly` creates it — the lane expands to
      # `esp32 freertos native nuttx qemu threadx_linux threadx_riscv64 zephyr`,
      # and the `qemu` module's `setup` ends in `just qemu setup-qemu`.
      #
      # Asserting before provisioning asks the host for something the next step
      # supplies. This job carries the same `nros-qemu` label on the same runner
      # class as `run-matrix`, where it failed at step 2 against a system qemu
      # 6.2 in every run — provisioning nothing, testing nothing, and reporting
      # it as a host that needs `runner-provision.sh`.
      #
      # A genuinely mislabeled runner still fails, one step later, and `setup`
      # would have failed on it first.
      - name: Verify this runner's labels are true
        run: ./scripts/ci/runner-doctor.sh nros-qemu,nros-sdk-zephyr,nros-big

      # THE MISSING MIDDLE — phase-413 W2.
      #
      # The documented chain is `setup` -> `build` -> `test` (phase-411 W4), and
      # this job went straight from setup to the test lane. `ci matrix-nightly`
      # opens with `_lane-gate tier2-nightly`, which runs `check-fixtures-stale.sh` — a
      # FRESHNESS GATE, not a build. So the lane asked "are the fixtures fresh?"
      # of a tree that had never built them.
      #
      # On a self-hosted runner with a persistent workspace that can look like it
      # works, because a previous run left artifacts behind. It stops looking
      # like it works the moment the per-leaf `generated/` msg crates are absent,
      # and then the gate cannot even build a fixture to judge it:
      #
      #   ERROR: 104 rust fixture(s) could NOT be built by the staleness probe:
      #     examples/native/rust/talker
      #         error: failed to load manifest for dependency `std_msgs`
      #     examples/native/rust/service-client
      #         error: failed to load manifest for dependency `example_interfaces`
      #
      # `just build <scope>` is the stage that produces them: it runs `_codegen`
      # (issue 0992) and then the lane's fixtures. Naming the SAME scope as
      # setup and test keeps one vocabulary across the three steps, which is the
      # property phase-411 exists to give.
      - name: just build tier2-nightly
        run: |
          source ./activate.sh
          just build tier2-nightly

      - name: just ci matrix-nightly
        run: |
          source ./activate.sh
          just ci matrix-nightly
      - name: Sweep orphans and disk
        if: always()
        run: ./scripts/ci/runner-sweep.sh || true

  coverage-matrix-nightly:
    name: coverage report (did tier 2 nightly run?)
    needs: [matrix-nightly]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Report whether the interlocked lane ran
        run: ./scripts/ci/report-interlock-coverage.sh "tier 2 nightly (pairwise cover)" "${{ needs.matrix-nightly.result }}" "${{ vars.NROS_SELF_HOSTED_READY }}"
