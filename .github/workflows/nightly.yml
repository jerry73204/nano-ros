# Nightly tier (CI reorg / phase-253) — the heavy per-platform + Zephyr sweeps.
#
# Folds the two heaviest lanes into one tier file. They keep SEPARATE nightly
# crons and SEPARATE job-level concurrency, so a `github.event.schedule` guard
# routes each cron to its own job set (the 07:00 platform sweep does not drag in
# the Zephyr jobs, and vice-versa):
#   - platform : per-platform setup/build/test matrix (`just <plat> …`).
#                cron 0 7. e2e on schedule / dispatch-with-run_e2e.
#   - zephyr   : dual-line (3.7 + 4.4) example builds + copy-out check
#                (`just zephyr build-one/ci-both/check-copy-out`). cron 0 5.
#
# The 07:00 cron is also where `just ci-matrix-nightly` lives — RFC-0061's tier-2
# pairwise cover over platform x lang x rmw x kind. It runs DISTRIBUTED, because
# the fixture build scripts need per-platform toolchain env that only the
# `just <module>` recipes export and the cover spans eight modules whose SDKs do
# not coexist on one runner:
#   - `lane`          computes the cover (`lane-coords tier2-nightly`)
#   - `changes`       derives the platform matrix from it, instead of a hand list
#   - `lane-coverage` asserts every lane module actually has a job somewhere in
#                     nightly CI — `native` in host-tests.yml, `zephyr` on the
#                     05:00 cron, the rest in the platform matrix
# Without that last job the coverage claim would be a sentence in an RFC: a new
# platform could join the matrix, join the lane, and never be built by anything.
#
# PR (path-scoped, per-platform / zephyr-paths) + nightly + on-demand — NOT every
# direct push to main (the 6-platform × 2-line load is the cadence explosion the
# reorg removes; #57). `cancel-in-progress` only on PR. See
# docs/development/ci-workflow-reorg.md.
name: nightly

on:
  # phase-395 — NO `pull_request`. This is the L3/L4 cross-build matrix: it
  # needs the Zephyr SDK, cross toolchains and QEMU, none of which a hosted
  # runner has, so all 8 jobs failed on every PR. Structurally unable to pass is
  # not flaky and is not a gate — it is 8 concurrent runners of pure noise per
  # agent push, sitting beside the one check that actually gates.
  #
  # It stays on the schedule, where it can be provisioned, and on dispatch.
  # Bringing it pre-merge requires a self-hosted runner (W6) — `queue.yml`'s L3
  # job is the place for that, gated on NROS_SELF_HOSTED_READY.
  workflow_dispatch:
    inputs:
      run_e2e:
        description: "Run the QEMU test/e2e step (not just build)"
        type: boolean
        default: true
  schedule:
    - cron: "0 5 * * *"   # Zephyr dual-line
    - cron: "0 7 * * *"   # per-platform sweep (QEMU e2e)

permissions:
  contents: read
  packages: read

env:
  # Zephyr jobs build only the zenoh examples — skip the heavy Micro-XRCE-DDS
  # Agent (Fast-DDS superbuild) `just setup zephyr` builds for XRCE runtime tests.
  NROS_ZEPHYR_SKIP_XRCE_AGENT: "1"

jobs:
  # ===== tier-2 nightly lane (RFC-0061 / phase-318 W4.d) ================
  # `just ci-matrix-nightly` is the pairwise cover over platform x lang x rmw x
  # kind. It cannot run as ONE job: the fixture build scripts need per-platform
  # toolchain env that only the `just <module>` recipes export, and the cover
  # spans eight modules whose SDKs do not coexist on one runner. So the lane runs
  # DISTRIBUTED — computed here, driving the `platform` matrix, and checked by
  # `lane-coverage`.
  #
  # Computing it is the point. The platform list used to be hand-written as
  # `all="qemu freertos …"`, so adding a platform to `matrix::CELLS` extended the
  # lane on paper and nothing on the runners — the rot `ci_lane` exists to
  # prevent, reintroduced one layer out in a workflow yml.
  #
  # Its OWN job, not a step in `changes`: `changes` gates the Zephyr cron too, and
  # a cargo failure here must not take down jobs that never needed the lane.
  # Skipped on the 05:00 cron together with `platform`, its only consumer.
  lane:
    if: ${{ github.event_name != 'schedule' || github.event.schedule == '0 7 * * *' }}
    name: tier-2 nightly lane selection
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.lane.outputs.modules }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: lane-coords-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: lane-coords-${{ runner.os }}-
      # `nros-tests` depends on `nros`, which pulls ros-launch-manifest from the
      # NESTED resolver submodule — `actions/checkout` fetches neither by default,
      # and the build fails at path resolution rather than anywhere informative.
      # `--recursive` is load-bearing: the manifest sits inside the resolver.
      - name: Fetch the resolver submodule (nros-tests -> nros -> rlm)
        run: git submodule update --init --depth 1 packages/cli/third-party/play_launch

      - id: lane
        run: |
          set -euo pipefail
          # No `source ./activate.sh` needed: verified this target does not reach
          # zpico-sys, whose build.rs panics on an unset FREERTOS_PORT.
          cargo build --release -p nros-tests --bin lane-coords
          bin=target/release/lane-coords
          "$bin" tier2-nightly           > lane-coords.txt
          "$bin" tier2-nightly --modules > lane-modules.txt
          # An empty lane would select no platforms and the whole tier would go
          # green having built nothing.
          [ -s lane-coords.txt ] && [ -s lane-modules.txt ]
          echo "modules=$(jq -Rcs 'split("\n") | map(select(length>0))' < lane-modules.txt)" >> "$GITHUB_OUTPUT"
          {
            echo "### tier-2 nightly lane (\`ci-matrix-nightly\`)"
            echo
            echo "\`$(wc -l < lane-coords.txt)\` fixture coordinate(s), \`$(wc -l < lane-modules.txt)\` \`just\` module(s)."
            echo
            echo '```'
            cat lane-coords.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: tier2-nightly-lane
          path: |
            lane-coords.txt
            lane-modules.txt

  # Per-platform path filter → a JSON list of platforms + a zephyr flag. On a PR,
  # only the platforms / lines whose code (or the shared core) changed; on
  # main/dispatch/schedule, all (the per-job `github.event.schedule` guard then
  # routes each cron to its own job set).
  #
  # ISSUE 1029, and read this before adding a `needs: changes` to anything:
  # THIS JOB IS ONLY USABLE ON THE 07:00 CRON. It `needs: lane`, `lane` is
  # skipped on the 05:00 cron, and `if: always()` makes THIS job run there
  # without making anything downstream of it run — measured over 29 scheduled
  # runs, and it silenced the whole Zephyr lane for three weeks. A job on the
  # 05:00 cron reads `github.event.schedule` itself.
  changes:
    needs: lane
    if: ${{ always() }}
    runs-on: ubuntu-latest
    outputs:
      platforms: ${{ steps.set.outputs.platforms }}
      zephyr: ${{ steps.set.outputs.zephyr }}
      # Issue 1029 — DIAGNOSTIC ONLY since the third pass. This decides nothing:
      # the three zephyr jobs gate on the event payload directly, because
      # nothing downstream of `changes` runs on the 05:00 cron (`changes`
      # `needs: lane`, and `lane` is skipped there). It is still computed, and
      # `zephyr-gate-report` still publishes it, so the next incident on this
      # edge has a value to read instead of a hypothesis.
      run_zephyr: ${{ steps.set.outputs.run_zephyr }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            core: &core
              - 'packages/core/**'
              - 'packages/rmw/zenoh/**'
              - 'just/**'
              - 'justfile'
              - 'cmake/**'
              - 'nros-sdk-index.toml'
            qemu: [ *core, 'examples/qemu-arm-baremetal/**', 'packages/boards/nros-board-mps2-an385*/**' ]
            freertos: [ *core, 'examples/qemu-arm-freertos/**', 'packages/boards/nros-board-freertos/**', 'packages/boards/nros-board-mps2-an385-freertos/**' ]
            nuttx: [ *core, 'examples/qemu-arm-nuttx/**', 'packages/boards/nros-board-nuttx*/**' ]
            threadx_linux: [ *core, 'examples/threadx-linux/**', 'packages/boards/nros-board-threadx-linux/**' ]
            threadx_riscv64: [ *core, 'examples/qemu-riscv64-threadx/**', 'packages/boards/nros-board-threadx-qemu-riscv64/**' ]
            esp32: [ *core, 'examples/qemu-esp32-baremetal/**', 'packages/boards/nros-board-esp32-qemu/**', 'packages/platform/nros-platform-esp32-qemu/**' ]
            zephyr:
              - 'examples/zephyr/**'
              - 'packages/**'
              - 'cmake/**'
              - 'zephyr/**'
              - 'scripts/zephyr/**'
              - 'just/zephyr.just'
              - 'ci/docker/zephyr-ros/**'
      - id: set
        env:
          QEMU: ${{ steps.f.outputs.qemu }}
          FREERTOS: ${{ steps.f.outputs.freertos }}
          NUTTX: ${{ steps.f.outputs.nuttx }}
          THREADX_LINUX: ${{ steps.f.outputs.threadx_linux }}
          THREADX_RISCV64: ${{ steps.f.outputs.threadx_riscv64 }}
          ESP32: ${{ steps.f.outputs.esp32 }}
          ZEPHYR: ${{ steps.f.outputs.zephyr }}
          LANE_MODULES: ${{ needs.lane.outputs.modules }}
        run: |
          set -euo pipefail
          # Modules THIS job can run. The lane also needs `native` and `zephyr`,
          # which have their own homes in the tier (host-tests / the 05:00 cron) —
          # `lane-coverage` asserts that, rather than this list quietly implying it.
          runnable="qemu freertos nuttx threadx_linux threadx_riscv64 esp32"
          # Derived from the lane, not listed: adding a platform to `matrix::CELLS`
          # must extend the sweep with no second edit here. Empty when the `lane`
          # job did not run (the 05:00 Zephyr cron) — the `platform` job is gated
          # off on that cron anyway.
          all=""
          for m in $(jq -r ".[]?" <<<"${LANE_MODULES:-[]}"); do
            case " $runnable " in *" $m "*) all="$all $m" ;; esac
          done
          echo "lane-derived platform set:$all"
          # Always true now — `pull_request` is not a trigger. Left as an
          # explicit branch rather than deleted: the `else` records what the PR
          # lane used to select, and phase-395 W6 brings a narrowed pre-merge
          # matrix back once a self-hosted runner can satisfy it.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            sel="$all"
            zephyr="true"
          else
            sel=""
            [ "$QEMU" = "true" ]            && sel="$sel qemu";            true
            [ "$FREERTOS" = "true" ]        && sel="$sel freertos";        true
            [ "$NUTTX" = "true" ]           && sel="$sel nuttx";           true
            [ "$THREADX_LINUX" = "true" ]   && sel="$sel threadx_linux";   true
            [ "$THREADX_RISCV64" = "true" ] && sel="$sel threadx_riscv64"; true
            [ "$ESP32" = "true" ]           && sel="$sel esp32";           true
            zephyr="$ZEPHYR"
          fi
          json=$(printf '%s\n' $sel | jq -R . | jq -cs .)
          echo "platforms=$json" >> "$GITHUB_OUTPUT"
          echo "zephyr=$zephyr" >> "$GITHUB_OUTPUT"
          # Issue 1029 -- decide the zephyr CRON here, once, and SAY what the
          # payload contained.
          #
          # The three zephyr jobs each carried
          #     github.event.schedule == '0 5 * * *'
          # and every SCHEDULED run skipped all three: 9 of 9 scheduled runs
          # skipped, 5 of 5 workflow_dispatch runs ran, over 2026-08-30..09-03.
          # `changes.outputs.zephyr` was `true` in those runs (read from the raw
          # log archive), so the string compare is what closed the gate -- but
          # the value it compared was observable NOWHERE, which is why this sat
          # for eight nights.
          #
          # Two changes, and the second matters more than the first:
          #
          #  * FAIL OPEN. An unrecognised or absent schedule value now RUNS the
          #    lane. For a nightly that is the safe direction: the cost of
          #    running too often is minutes, the cost of never running is that a
          #    Zephyr regression and a healthy Zephyr look identical. The old
          #    compare failed CLOSED, silently, which is the worse half of
          #    "a red lane answers one of two questions".
          #  * The raw value is printed AND written to the step summary, which
          #    survives log formatting. `gh run view --log` mangles this
          #    workflow (steps render as UNKNOWN STEP and whole lines vanish),
          #    so a value that exists only in the log is a value nobody can
          #    read back.
          sched="${{ github.event.schedule }}"
          if [ "${{ github.event_name }}" != "schedule" ]; then
            run_zephyr="true"; why="not a schedule event"
          else
            case "$sched" in
              "0 5 "*) run_zephyr="true";  why="the zephyr cron" ;;
              "0 7 "*) run_zephyr="false"; why="the platform cron, which is not this lane" ;;
              *)       run_zephyr="true";  why="UNRECOGNISED schedule -- failing OPEN (issue 1029)" ;;
            esac
          fi
          echo "run_zephyr=$run_zephyr" >> "$GITHUB_OUTPUT"
          echo "zephyr cron: event=${{ github.event_name }} schedule='$sched' -> run_zephyr=$run_zephyr ($why)"
          {
            echo "### zephyr cron gate (issue 1029)"
            echo ""
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| \`github.event_name\` | \`${{ github.event_name }}\` |"
            echo "| \`github.event.schedule\` | \`$sched\` |"
            echo "| paths-filter \`zephyr\` | \`$zephyr\` |"
            echo "| **run_zephyr** | **$run_zephyr** ($why) |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "selected platforms: $json ; zephyr: $zephyr"

  # ===== per-platform sweep (cron 0 7) ==================================
  platform:
    needs: changes
    # The 05:00 cron is Zephyr-only; the 07:00 cron + PR/dispatch run platforms.
    if: ${{ needs.changes.outputs.platforms != '[]' && (github.event_name != 'schedule' || github.event.schedule == '0 7 * * *') }}
    name: ${{ matrix.plat }}
    runs-on: ubuntu-22.04
    concurrency:
      group: nightly-platform-${{ matrix.plat }}-${{ github.ref }}-${{ github.event_name }}
      # `pull_request` is no longer a trigger here, so this was permanently
      # false. Keep it that way deliberately: a cancelled matrix job on a
      # schedule leaves a coordinate with NO verdict, which reads the same as
      # one that passed.
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/newslabntu/nano-ros-ci:humble
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        plat: ${{ fromJSON(needs.changes.outputs.platforms) }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache CLI build (Phase 218)
        uses: actions/cache@v4
        with:
          path: packages/cli/target
          key: nros-cli-${{ runner.os }}-${{ hashFiles('packages/cli/Cargo.lock', 'packages/cli/**/Cargo.toml', 'packages/cli/**/*.rs') }}
          restore-keys: |
            nros-cli-${{ runner.os }}-

      - name: Build nros CLI from packages/cli/ (Phase 218)
        uses: ./.github/actions/setup-nros-cli
      # phase-413 W3 — provision the repo's declared `[prereq.*]` closure.
      #
      # `nros setup --system --sudo` resolves what the INDEX declares for the
      # detected package manager and installs it. Not an `apt-get` line, for the
      # reason W3 exists: a package name written in YAML is the copy nobody
      # updates when the index moves.
      #
      # The one that matters here is `ros-humble-rmw-zenoh-cpp`. The CI image
      # carries NO zenoh packages — `FROM ros:humble-ros-base`, and its only ROS
      # apt entry is `example-interfaces` — so `zenohd_unavailable_reason()`
      # fails `require_e2e()` and the `freertos` and `threadx_linux` cells skip
      # ALL 9 e2e cases on a precondition, which `_check-skip-budget` then
      # reports as "this lane verified nothing" (issue 1038, confirmed by
      # querying a built image: no `rmw_zenohd`, no `libzenohc*`, sole RMW is
      # fastrtps).
      #
      # Installing it does NOT reintroduce issue 0774. That trap is a router
      # resolving against a `libzenohc.so` it was not built with, because this
      # image sets `AMENT_PREFIX_PATH`/`LD_LIBRARY_PATH` as a STATIC `ENV`
      # snapshot that will not name `<prefix>/opt/zenoh_cpp_vendor/lib`. The
      # harness pins the pairing itself — `zenohd_router.rs`'s
      # `paired_zenoh_library_dir` prepends the router's OWN lib dir to
      # `LD_LIBRARY_PATH` for the process it spawns — so a harness-started
      # router is correct regardless of the image's env. A router started BY
      # HAND in that container still is not; that is 0774's remaining edge and
      # is not what these lanes do.
      - name: Provision the declared system closure (phase-413 W3)
        run: |
          source ./activate.sh
          nros setup --system --sudo

      # issue 1038 — provision `[tool.esp32-qemu]`'s declared BUILD deps before
      # the lane asks for the tool.
      #
      # The Espressif QEMU fork has no prebuilt for linux-x86_64, so `nros setup
      # --tool esp32-qemu` builds it from source, and qemu's meson needs glib,
      # pixman and gcrypt. The index declares all three — as `[prereq.*]` with
      # apt names and probes, AND in `[tool.esp32-qemu] system = [..]` — so the
      # tool can install them itself. That is why this is NOT an `apt-get
      # install` line: restating what the index already declares is exactly what
      # phase-413 W3's gate forbids, and the packages are indexed.
      #
      # `--sudo` because a CI container is where executing a package install is
      # appropriate; the default still refuses and prints the command, which is
      # the right behaviour on a developer's machine.
      #
      # This step stops the ESP32 e2e from SKIPPING for want of a QEMU that
      # knows `esp32c3`, which is a coverage hole that reads as green.
      #
      # It could never have done that until now: `--sudo` carried
      # `requires = "system"` in clap, so this exact line exited 2 on a usage
      # error before installing anything, and every step after it was skipped —
      # including `Build (esp32)`. The comment that used to sit here said the
      # cell's red was issue 1025 and not this step; with 1025 fixed (#303) the
      # red simply moved here, which is how the contradiction surfaced. The
      # `--tool ... --sudo` form the help text has promised since issue 1038 is
      # reachable as of this branch.
      - name: Provision esp32-qemu's declared system deps (issue 1038)
        if: matrix.plat == 'esp32'
        run: |
          source ./activate.sh
          nros setup --tool esp32-qemu --sudo

      # The DISPATCHER spelling, not `just <plat> setup`. Only
      # `just setup <scope>` runs `_setup-common`, which provisions the host
      # facts every tier asserts (cross Rust targets, pinned corrosion, the CLI,
      # the resolver, clang-format). The module spelling silently skips all of
      # it, which is why this job needed a hand-rolled cross-target step below.
      - name: just setup ${{ matrix.plat }}
        run: |
          source ./activate.sh
          just setup ${{ matrix.plat }}

      # issue-0037 — the e2e fixture build shells out to `play_launch_parser`, a
      # separate binary the in-tree `cargo build --bin nros` does NOT produce.
      # Provision it + point nros at it via NROS_PLAY_LAUNCH_PARSER (env, not PATH:
      # later `source ./setup.bash` strips ~/.nros/sdk/* from PATH). e2e-only.
      - name: Provision play_launch_parser (launch-manifest fixtures, #37)
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_e2e) }}
        run: |
          source ./activate.sh
          just workspace install-play-launch-parser
          echo "NROS_PLAY_LAUNCH_PARSER=$HOME/.nros/sdk/play_launch_parser/bin/play_launch_parser" >> "$GITHUB_ENV"

      # Container-job host-disk headroom before the heavy SDK+cargo build (the
      # freertos/zephyr cells exhaust the ~14 GB runner). cargo/SDK caches stay.
      - name: Reclaim disk before build (container headroom)
        run: |
          echo "before:"; df -h / | tail -1
          apt-get clean 2>/dev/null || true
          rm -rf /var/lib/apt/lists/* /usr/share/doc /usr/share/man /usr/share/locale 2>/dev/null || true
          echo "after:";  df -h / | tail -1

      - name: Build (${{ matrix.plat }})
        run: |
          source ./setup.bash
          source /opt/ros/humble/setup.bash
          # The workspace .cargo/config.toml patches `libc` to the NuttX fork (#18)
          # at workspace level, so EVERY cell's Entry build needs third-party/
          # nuttx/libc; px4-rs too (workspace-load). Provision via the SDK index.
          nros setup --source px4-rs --source nuttx-libc
          # Disk lever: push/PR get the lighter `build-examples` smoke; the heavy
          # `build-all` fixtures matrix (what QEMU e2e consumes) only on schedule /
          # dispatch-with-run_e2e.
          #
          # ONE VERB PER PATH, no `||` fallback — phase-411.
          #
          # This used to read `build-all || build-examples || build`. Every
          # platform module defines all four verbs, so the fallbacks could never
          # fire for a MISSING recipe; they fired only when the previous verb
          # FAILED. The step then built something smaller and reported success,
          # which is the "skip and report success" shape phase-411 exists to
          # remove — expressed in shell rather than in a skip helper.
          #
          # It defeated the mechanism that was working: nightly sets no
          # `NROS_LANE_INCLUDED`, so every platform here is NAMED, and a named
          # platform whose prerequisite is missing already fails loudly
          # (`NROS_LANE_NAMED_FAIL`). The chain caught that failure and
          # downgraded it. The prerequisite then surfaced two stages later as
          # nine skipped tests and a `_check-skip-budget` red — twenty minutes
          # after the point of decision, naming the gate instead of the missing
          # tool, which is exactly what phase-411's acceptance rules out.
          if [ "${{ github.event_name }}" = "schedule" ] || \
             { [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.run_e2e }}" = "true" ]; }; then
            just ${{ matrix.plat }} build-all
          else
            just ${{ matrix.plat }} build-examples
          fi

      - name: Test / e2e (${{ matrix.plat }})
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_e2e) }}
        run: |
          source ./setup.bash
          source /opt/ros/humble/setup.bash
          # `_nextest-platform` runs `cargo metadata` over the nros-tests
          # workspace → the px4-sitl-tests path dep must exist; nuttx-libc backs
          # the workspace Entry build. Provision both (same as host-tests).
          nros setup --source px4-rs --source nuttx-libc
          just ${{ matrix.plat }} test

      # Keep the junit, because a red cell is otherwise unreadable after the
      # fact. `check-skip-budget` names WHICH preconditions were unmet, but the
      # per-test detail lives in the junit and nightly uploaded nothing at all —
      # so triaging `threadx_linux` meant re-deriving from a job log that
      # records the count and not the cause. host-tests has kept its junit since
      # #29; this is the same step for the platform matrix.
      - name: Upload nextest JUnit (${{ matrix.plat }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-${{ matrix.plat }}-junit
          # GLOB the profile, do not name it. `nros_nextest_junit_path` resolves
          # `target/nextest/<profile>/junit.xml`, where the profile is
          # `$NROS_NEXTEST_RUN_PROFILE` (default `default`), and honours
          # `$CARGO_TARGET_DIR` ahead of `target/`. Neither is set in this
          # workflow today, so a literal path is correct RIGHT NOW and becomes a
          # silent no-op the moment one of them is — `if-no-files-found: ignore`
          # is the right setting for a conditional step and the wrong one to
          # discover a wrong path through.
          path: |
            target/nextest/*/junit.xml
            target/nextest/*/junit-real.xml
            ${{ env.CARGO_TARGET_DIR }}/nextest/*/junit.xml
            ${{ env.CARGO_TARGET_DIR }}/nextest/*/junit-real.xml
          if-no-files-found: ignore
          retention-days: 7

  # Does the tier actually RUN the lane it claims to? Every module the tier-2
  # nightly cover needs must have a home somewhere in nightly CI. Without this,
  # "`ci-matrix-nightly` catches the platform x lang class" is a sentence in
  # RFC-0061 with nothing behind it — and the way it would fail is silent: a new
  # platform joins `matrix::CELLS`, joins the lane, and no job ever builds it.
  #
  # Cheap and always runs, including when the platform matrix went red: a
  # coverage gap and a test failure are different facts and should not mask each
  # other.
  lane-coverage:
    needs: [lane, changes, platform]
    # Runs whenever the FULL sweep was expected, including when it did not
    # happen. A failed `lane` leaves `platforms` empty, which skips the sweep
    # silently — a nightly that ran nothing looks identical to a nightly that
    # passed. This job is where that becomes a red.
    #
    # Not on pull_request: there the matrix is deliberately narrowed by path
    # filters, so it is SUPPOSED to be a subset of the lane. Asserting coverage
    # there would fail every PR and teach people to ignore this job.
    if: ${{ always() && github.event_name != 'pull_request' && (github.event_name != 'schedule' || github.event.schedule == '0 7 * * *') }}
    name: tier-2 nightly lane coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every lane module has a home in nightly CI
        env:
          LANE_MODULES: ${{ needs.lane.outputs.modules }}
          RAN: ${{ needs.changes.outputs.platforms }}
          LANE_RESULT: ${{ needs.lane.result }}
          PLATFORM_RESULT: ${{ needs.platform.result }}
        run: |
          set -euo pipefail
          if [ "$LANE_RESULT" != "success" ]; then
            echo "::error::lane selection did not succeed (result: $LANE_RESULT)."
            echo "The platform matrix is derived from it, so an empty selection"
            echo "skips the whole sweep — a nightly that ran nothing is not a pass."
            exit 1
          fi
          # Homes OUTSIDE the platform matrix. Each entry names the lane that
          # actually runs it, so a stale entry is legible rather than a bare
          # allow-list. `native` also gates tier 1 on every commit.
          declare -A elsewhere=(
            [native]="host-tests.yml — cron 0 3, just test-unit + test-integration"
            [zephyr]="nightly.yml zephyr-* jobs — cron 0 5"
          )
          ran="$(jq -r '.[]' <<<"$RAN" | tr '\n' ' ')"
          missing=()
          for m in $(jq -r '.[]' <<<"$LANE_MODULES"); do
            case " $ran " in *" $m "*) echo "  $m -> platform matrix"; continue ;; esac
            if [ -n "${elsewhere[$m]:-}" ]; then
              echo "  $m -> ${elsewhere[$m]}"
            else
              missing+=("$m")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo
            echo "::error::tier-2 nightly lane module(s) with NO job in nightly CI: ${missing[*]}"
            echo "The lane is computed from nros_tests::matrix::CELLS. A module here"
            echo "means a platform joined the matrix without joining any CI lane, so"
            echo "the pairwise cover is claimed but not run. Either add it to the"
            echo "platform matrix's \`runnable\` list, or record its real home in the"
            echo "\`elsewhere\` map above."
            exit 1
          fi
          echo
          echo "All tier-2 nightly lane modules have a home (platform matrix result: $PLATFORM_RESULT)."

  # ===== Zephyr dual-line (cron 0 5) ====================================

  # Issue 1029, THIRD pass — and this one has the measurement the first two were
  # missing. `gh api .../actions/jobs/<id>/logs` DOES return the `changes` job's
  # log; it was the run-level `gh run view --log` that mangled it. From the
  # 2026-09-05T05:10 SCHEDULED run (job 101253467476), verbatim:
  #
  #     zephyr cron: event=schedule schedule='0 5 * * *' -> run_zephyr=true
  #     selected platforms: [""] ; zephyr: true
  #     Set output 'platforms' / Set output 'zephyr' / Set output 'run_zephyr'
  #
  # So `github.event.schedule` IS exactly `0 5 * * *` on the 05:00 cron, every
  # operand of the gate was the string `true`, all three outputs were set, and
  # `changes` finished `success` at 05:10:44 — and all three zephyr jobs were
  # reported `skipped` at 05:10:45, one second later. The cron string compare
  # was never the bug. Both earlier passes rewrote a gate that was already
  # computing the right answer.
  #
  # What IS different about the 05:00 cron is one edge: `changes` has
  # `needs: lane`, and `lane` is the job that is deliberately skipped on that
  # cron. `changes` overrides with `if: always()` and runs — but nothing
  # downstream of it survives. Correlation over 29 scheduled runs back to
  # 2026-08-22 is total: `lane` skipped => every job that reads a `changes`
  # output skipped; `lane` ran (07:00 cron, and every dispatch) => they ran.
  #
  # The second pass's own artifact then said WHICH mechanism, on the
  # 2026-09-06T05:10 scheduled run (34013334385):
  #
  #     event_schedule='0 5 * * *'   changes_result='success'
  #     outputs_run_zephyr='true'    gate_would_pass='true'
  #
  # `gate_would_pass` IS the three jobs' `if`, evaluated in that run against the
  # same `needs.changes` context — and the three jobs were skipped in it. So the
  # outputs cross the edge and the gate is OPEN; GitHub skips the jobs because
  # their `needs` chain contains a skipped job and they do not carry `always()`.
  # A true `if` does not resurrect a job the graph has already skipped. The
  # report job, same position, survives only because it says `always()`.
  #
  # So the three jobs below no longer `needs: changes` at all — they never used
  # it for anything but the `if` — and each asks the event payload directly.
  # The compare FAILS OPEN, as the first pass established: any schedule that is
  # not the 07:00 platform cron runs the lane. Running too often costs minutes;
  # never running costs the ability to tell a Zephyr regression from a healthy
  # Zephyr, which is what the last three weeks cost.
  #
  # RULE for anything added here later: a job on the 05:00 cron must NOT gate on
  # a `changes` output. `changes` is the platform sweep's job and shares `lane`'s
  # lifetime.
  #
  # This report job stays, and keeps its `needs: changes` on purpose: it is the
  # only thing that can say, from inside a scheduled run, whether the outputs
  # cross that edge. It writes them to an ARTIFACT, quoted, because this
  # workflow's step summaries are not exposed by the API. `always()` is what
  # keeps it running when everything else on the edge does not.
  zephyr-gate-report:
    needs: changes
    if: ${{ always() }}
    name: zephyr gate inputs (issue 1029)
    runs-on: ubuntu-latest
    steps:
      - name: record the gate inputs
        run: |
          set -euo pipefail
          # Quoted deliberately: an EMPTY output and the string "true" are the
          # two candidates, and unquoted they look the same in a log.
          {
            echo "event_name='${{ github.event_name }}'"
            echo "event_schedule='${{ github.event.schedule }}'"
            echo "changes_result='${{ needs.changes.result }}'"
            echo "outputs_zephyr='${{ needs.changes.outputs.zephyr }}'"
            echo "outputs_run_zephyr='${{ needs.changes.outputs.run_zephyr }}'"
            echo "outputs_platforms='${{ needs.changes.outputs.platforms }}'"
            echo "old_gate_via_changes='${{ needs.changes.outputs.run_zephyr == 'true' }}'"
            # The gate the three jobs below actually use now: the event payload,
            # read directly, no `needs` edge in the way.
            echo "gate_direct='${{ github.event_name != 'schedule' || !startsWith(github.event.schedule, '0 7 ') }}'"
          } | tee zephyr-gate-inputs.txt
      - uses: actions/upload-artifact@v4
        with:
          name: zephyr-gate-inputs
          path: zephyr-gate-inputs.txt
          retention-days: 14

  zephyr-example-matrix:
    # No `needs:` — see the issue-1029 block above. The gate is the event
    # payload, and it fails OPEN on anything that is not the 07:00 platform cron.
    if: ${{ github.event_name != 'schedule' || !startsWith(github.event.schedule, '0 7 ') }}
    name: zephyr ${{ matrix.line }} / ${{ matrix.example }}
    runs-on: ubuntu-latest
    concurrency:
      group: nightly-zephyr-matrix-${{ matrix.line }}-${{ matrix.example }}-${{ github.ref }}-${{ github.event_name }}
      cancel-in-progress: false
    container:
      image: ghcr.io/newslabntu/nano-ros-zephyr-ci:humble-sdk0.17.4-r4
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        line: ["3.7", "4.4"]
        example:
          - c/talker
          - c/listener
          - cpp/talker
          - cpp/listener
          - rust/talker
          - rust/listener
          - rust/service-client
          - rust/service-server
          - rust/action-client
          - rust/action-server
    env:
      NROS_ZEPHYR_VERSION: ${{ matrix.line }}
      # The 4.4 line needs a Python >=3.12 venv, which nano-ros refuses to create
      # on a host it does not own. A CI container IS owned: this image ships `uv`
      # for exactly this. Ignored by the 3.7 line.
      NROS_ZEPHYR_CREATE_VENV: "1"
    steps:
      - name: Checkout nano-ros
        uses: actions/checkout@v4

      - name: Cache CLI build (Phase 218)
        uses: actions/cache@v4
        with:
          path: packages/cli/target
          key: nros-cli-${{ runner.os }}-${{ hashFiles('packages/cli/Cargo.lock', 'packages/cli/**/Cargo.toml', 'packages/cli/**/*.rs') }}
          restore-keys: |
            nros-cli-${{ runner.os }}-

      - name: Build nros CLI from packages/cli/ (Phase 218)
        uses: ./.github/actions/setup-nros-cli

      # The image registered the SDK CMake package as root; the container runs
      # with HOME=/github/home → re-register for this HOME (4.4's FindZephyr-sdk
      # needs the user CMake-package registry).
      - name: Register the baked Zephyr SDK for this HOME
        run: /opt/zephyr-sdk/setup.sh -c

      # Issue 0078 — container host-disk headroom before `just setup zephyr`
      # (west update + pip). Option A (requirements-base.txt only) dropped
      # spsdk-mcu-link, but 4.4's base.txt still pulls `reuse` + compliance deps
      # and the ~14 GB disk is borderline — some cells tip at pip (78 MB free).
      # Reclaim the image's static bloat + pip cache (the baked Zephyr SDK stays —
      # the build needs it). Mirrors the `platform` job's reclaim.
      - name: Reclaim disk before Zephyr setup (#0078 headroom)
        run: |
          echo "before:"; df -h / | tail -1
          apt-get clean 2>/dev/null || true
          rm -rf /var/lib/apt/lists/* /usr/share/doc /usr/share/man /usr/share/locale 2>/dev/null || true
          rm -rf "$HOME/.cache/pip" 2>/dev/null || true
          echo "after:";  df -h / | tail -1

      # The image bakes bin/cargo-clippy from a non-rustup-owner layer; `rustup
      # target add` trips on the clippy-preview conflict. Delete the orphan files
      # then re-install clippy on every toolchain.
      - name: Unblock rustup clippy-preview conflict
        run: |
          rustup_home="$(rustup show home 2>/dev/null || echo "$HOME/.rustup")"
          find "$rustup_home/toolchains" -maxdepth 3 -type f \
              \( -name cargo-clippy -o -name clippy-driver \) -delete 2>/dev/null || true
          rustup toolchain list 2>/dev/null | awk '{print $1}' | while read -r tc; do
              [ -z "$tc" ] && continue
              echo "  installing clippy on $tc"
              rustup component add clippy --toolchain "$tc" \
                  || echo "  (clippy add failed for $tc — non-fatal)"
          done

      # The DISPATCHER spelling, not `just zephyr setup`. Only `just setup
      # <scope>` runs `_setup-common`, which provisions the host facts every
      # tier asserts (cross Rust targets, pinned corrosion, the CLI, the
      # resolver, clang-format); the module spelling skips all of it silently.
      # The flag reaches the module recipe unchanged — phase-422 W3 gave the
      # dispatcher a variadic tail and re-homes a leading-dash value that `just`
      # bound to `tier`, so `just setup zephyr --skip-sdk` execs
      # `just zephyr setup --skip-sdk`.
      #
      # This also subsumes the "Provision Zephyr sources via nros" step that
      # used to sit above: `just/zephyr-setup.just`'s `setup` opens with the
      # same `nros setup --source zenoh-pico --source cyclonedds-src --source
      # px4-rs`, plus an explicit `--index`, before it touches the workspace.
      - name: Set up Zephyr ${{ matrix.line }} workspace
        run: |
          source ./activate.sh
          just setup zephyr --skip-sdk

      # zephyr-sys' build.rs runs bindgen over Zephyr headers — needs libclang.so
      # AND clang's resource-dir headers. Rust cells only (C/C++ cells skip).
      - name: Install clang + libclang for bindgen
        if: startsWith(matrix.example, 'rust/')
        run: |
          apt-get update -q
          apt-get install -y --no-install-recommends \
            $(python3 scripts/sdk/prereq-packages.py --manager apt clang libclang-dev)

      - name: Build zephyr/${{ matrix.example }} (zenoh) on ${{ matrix.line }}
        run: |
          source ./activate.sh
          just zephyr build-one "${{ matrix.example }}" zenoh

