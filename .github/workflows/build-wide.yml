# BUILD + LINK, wide — the mandatory promise (phase-410 W2).
#
# CI is BREADTH x DEPTH, and only DEPTH is expensive:
#
#   breadth  which coordinates a run visits   tier1 tier2 nightly full   low cost
#   depth    what it does with each           build+link | build+run     HIGH cost
#
# MEASURED 2026-08-31: `just ci matrix build` — cross build + link plus ELF
# symbol interrogation, no QEMU and no tests — is 27-46 s. The tier-2 RUN over the same
# tree is 9.5 min on top of an 11 min warm fixture rebuild. Depth is ~25x
# breadth, so build depth can afford to gate every merge and run depth cannot.
#
# "It compiles and links for every target" is the regression that hurts most and
# costs least to catch. That is this lane.
#
# WHY THIS IS `workflow_dispatch` ONLY — phase-413 W1
#
# This file used to run on `push` to main, and its header carried a "WHY
# push(main) AND NOT the merge queue" rationale. That rationale was FALSE the
# day it was written: `queue.yml`'s `l3` job already ran this exact lane on
# `merge_group`. `just ci matrix build` dispatches to `_matrix-build`, whose
# body is `l3` — the same recipe, on the same runner labels. Two phases added
# it independently (395 W7 there, 410 W2 here) and neither saw the other.
#
# The duplication was not free. The two jobs provisioned DIFFERENTLY, in
# opposite directions: this one ran `just setup tier2` and no codegen, the
# queue job ran codegen by hand and leaned on the runner's baked SDKs. So the
# same recipe reported success in the queue and failure here, on the same four
# commits, minutes apart (issue 0996):
#
#   36c306405  queue success 16:25:49   build-wide FAILURE 16:26:23
#   da0344af1  queue success 17:02:18   build-wide FAILURE 16:43:26
#   ad5a8ecf9  queue success 17:06:55   build-wide FAILURE 17:22:19
#   d2a8955c5  queue success 01:23:54   build-wide FAILURE 17:27:51
#
# A post-merge lane that is red for a day reports nothing: a regression landing
# in it looks exactly like yesterday's failure. Worse, this lane gates nothing
# by construction — the merge has already happened — and `CI` is the only
# REQUIRED context, so the queue copy does not gate either. Two runs of an
# ungating lane, one of them permanently red.
#
# So the lane lives in `queue.yml` alone: it runs BEFORE the merge, it is
# measured at 27-46 s which the queue can afford, and `queue-notify.yml`
# watches that workflow, so a failure comments on the pull request instead of
# sitting in the Actions tab.
#
# What survives here is the on-demand entry point. The self-hosted runner is
# the only place most people can cross-build every target, so `workflow_
# dispatch` keeps that reachable without opening a pull request.
#
# CANCEL-IN-PROGRESS, on a dispatch-only lane
#
# Kept: two dispatches of the same ref mean the operator wants the newer
# answer. The original note explained why this setting is right for build depth
# and wrong for run depth — a 20-minute run-depth lane under the same setting
# starves, because each merge cancels the last and the tier completes never.
# That reasoning still governs the `run-*` workflows, which are on a clock.
name: build-wide

on:
  workflow_dispatch:

concurrency:
  group: build-wide-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  l3:
    name: build + link (cross ELFs, no boot)
    # Gated for the same reason as post-submit's tier-2 job: this needs the RTOS
    # cross toolchains, and a job that cannot start is not a signal.
    if: ${{ vars.NROS_SELF_HOSTED_READY == 'true' }}
    runs-on: [self-hosted, linux, nros-sdk-zephyr, nros-big]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # phase-411: a CI job is `just setup <scope>` then one command a developer
      # can type. Nothing here is CI-only orchestration.
      - name: just setup tier2
        run: |
          source ./activate.sh
          just setup tier2

      # AFTER `setup` — phase-413 W2, same reason as `run-matrix.yml` (#279).
      #
      # `runner-doctor.sh` checks `$root/build/qemu/bin/qemu-system-arm` first
      # ("the project-local patched build is the PRIMARY path (phase-143) … a
      # host with it needs nothing from the system") and falls back to the
      # system qemu only when that is absent. That path is inside the CHECKOUT
      # and `just setup tier2` creates it — the tier-2 preset includes the
      # `qemu` module, whose `setup` ends in `just qemu setup-qemu`.
      #
      # Asserting before provisioning asks the host for something the next step
      # supplies. On `run-matrix` that killed every run at step 2 against a
      # system qemu 6.2, having provisioned nothing. This lane is dispatch-only
      # now, so the exposure is smaller — but it is the same bug, and an
      # operator who dispatches it deserves the same answer as the cron lanes.
      #
      # A genuinely mislabeled runner still fails, one step later, and `setup`
      # would have failed on it first.
      - name: Verify this runner's labels are true
        run: ./scripts/ci/runner-doctor.sh nros-sdk-zephyr,nros-big
      # `ci matrix build` — the (breadth, depth) pair, not a lane letter.
      # phase-410 W4: `l3` survives as the implementation; this spelling says
      # WHICH breadth at WHICH depth, which is what the file is for.
      - name: just ci matrix build
        run: |
          source ./activate.sh
          just ci matrix build
      - name: Sweep orphans and disk
        if: always()
        run: ./scripts/ci/runner-sweep.sh || true

  coverage:
    name: coverage report (did build-wide run?)
    needs: [l3]
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Report whether the interlocked lane ran
        run: ./scripts/ci/report-interlock-coverage.sh "build + link (cross ELFs, no boot)" "${{ needs.l3.result }}" "${{ vars.NROS_SELF_HOSTED_READY }}"
