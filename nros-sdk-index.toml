# ---------------------------------------------------------------------------
# phase-398 W2 — probes for the providers that had none.
#
# Measured before writing these: `[system.*]` carried a `check` on 22 of 25
# entries, `[tool.*]` on 0 of 14 and `[source.*]` on 0 of 15. Presence for the
# latter two was "the path exists" — which is true of an uninitialised
# submodule, and was true of the QEMU dist whose `libslirp.so.0` was missing.
#
# `check` answers "is the capability usable?", never "did provider X install
# it?" (RFC-0062, amended 2026-08-29), so these are ordinary probes on ordinary
# prereq entries; the provider only says where to look.
#
# A `path` probe is relative to the provider's own `dest`, so no entry here
# restates a location `[source.*]` already declares.
# ---------------------------------------------------------------------------

[prereq.qemu]
role = "infra"
why = "QEMU runs every emulated platform test"
provider = "sdk"
# `runs`, not `cmd`: the store dist is not on PATH, and its path EXISTING is
# exactly the state that let a missing libslirp.so.0 reach the loader.
check = { runs = "qemu-system-arm --version" }

[prereq.freertos-kernel]
role = "vendor"
why = "FreeRTOS builds compile the kernel from this checkout"
provider = "submodule"
check = { path = "include/FreeRTOS.h" }

[prereq.threadx]
role = "vendor"
why = "ThreadX builds compile the kernel from this checkout"
provider = "submodule"
check = { path = "common/inc/tx_api.h" }

[prereq.zenoh-pico]
role = "vendor"
why = "the zenoh backend's C library"
provider = "submodule"
check = { path = "include/zenoh-pico.h" }

[prereq.nuttx-kernel]
role = "vendor"
why = "NuttX builds configure and build this checkout"
provider = "submodule"
check = { path = "Kconfig" }

[prereq.cyclonedds-src]
role = "vendor"
why = "the Cyclone backend builds this fork"
provider = "submodule"
check = { path = "CMakeLists.txt" }

# phase-398 W3 — found by the `<depend>` ladder, not by inspection: both were
# declared in `examples/workspaces/mixed/src/rust_heartbeat_pkg/package.xml` and
# resolved to nothing, silently, for as long as that file has existed.

[prereq.cargo]
role = "package"
why = "Rust builds; the real provider is rustup, which [rust.toolchain.*] pins"
# apt/dnf/pacman ship a `cargo`, but a distro cargo is NOT the pinned toolchain
# and using one is its own failure class — so the mapping exists for a host with
# no rustup at all, and the probe is what actually decides.
apt = ["cargo"]
dnf = ["cargo"]
pacman = ["rust"]
brew = ["rust"]
check = { cmd = "cargo" }

[prereq.nros]
role = "package"
why = "the nano-ros CLI itself — codegen, sync, and this build verb"
# No package manager ships it. `./scripts/bootstrap.sh` (users) or
# `just setup-cli` (contributors) provides it; the probe is the whole entry.
check = { cmd = "nros" }

# Issue 0928 — NINETEEN runtime keys were deleted here in total: thirteen when
# qemu moved to -nros6, then six more (libftdi1, libhidapi, libudev1, libusb1,
# libncursesw5, libtinfo5) when openocd -nros2 and arm-none-eabi-gcc -nros2
# bundled theirs. Of the 26 keys 0926's audit added, 7 remain.
#
# That ratio is the point of the campaign: a measured declaration told the user
# what to install, and re-cutting the dists then removed the need to install it
# at all. Declaring was never the goal — it was how the problem became visible.
#
# Thirteen keys were DELETED here when qemu moved to
# -nros6, which bundles them. Twelve arrived with 0926's audit and lived for a
# day; `libslirp` was the original phase-327 W4 declaration and had been the
# whole reason the class was noticed.
#
# Deleted rather than kept "in case": an unreferenced prereq is still PROBED by
# `nros setup --system --check`, so a dead key can report a package as missing
# that nothing needs — a declaration drifting away from reality, which is the
# failure this campaign exists to remove. `check-dist-runtime-deps` re-adds any
# of them the moment a dist actually needs it, so nothing is lost by deleting.
# --- does it RUN? (issue 0929) ------------------------------------------------
#
# `system = [..]` asks whether the libraries a dist links are present. That is
# not the same question as whether the thing works, and `arm-none-eabi-gdb` is
# the proof: it resolves every library it names, exits 0, and prints NOTHING,
# because ARM embeds a Python that fails to initialise. `--check` called that
# `[OK]` — the shape 0926 removed for openocd, back one cause over.
#
# So `expect` is a substring of the OUTPUT, not an exit status: a status probe
# passes the very bug this exists to catch. Probes run with LD_LIBRARY_PATH,
# PYTHONPATH and PYTHONHOME removed, so they measure the dist rather than the
# caller's shell.
#
# Declared for healthy dists too, deliberately. A check that exists only where
# something is known broken tests one binary; declared across the class it
# tells you when a working one stops working.

# --- dist RUNTIME libraries (issue 0926, phase-327 W4) ----------------------
#
# Measured, not hand-listed: the external ldd closure of every binary in each
# provisioned dist, minus the base glibc/gcc runtime and minus what the dist
# ships itself. `check-dist-runtime-deps` re-measures and fails if a dist needs
# something its `system = [...]` does not name, so this table cannot drift back
# out of date the way the hand-authored `[tool.qemu] system = ["libslirp"]` did
# — that one line was correct and 19 short.
#
# The audit MUST run under `env -u LD_LIBRARY_PATH`. Measured with ROS on the
# path, cyclonedds appeared to need four `libiceoryx_*` libs: the loader had
# resolved `libddsc.so.0` to ROS's own cyclonedds build rather than to the
# dist's copy behind `RUNPATH=$ORIGIN/../lib`. That is issue 0774's class, and
# an audit inheriting the caller's environment measures the caller.
#
# Two of these pin a version INSIDE the soname — `libpython3.10.so.1.0` and
# `libssl.so.3` — so they are host-distro constraints rather than ordinary
# prerequisites: no `apt install` satisfies them on a release that ships a
# different minor/major. Declaring them lets setup and doctor SAY so; only
# re-cutting the dist removes them.
#
# apt names verified against the archive on Ubuntu 22.04 (2026-08-30).
# dnf/pacman/brew are best-effort, per this file's existing convention.

[prereq.openocd]
role = "infra"
why = "on-chip debug server for flashing/attaching to a target board"
# phase-404 W2 — the first entry to use ordered preference, and openocd is the
# right first case: it is neither a build input (nothing it does enters an
# artifact) nor an interop peer (no host process must agree with it), which is
# RFC-0062 amendment 2's remaining category. So a system copy is fine WHEN it
# is new enough, and `min` is what makes "new enough" decidable — Ubuntu 22.04
# ships 0.11.0 against our 0.12.0 dist, so on this distro the chain falls
# through to `sdk` and the user installs nothing.
providers = ["system", "sdk"]
source = "openocd"
apt = ["openocd"]
dnf = ["openocd"]
pacman = ["openocd"]
brew = ["openocd"]
check = { cmd = "openocd", version = { min = "0.12" } }

[prereq.libcrypt1]
role = "infra"
why = "runtime dep of the arm-none-eabi-gcc dist(s) (issue 0926)"
apt = ["libcrypt1"]
dnf = ["libxcrypt"]
pacman = ["libxcrypt-compat"]
check = { sharedlib = "libcrypt.so.1" }

[prereq.libexpat1]
role = "infra"
why = "runtime dep of the play_launch_parser dist(s) (issue 0926)"
apt = ["libexpat1"]
dnf = ["expat"]
pacman = ["expat"]
brew = ["expat"]
check = { sharedlib = "libexpat.so.1" }

[prereq.libpcre2]
role = "infra"
why = "runtime dep of the qemu dist(s) (issue 0926)"
apt = ["libpcre2-8-0"]
dnf = ["pcre2"]
pacman = ["pcre2"]
brew = ["pcre2"]
check = { sharedlib = "libpcre2-8.so.0" }

[prereq.libpython310]
role = "infra"
why = "runtime dep of the play_launch_parser dist(s) (issue 0926)"
apt = ["libpython3.10"]
dnf = ["python3.10-libs"]
pacman = ["python310"]
check = { sharedlib = "libpython3.10.so.1.0" }

[prereq.libselinux1]
role = "infra"
why = "runtime dep of the qemu dist(s) (issue 0926)"
apt = ["libselinux1"]
dnf = ["libselinux"]
pacman = ["libselinux"]
check = { sharedlib = "libselinux.so.1" }

[prereq.libssl3]
role = "infra"
why = "runtime dep of the cyclonedds, xrce-agent dist(s) (issue 0926)"
apt = ["libssl3"]
dnf = ["openssl-libs"]
pacman = ["openssl"]
brew = ["openssl@3"]
provides = ["libcrypto.so.3", "libssl.so.3"]
check = { sharedlib = "libcrypto.so.3" }

[prereq.libtinfo6]
role = "infra"
why = "runtime dep of the qemu dist(s) (issue 0926)"
apt = ["libtinfo6"]
dnf = ["ncurses-libs"]
pacman = ["ncurses"]
brew = ["ncurses"]
check = { sharedlib = "libtinfo.so.6" }

[prereq.libz1]
role = "infra"
why = "runtime dep of the play_launch_parser, qemu dist(s) (issue 0926)"
apt = ["zlib1g"]
dnf = ["zlib"]
pacman = ["zlib"]
brew = ["zlib"]
check = { sharedlib = "libz.so.1" }
