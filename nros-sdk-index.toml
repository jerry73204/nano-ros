# nano-ros SDK package index (Phase 187).
#
# `nros setup <board>` reads this to fetch prebuilt host toolchains/tools, or
# build them from the `[tool.*.source]` recipe into the same prefix. Prebuilt
# `dist` assets are hosted on NEWSLabNTU/nano-ros-sdk Releases:
#   tag = <tool>-<version>,  asset = <tool>-<host>.tar.zst  (+ .sha256)
#
# Version is the SSOT. `dist.<host>.{url,sha256}` are filled by seeding the
# nano-ros-sdk build workflow (workflow_dispatch) + verified by the
# `sdk-index-gate` CI on any change here. Until an asset is seeded, leave its
# `dist.<host>` out — `nros setup` falls back to the `[tool.*.source]` recipe.
#
# host keys: linux-x86_64 · linux-arm64 · macos-arm64  (matches sdk_index::host_key)

# --- the repo's own build-stage source union (issue 0390) ---
# The `[source.*]` names `just test` (links every RMW's `-sys`) and
# `just build-test-fixtures` (resolves component graphs that path-dep platform
# sources even for a native component) need present, regardless of which board
# or rmw was provisioned. `nros setup --build-sources` provisions them all;
# `nros setup --build-sources --check` is the preflight the two recipes run.
# Curated from what the ROOT workspace + metadata refresh actually touch on the
# host — NOT the cross-only trees (freertos/threadx/nuttx kernels, px4-autopilot,
# rosidl), which only a target build for that board pulls in.
build_sources = [
    "zenoh-pico",             # zpico-sys build.rs (root member)
    "mbedtls",                # zpico-sys TLS build (root member)
    "cyclonedds-src",         # cyclonedds-sys build.rs (root member)
    "micro-xrce-dds-client",  # nros-rmw-xrce-cffi build.rs (root member)
    "micro-cdr",              # nros-rmw-xrce-cffi build.rs (root member)
    "px4-rs",                 # px4-sitl-tests is a root cargo path-dep — the
                              # workspace cannot even LOAD without it
    "nuttx-libc",             # build-test-fixtures metadata refresh path-deps it
]

# --- prebuilt host tools (target-agnostic) ---

# The `nros` CLI itself (phase-431). This entry was REMOVED by phase-288 D1/D2
# and is back, because the reason it was removed has been answered rather than
# waived. The pre-288 entry pointed at the archived standalone
# `NEWSLabNTU/nros-cli` repo's 0.3.6 binaries — 15 releases stale and
# ABI-mismatched with the checkout — so `nros setup --tool nros` installed a
# binary that emitted code the runtime did not expect, silently. Three things
# now stand between that and a user:
#
#   RFC-0090     the codegen version — an emitter incompatible with a runtime
#                refuses, at `nros build` and at compile time in C/C++/Rust
#   phase-431 W1 a binary from outside the checkout it is run against refuses,
#                because "same version" is not "same bytes"
#   phase-431 W2 `just doctor` FAILS when a store `nros` shadows a checkout's
#
# `front = ["bin/nros"]` is the "one command" promise: versions accumulate in
# the store (nothing prunes it, issue 0500) and `$NROS_HOME/bin/nros` always
# points at the NEWEST installed one. `nros` is deliberately absent from
# `scripts/sdk-path-tools.txt` — that list puts a store `bin/` on PATH, which
# in a contributor's shell would shadow the checkout's own CLI.
#
# `smoke` asks for `--codegen-version`, not `--version`. Both run the binary;
# only one answers the question that makes this tool safe to install.
#
# No `dist.<host>` rows yet: phase-431 W5 cuts the first release, and until an
# asset is seeded `nros setup --tool nros` falls back to the source recipe
# below (the index's documented behaviour, top of file). Linux only for now —
# the tree defers macOS support, and an asset for it would be a support claim
# we do not make.
[tool.nros]
version = "0.5.0-nros1"
front = ["bin/nros"]
smoke = [
    { run = "bin/nros --codegen-version", expect = "3" },
]
upstream = "32b0d2efe61ec66a1cb6c0ff4c780c0f0bc8f10c" # = source.ref
[tool.nros.source]
git = "https://github.com/NEWSLabNTU/nano-ros"
# A COMMIT, not a branch or a tag — issue 1060. A ref on a server we do not
# control moves what we build with no local diff and no review; releases here
# are cut deliberately (phase-431: tag only when asked), so the pin is a sha.
ref = "32b0d2efe61ec66a1cb6c0ff4c780c0f0bc8f10c"
install = "cargo install --path packages/cli/nros-cli --root {prefix} --locked"

# nros2: rebuilt with --enable-slirp (nano-ros QEMU tests use -netdev user;
# nros1 lacked slirp and couldn't network).
[tool.qemu]
version = "11.0.0-nros6"
smoke = [
    { run = "bin/qemu-system-arm --version", expect = "QEMU emulator version" },
]
# issue 0928 — the re-cut LANDED, and this pin was three months behind it.
# -nros6 bundles its closure into `lib/` with `RUNPATH=$ORIGIN/../lib` (18
# libs), so the 17 packages -nros2 needed a user to apt-install are gone.
# Measured on the released tarball: external closure 20 -> 2, and
# `qemu-system-arm --version` runs with `LD_LIBRARY_PATH` unset while
# libglib/libpixman/libslirp all resolve from the bundle.
#
# The two that REMAIN are deliberate, not residue: `libselinux` is on the
# bundler's host-only exclude list (linuxdeploy's), and `libpcre2` is reachable
# only THROUGH it — copying a lib the loader would never pick up ships an
# unused file. Declared so setup/doctor can say so BEFORE the smoke
# check fails with a bare loader error.
system = ["libselinux1", "libpcre2"]
upstream = "nano-ros-v11.0.0-patches" # exact upstream rev/branch (SSOT for build-tool.yml)
dist.linux-x86_64 = { url = "https://github.com/NEWSLabNTU/nano-ros-sdk/releases/download/qemu-11.0.0-nros6/qemu-linux-x86_64.tar.zst", sha256 = "1255611e2dd80f040cd3b473583e1d34eaa1e62db00c800662cdc194d05ae916" }
dist.linux-arm64 = { url = "https://github.com/NEWSLabNTU/nano-ros-sdk/releases/download/qemu-11.0.0-nros6/qemu-linux-arm64.tar.zst", sha256 = "ce6b11bc0e1b16f81b2a31b73990b4b07e2ead273c29b80c3075b41a018ada86" }
dist.macos-arm64 = { url = "https://github.com/NEWSLabNTU/nano-ros-sdk/releases/download/qemu-11.0.0-nros6/qemu-macos-arm64.tar.zst", sha256 = "ac16f10b33cba19f2982381a928d58aeade02defc2cb647e23b23fcb2345046f" }
[tool.qemu.source]
git = "https://github.com/NEWSLabNTU/qemu"
ref = "nano-ros-v11.0.0-patches" # patched fork branch (no tags upstream)
configure = "./configure --prefix={prefix} --target-list=arm-softmmu,riscv64-softmmu --enable-slirp --disable-docs --disable-tools --disable-gtk --disable-vnc --disable-sdl --disable-spice"
install = "make -j$(nproc) && make install"

# issue 0928 — -nros2 bundles ncurses 5 into the x86_64 dist, so the two
# packages -nros1 required a user to apt-install are gone and the `system`
# declaration with them. `arm-none-eabi-gdb` no longer dies at the loader with
# `libncursesw.so.5: cannot open shared object file`.
#
# -nros3 FIXES the debugger too (issue 0929). ARM embeds a CPython STATICALLY
# and bakes its `sys.prefix` to their build container, so the interpreter found
# no stdlib and aborted — fatally, taking gdb with it, which is why gdb exited 0
# printing NOTHING. The dist now ships the matching stdlib and a launcher points
# `PYTHONHOME` at it: 1.6 MB compressed, no build, and the release job VERIFIES
# `--version` prints `GNU gdb` before publishing.
#
# `import struct` and `import math` still fail, and that is ARM's ceiling rather
# than ours: their x86_64 gdb exports ZERO Python C-API symbols, so no `.so`
# extension module can load into it on ANY host — including one with a full
# system python3.8. Pretty-printers, `gdb.execute`, `re`/`collections`/`json`
# all work; the 34 modules ARM built in are the whole surface.
#
# -nros4 fixes linux-arm64 too (issue 0932), by a DIFFERENT route, because the
# two hosts embed Python differently: there gdb LINKS `libpython3.8.so.1.0` and
# fails at the loader before any interpreter runs, so a stdlib alone could not
# help. 22.04 packages no python3.8 — Ubuntu's own focal archive does, for
# arm64, and a library needing at most GLIBC_2.29 runs on the runner's 2.35.
#
# arm64 therefore ends up with MORE working Python than x86_64: `struct` and
# `math` are built into Ubuntu's libpython and 41 more modules arrive in
# lib-dynload, all resolving against the shared library — so `import struct`
# works there and can never work on x86_64. The build asserts exactly that, per
# host, before publishing.
[tool.arm-none-eabi-gcc]
version = "13.2-nros4"
smoke = [
    { run = "bin/arm-none-eabi-gcc --version", expect = "Arm GNU Toolchain" },
    { run = "bin/arm-none-eabi-gdb --version", expect = "GNU gdb" },
]
# `libcrypt` is on the bundler's host-only exclude list (linuxdeploy's), like
# `libselinux` for qemu — so it stays the host's and stays declared. Deleting
# the whole list with the ncurses entries was caught by
# `check-dist-runtime-deps`, which is the gate doing its job on its author.
system = ["libcrypt1"]
upstream = "13.2.rel1" # ARM release id (SSOT — build script no longer hand-derives)
# Repackaged from ARM's release; no in-repo source build (binary toolchain).
dist.linux-x86_64 = { url = "https://github.com/NEWSLabNTU/nano-ros-sdk/releases/download/arm-none-eabi-gcc-13.2-nros4/arm-none-eabi-gcc-linux-x86_64.tar.zst", sha256 = "27d5e5f6f9428157df7900c91b000486184f99fbc1a35ea5c3ca219be9068197" }
dist.linux-arm64 = { url = "https://github.com/NEWSLabNTU/nano-ros-sdk/releases/download/arm-none-eabi-gcc-13.2-nros4/arm-none-eabi-gcc-linux-arm64.tar.zst", sha256 = "841e456d571e3f60244652a5ac7287f9e06a9c61f1fc93d2fbbc037b05f5a6ab" }
dist.macos-arm64 = { url = "https://github.com/NEWSLabNTU/nano-ros-sdk/releases/download/arm-none-eabi-gcc-13.2-nros4/arm-none-eabi-gcc-macos-arm64.tar.zst", sha256 = "d1a2311ff7590e6370be8df34e6dea3d572df83aa95672eb484026f2fd4b6748" }

[tool.zephyr-sdk]
# The Zephyr SDK, host-keyed (issue 0610). `scripts/zephyr/setup.sh` used to
# hardcode the x86_64 tarball AND its sha256, so on any other host it fetched a
# 1.3 GiB archive, PASSED the checksum, and then failed inside the SDK's own
# installer with `Installing host tools ... ERROR: Host tools installation
# failed` — the cross toolchains are host-agnostic, the HOST TOOLS are native
# binaries. Selecting by `dist.<host>` is what this table exists for.
#
# UNLIKE every other `[tool.*]` here, these URLs are UPSTREAM rather than
# repackaged into NEWSLabNTU/nano-ros-sdk. Deliberate: the archive is 1.3 GiB
# and we apply nothing to it, so a repack would cost a release asset per host
# to add zero value. Two consequences to know about — the tarball is `.tar.xz`
# (GNU tar auto-detects it, and the `zstd` preflight in `sdk_store.rs` does not
# apply), and it unpacks to `<prefix>/zephyr-sdk-<version>/` rather than the
# `<prefix>/bin` layout the repacked dists share, which is exactly the path
# `scripts/zephyr/setup.sh` and `ZEPHYR_SDK_INSTALL_DIR` already expect.
#
# Checksums are upstream's, from the release's own `sha256.sum`. Fetching the
# archive is all this entry does: registering the toolchains is the SDK's own
# `setup.sh -t <target>`, which has no expression in this schema and stays in
# the shell script that already runs it.
version = "0.16.8"
upstream = "v0.16.8" # sdk-ng release tag (SSOT for the URLs below)
dist.linux-x86_64 = { url = "https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v0.16.8/zephyr-sdk-0.16.8_linux-x86_64.tar.xz", sha256 = "cb4e4012751e4526aaf1ec1e8ab9b4ded5681e2e01711b64f7a1b519ff7dbc6a" }
dist.linux-arm64 = { url = "https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v0.16.8/zephyr-sdk-0.16.8_linux-aarch64.tar.xz", sha256 = "83782b4cf595bb3da8a6c7c1ade01eed00ad03f8ba0c72da6680693192b3668d" }
dist.macos-arm64 = { url = "https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v0.16.8/zephyr-sdk-0.16.8_macos-aarch64.tar.xz", sha256 = "e06138c1e50cc5b4508646640bd08c50f05f0eb3f2949e756d84d3367f581593" }
dist.macos-x86_64 = { url = "https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v0.16.8/zephyr-sdk-0.16.8_macos-x86_64.tar.xz", sha256 = "b96c849cc63e0f0218c196be8faba548ed473894fb7fced67311aa39fe97ac21" }

[tool.zephyr-sdk-1-0-1]
# The Zephyr SDK for the 4.4 ROLLING line. A second entry rather than a version
# bump on `[tool.zephyr-sdk]`, because the two Zephyr lines need DIFFERENT SDKs
# at the same time: `zephyr/SDK_VERSION` in 3.7 demands 0.16.8 and in 4.4
# demands 1.0.1, and `FindZephyr-sdk.cmake` refuses anything older than the
# tree asks for. `scripts/zephyr/setup.sh` selects the entry by $MANIFEST.
#
# Until this existed, `NROS_ZEPHYR_VERSION=4.4 just zephyr setup` exited 0 and
# produced a workspace that could not build ANY Cortex-M target: the manifest
# and the patch set were line-dispatched, the SDK was not. The failure surfaced
# only at the first `west build`, as a bare `FindZephyr-sdk.cmake:160
# find_package` error naming neither the SDK version nor the step that chose
# it. Found bringing up mr_canhubk3 (S32K344, Cortex-M7).
#
# TWO DIFFERENCES FROM THE 0.16.8 ENTRY, both consequences of upstream's 1.0.x
# repackaging, and both fine for the flow `install_sdk` already runs:
#
#  * These are the `_minimal` archives (~70 MiB, not 1.3 GiB). 1.0.x ships the
#    toolchains as SEPARATE downloads, which the SDK's own `setup.sh -t <target>`
#    fetches on demand — the same command this repo already invokes to register
#    them. So the split costs nothing here and saves the bandwidth of every
#    toolchain we do not use.
#  * There is NO macos-x86_64: upstream ships only aarch64 for macOS at 1.0.x.
#    An Intel Mac on the 4.4 line has no dist and `nros setup` will say so,
#    which is the honest outcome rather than a silent wrong-host fetch (the
#    failure mode issue 0610 was about).
#
# Checksums are upstream's own, from the release's `sha256.sum`; the
# linux-x86_64 one was additionally verified against a local download.
version = "1.0.1"
upstream = "v1.0.1" # sdk-ng release tag (SSOT for the URLs below)
dist.linux-x86_64 = { url = "https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v1.0.1/zephyr-sdk-1.0.1_linux-x86_64_minimal.tar.xz", sha256 = "ca9bc0ff66fafca1dac9d592a36d953cf16d096a9d09b1c0357f021cf9f6a7eb" }
dist.linux-arm64 = { url = "https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v1.0.1/zephyr-sdk-1.0.1_linux-aarch64_minimal.tar.xz", sha256 = "d79c5bfc68e679488659bea289a4026e52a64f03338875c8c9c850fff13cee30" }
dist.macos-arm64 = { url = "https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v1.0.1/zephyr-sdk-1.0.1_macos-aarch64_minimal.tar.xz", sha256 = "867063901f39528a6175a80ebc20367bd6cb440593e7e2650eda30392f1f6b65" }

[tool.riscv-none-elf-gcc]
version = "14.2-nros1"
smoke = [
    { run = "bin/riscv-none-elf-gcc --version", expect = "riscv-none-elf-gcc" },
]
upstream = "14.2.0-3" # xPack build (SSOT — was hardcoded only in the build script)
dist.linux-x86_64 = { url = "https://github.com/NEWSLabNTU/nano-ros-sdk/releases/download/riscv-none-elf-gcc-14.2-nros1/riscv-none-elf-gcc-linux-x86_64.tar.zst", sha256 = "0f7a938cf5724c6c4ac48af140ede038015d63df1a6460f671d1215fff5ba622" }
dist.linux-arm64 = { url = "https://github.com/NEWSLabNTU/nano-ros-sdk/releases/download/riscv-none-elf-gcc-14.2-nros1/riscv-none-elf-gcc-linux-arm64.tar.zst", sha256 = "8eba3c6e8e9dd51ae0583146209100a5e09a670649f1ed0840c26608caa32095" }
dist.macos-arm64 = { url = "https://github.com/NEWSLabNTU/nano-ros-sdk/releases/download/riscv-none-elf-gcc-14.2-nros1/riscv-none-elf-gcc-macos-arm64.tar.zst", sha256 = "eb9cd46e48e2196fb13d09112a655b3b926ff18a2350eb7ae79336205165b954" }

# zenohd — REMOVED (phase-362 / RFC-0075).
#
# The zenoh router now comes from ROS: `ros2 run rmw_zenoh_cpp rmw_zenohd`,
# which ships with `rmw_zenoh_cpp` and links the same `libzenohc.so` the RMW
# does, so it cannot drift from the thing it has to interoperate with. Ours
# could, and the drift was invisible: issue 0609 measured `rmw_zenoh_cpp`
# 0.1.1 -> 0.1.9 moving its vendored zenoh 1.2.0 -> 1.8.0 while our 1.7.2 pin —
# held "for rmw_zenoh_cpp compat" — took part in neither the failure nor the fix.
#
# This entry was SOURCE-ONLY, and it was the one that mattered most to a
# first-time user: zenoh is the default rmw, so `nros setup native` — the book's
# headline board — source-built a router before anything could run. That is
# issue 0374, and it is now gone by construction rather than by seeding a
# prebuilt asset nobody would have to download either.

# sccache — shared compiler cache (issue #74). The justfile already wires
# `RUSTC_WRAPPER := sccache` (and the zephyr fixture build uses it as a CMake
# COMPILER_LAUNCHER) when it is on PATH, so provisioning it halves clean / CI
# rebuilds (measured ~46% host, ~22% embedded — docs/development/build-ux-audit.md).
# Source-only for now: `dist.<host>` is left out until a prebuilt asset is seeded
# on NEWSLabNTU/nano-ros-sdk, so `nros setup --tool sccache` falls back to the
# source recipe (`cargo install sccache`).
[tool.sccache]
version = "0.17.0-nros1"
upstream = "0.17.0" # = source.ref (mozilla/sccache release tag, without the `v`)
[tool.sccache.source]
git = "https://github.com/mozilla/sccache"
ref = "v0.17.0"
# vendored-openssl: the default features pull openssl-sys, which hard-fails
# on any host without libssl-dev (observed 2026-08-03; the RFC-0062 class —
# an undeclared system dep). Vendoring removes the system dep entirely.
install = "cargo install --path . --root {prefix} --locked --features vendored-openssl"

# issue 0928 — -nros2 bundles its closure (`RUNPATH=$ORIGIN/../lib`), so the
# `system = [..]` this carried for one day is GONE rather than shortened.
# Measured on the released tarball: external closure 4 -> 0, and `openocd
# --version` runs on a host where -nros1 died with
# `error while loading shared libraries: libftdi.so.1`.
#
# That soname was the reason this dist ranked first for the re-cut: Ubuntu
# provides it as `libftdi1` at version 0.20 — libftdi *0.x* — while the modern
# `libftdi1-2` a developer host already has ships `libftdi1.so.2` and does not
# satisfy it. Declaring it only told the user to install a package whose name
# looks like one they have.
[tool.openocd]
version = "0.12.0-nros2"
smoke = [
    { run = "bin/openocd --version", expect = "Open On-Chip Debugger" },
]
upstream = "v0.12.0" # upstream tag (SSOT — build script no longer hand-derives)
dist.linux-x86_64 = { url = "https://github.com/NEWSLabNTU/nano-ros-sdk/releases/download/openocd-0.12.0-nros2/openocd-linux-x86_64.tar.zst", sha256 = "0c999015212391add99f0428b2d8401383f3a65ff5cc43157f71c2eb15b5b47c" }
dist.linux-arm64 = { url = "https://github.com/NEWSLabNTU/nano-ros-sdk/releases/download/openocd-0.12.0-nros2/openocd-linux-arm64.tar.zst", sha256 = "3235ef67860cc83ac6ac95f940801602683e25ecfed00c968ef01580e5115b6d" }
dist.macos-arm64 = { url = "https://github.com/NEWSLabNTU/nano-ros-sdk/releases/download/openocd-0.12.0-nros2/openocd-macos-arm64.tar.zst", sha256 = "33e0131e483e3a00274c2ae7df5939e368d8969df38d7c36101354d74dcaca86" }

# Micro-XRCE-DDS Agent — the host daemon the XRCE-DDS RMW connects to (the
# counterpart to zenohd for the rmw-xrce path). Source build is a CMake
# superbuild (pulls Fast-DDS/Fast-CDR), so prefer the prebuilt once seeded.
[tool.xrce-agent]
version = "2.4.3-nros1"
system = ["libssl3"]
upstream = "v2.4.3" # = source.ref (eProsima release tag)
dist.linux-x86_64 = { url = "https://github.com/NEWSLabNTU/nano-ros-sdk/releases/download/xrce-agent-2.4.3-nros1/xrce-agent-linux-x86_64.tar.zst", sha256 = "61c2e7786ffdbc3ea7f19882f12fb9dd3c28756c6dafd6ec459c9fa86de9438f" }
dist.linux-arm64 = { url = "https://github.com/NEWSLabNTU/nano-ros-sdk/releases/download/xrce-agent-2.4.3-nros1/xrce-agent-linux-arm64.tar.zst", sha256 = "29c6d7db3147bd9b0fac7d76ece23d90fa22907a7a556b88c3c2f9d6b8ba0344" }
dist.macos-arm64 = { url = "https://github.com/NEWSLabNTU/nano-ros-sdk/releases/download/xrce-agent-2.4.3-nros1/xrce-agent-macos-arm64.tar.zst", sha256 = "08133ec56db8fb5c0d80cfb5c99b5dea52e8b1af5932a5057fd153c1cb896e96" }
[tool.xrce-agent.source]
git = "https://github.com/eProsima/Micro-XRCE-DDS-Agent"
ref = "v2.4.3"
configure = "cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DUAGENT_BUILD_EXECUTABLE=ON -DUAGENT_P2P_PROFILE=OFF -DUAGENT_LOGGER_PROFILE=OFF -DUAGENT_SOCKETCAN_PROFILE=OFF"
# Superbuild: no top-level `install` target + the binary's RUNPATH is absolute,
# so build then assemble a relocatable prefix (real binary + bundled libs + a
# wrapper that points LD/DYLD_LIBRARY_PATH at ../lib). Mirrors
# nano-ros-sdk/scripts/build-xrce-agent.sh.
install = '''cmake --build build --parallel $(nproc) && mkdir -p {prefix}/bin {prefix}/lib && cp -a build/MicroXRCEAgent {prefix}/lib/MicroXRCEAgent.real && find build -maxdepth 1 \( -name 'libmicroxrcedds_agent.so*' -o -name 'libmicroxrcedds_agent*.dylib' \) -exec cp -a {} {prefix}/lib/ \; && find build/temp_install \( -name 'libfastrtps*.so*' -o -name 'libfastrtps*.dylib' -o -name 'libfastcdr*.so*' -o -name 'libfastcdr*.dylib' \) -exec cp -a {} {prefix}/lib/ \; && printf '#!/bin/sh\nh="$(cd "$(dirname "$0")" && pwd)"\nLD_LIBRARY_PATH="$h/../lib:$LD_LIBRARY_PATH" DYLD_LIBRARY_PATH="$h/../lib:$DYLD_LIBRARY_PATH" exec "$h/../lib/MicroXRCEAgent.real" "$@"\n' > {prefix}/bin/MicroXRCEAgent && chmod +x {prefix}/bin/MicroXRCEAgent'''

# Cyclone DDS host tools — `idlc` (descriptor codegen) + `libddsc` for the
# rmw-cyclonedds path (native + the embedded cross-ddsc base). Built from the
# NEWSLabNTU fork's `nano-ros` integration branch, pinned to the submodule sha.
[tool.cyclonedds]
version = "0.10.5-nros1"
system = ["libssl3"]
upstream = "12b4af2c5ac98657d42df84a5a45006ceede503b" # fork sha = submodule pointer
dist.linux-x86_64 = { url = "https://github.com/NEWSLabNTU/nano-ros-sdk/releases/download/cyclonedds-0.10.5-nros1/cyclonedds-linux-x86_64.tar.zst", sha256 = "ed8a51eac91a884f39bfff4fe824923e5edf1f9dadb4a941c99a9f080c7217d3" }
dist.linux-arm64 = { url = "https://github.com/NEWSLabNTU/nano-ros-sdk/releases/download/cyclonedds-0.10.5-nros1/cyclonedds-linux-arm64.tar.zst", sha256 = "4c224398115bd45e14b37d6c8de7e94f4aed6f46da762f517654221327c51d5e" }
dist.macos-arm64 = { url = "https://github.com/NEWSLabNTU/nano-ros-sdk/releases/download/cyclonedds-0.10.5-nros1/cyclonedds-macos-arm64.tar.zst", sha256 = "f13c0dab71aa953c72aa5e5b4d7d8022a48de1670ccf28b103920ec06f1c3715" }
[tool.cyclonedds.source]
git = "https://github.com/NEWSLabNTU/cyclonedds"
ref = "12b4af2c5ac98657d42df84a5a45006ceede503b"
configure = "cmake -S . -B build -DCMAKE_INSTALL_PREFIX={prefix} -DCMAKE_BUILD_TYPE=Release -DBUILD_IDLC=ON -DBUILD_TESTING=OFF -DBUILD_DDSPERF=OFF"
install = "cmake --build build --parallel $(nproc) --target install"

# play_launch_parser — the launch-graph parser the `nros plan` /
# `nros codegen-system` resolver shells out to when synthesising or
# multi-resolving `<pkg>/launch/*.launch.xml` (Phase 212.L.6). The
# resolver builds the XML body (synth-from-Component-pkg OR pkg-named
# vs system.launch.xml precedence) in-memory and pipes it through this
# binary to get the `record.json` the planner consumes. Without it the
# Phase 212 L.6 gate tests (`phase212_l6_launch_synth::*`) skip clean;
# with it they transition SKIP -> PASS, closing the §Acceptance
# "Launch file synthesis works" + "Multi-launch resolution works"
# bullets.
#
# Source-build only — the upstream `jerry73204/play_launch_parser` repo
# is a Rust workspace (no PyPI package, no prebuilt release tags), so
# install via `cargo install --path crates/play_launch_parser` (same
# shape as `[tool.nros]` / `[tool.zenohd]`). Pinned to a SHA on `main`
# (no upstream tags yet) — same convention the `[tool.cyclonedds]` row
# uses to pin a SHA on the NEWSLabNTU fork's `nano-ros` branch. The
# cmd-line surface the L.6 resolver requires (`play_launch_parser --help`,
# the `launch <pkg> <file>` subcommand) has been stable across the
# pinned `main` window, but bumping the SHA is the explicit signal to
# re-run the L.6 gate tests.
#
# Build-time prereq: a Python dev install (pyo3 `auto-initialize` links
# libpythonX.Y at build time). On the default-tier host that's already
# present (apt `python3`/`python3-dev` covered by `just workspace
# apt-packages`); on bare-bones CI it would be the one extra apt
# package, but neither tier moves a module without docs + orchestrator
# updates so this stays implicit (the `workspace` module is the
# umbrella). Header/binary-only install at well under the 500 MB /
# 5 min `default` tier policy in `docs/development/sdk-tiers.md`,
# idempotent (the `just workspace install-play-launch-parser` recipe
# gates on a `.installed-version` stamp).
# SUPERSEDED SOURCE, 2026-08-28. `jerry73204/play_launch_parser` is ARCHIVED;
# the crate lives on inside `NEWSLabNTU/play_launch`, which this repo already
# pins as a submodule at `packages/cli/third-party/play_launch`. Pointing here
# at the archived repo gave ONE component TWO independent pins — the LIBRARY
# half is path-dep'd from the submodule by `nros-launch-resolve`, the BINARY
# half was cloned from the standalone repo — with nothing keeping them in step.
# That is the drift class of issues 0609 (zenoh router) and 0507 (cyclonedds).
#
# `just workspace install-play-launch-parser` now builds from the SUBMODULE and
# fetches nothing; this row remains so `nros setup --tool play_launch_parser`
# and `nros sdk-path` keep working for an out-of-tree consumer, and its `ref` is
# the submodule pin so the two cannot disagree.
[tool.play_launch_parser]
version = "0.1.0-nros1"
system = ["libexpat1", "libpython310", "libz1"]
upstream = "838ce948551f8ba263648fbb7eeb572cec9d5950" # = source.ref (play_launch pin; no upstream tags)
[tool.play_launch_parser.source]
git = "https://github.com/NEWSLabNTU/play_launch"
ref = "838ce948551f8ba263648fbb7eeb572cec9d5950"
install = "cargo install --path src/ros-launch-resolve/parser/crates/play_launch_parser --root {prefix} --locked"

# Corrosion — the CMake ↔ Rust/Cargo bridge that `corrosion_import_crate()`
# in mixed-language workspaces (Phase 212 — `cmake/NanoRosThreadxSystemCodegen.cmake`,
# `multi_pkg_workspace_mixed` fixture, examples/native/rust talker/listener
# CycloneDDS path) depends on. Header/config-only at install time: a small
# CMake superproject staged into `~/.nros/sdk/corrosion/share/corrosion/`
# (well under the 500 MB / 5 min `default` tier policy in
# `docs/development/sdk-tiers.md`, idempotent — `just workspace install-corrosion`
# already gates on a `.installed-version` stamp). Source-built only — upstream
# `corrosion-rs/corrosion` releases ship source tarballs, not prebuilt binaries
# we mirror, so no `dist.<host>` rows. Pinned to the same `v0.6.1` tag the
# `just workspace install-corrosion` recipe uses, so a `nros setup --tool corrosion`
# and a `just workspace install-corrosion` land the same Corrosion version at the
# same prefix. The Phase 212 `cmake_mixed_corrosion_bridge_builds` test (and the
# `just workspace doctor` check) both expect `~/.nros/sdk/corrosion/`.
[tool.corrosion]
# issue 0493 — bumped v0.5.1 -> v0.6.1 on 2026-08-10. This is ADOPTING AN
# UPSTREAM FIX, not an experiment: read from the two installed sources,
# v0.5.1's Corrosion.cmake:751 sets the cargo target dir to a CONSTANT
# `${CMAKE_BINARY_DIR}/${build_dir}/cargo/build`, so two workspace roots
# configured into one binary dir share one `deps/` and their `#[no_mangle]`
# exports collide at link. v0.6.1:781-784 hashes the workspace manifest path
# into the directory name (`SHA1`, first 5 chars), which cannot collide.
#
# v0.6.1 is ALREADY exercised on every workspace/fixture build here — those
# configures miss the SDK prefix and fall through to FetchContent v0.6.1. So the
# bump makes the SUPPORTED path match the one already proven green, rather than
# introducing an untested version.
version = "0.6.1-nros1"
# issue 1060 — a TAG is not a pin. It is a ref on a server we do not control, so
# an upstream retag moves what we build with no local diff, no review and no
# gate. The cmake FetchContent fallback therefore fetches the COMMIT this tag
# resolved to on 2026-09-05:
#
#     1499b14e4906a2890f5cee1547c8848db261753d   ("Prepare v0.6.1 release", #656)
#
# resolved with `git ls-remote https://github.com/corrosion-rs/corrosion
# refs/tags/v0.6.1`. There is no peeled `^{}` line, so v0.6.1 is a LIGHTWEIGHT
# tag and that ref IS the commit (confirmed: `git cat-file -t` says `commit`).
#
# The digest lives in `_nros_corrosion_pin()` in `cmake/NanoRosCorrosion.cmake`,
# not in a key here, because this table deserialises into `ToolPackage` with
# serde `deny_unknown_fields` — an unknown key fails EVERY `SdkIndex::load`
# (`nros setup`, `nros doctor`, the metadata build), and adding one is a schema
# change in `packages/cli`. The two halves still cannot drift: moving the tag
# above without moving that commit is a configure FATAL_ERROR. If the schema
# later grows a commit key, the module already prefers it over its own literal.
#
# `source.ref` below is a SEPARATE fetch — the SDK-store recipe `nros setup
# --tool corrosion` clones — and is still a tag. Same defect class, different
# code path (`sdk_store.rs`), not fixed here.
upstream = "v0.6.1" # = source.ref (corrosion-rs/corrosion release tag)
[tool.corrosion.source]
git = "https://github.com/corrosion-rs/corrosion"
ref = "v0.6.1"
configure = "cmake -S . -B build -DCMAKE_INSTALL_PREFIX={prefix} -DCMAKE_BUILD_TYPE=Release -DCORROSION_BUILD_TESTS=OFF"
install = "cmake --build build --parallel $(nproc) --target install"

# Phase 197.3 — Espressif's QEMU fork (provides the `esp32c3` machine the ESP32
# emulator tests need; stock qemu-system-riscv32 only knows `virt`). Source-built
# only (not hosted) — `just esp32 setup` → `nros setup --tool esp32-qemu`.
[tool.esp32-qemu]
version = "esp-develop-nros1"
# Source-built (no dist): the first three are BUILD deps of qemu's meson
# configure — found undeclared when the configure died on glib-2.0 (phase-327 W4
# applied to source recipes; probed BEFORE the build so the failure names
# packages).
#
# The rest are RUNTIME sonames the built binary linked, found by
# `check-dist-runtime-deps` against a source build of this very recipe. Each was
# already a `[prereq.*]` key; only this list was missing them, which is the
# hand-authored half issue 0926 named.
#
# They were called core, and three of them are NOT — read off the fork's own
# `meson.build` at the pinned tag (issue 1006). Unconditional: `zlib`
# (`dependency('zlib', required: true)`) and `pcre2` (glib's transitive).
# `selinux` and curses -> `libtinfo` are AUTO-DETECTED features like every other
# backend, and qemu links no openssl anywhere in `meson.build` at all — `libssl3`
# arrived through libcurl/libssh, which the `configure` below now disables BY
# NAME. So those three are expected to leave the closure on the next rebuild.
# They stay declared until one happens: `check-dist-runtime-deps` checks
# COVERAGE, not minimality, so an over-declaration is safe, while deleting them
# without a re-measure would be a guess.
system = [
    "libglib2-dev",
    "libpixman-dev",
    "libgcrypt-dev",
    "libssl3",
    "libpcre2",
    "libselinux1",
    "libtinfo6",
    "libz1",
]
upstream = "esp-develop"
[tool.esp32-qemu.source]
git = "https://github.com/espressif/qemu"
# A tag, not a bare SHA: nros's source-build clones by ref (git clone --branch),
# which needs a branch/tag. esp-develop line provides the `esp32c3` machine.
ref = "esp-develop-9.2.2-20260417"
# `--disable-werror` — this fork is pinned to the esp-develop 9.2.2 line, and
# QEMU builds -Werror by default, so any compiler NEWER than the fork fails on
# warnings in upstream's own code rather than on anything we did. Observed with
# gcc 16.1.1: `util/log.c:188` takes `char *pidstr = strstr(filename, "%")`,
# which newer headers type as `const char *` →
# `-Werror=discarded-qualifiers`, 643 objects into a 2670-object build. Pinning
# the source and not the compiler makes this inevitable on a rolling host; the
# alternative (patching upstream C in a vendored fork we do not maintain) is
# strictly worse. `[tool.qemu]` does not need it — it is 11.0.0 and normally
# arrives as a prebuilt `dist`.
#
# issue 1006 — THE REST OF THIS LINE IS A LINK-SURFACE PIN, not taste. qemu's
# configure AUTO-DETECTS every optional backend: a feature whose `--enable-`/
# `--disable-` is not passed stays `auto`, so `dependency(..., required:
# get_option(<f>))` resolves against whatever dev headers the BUILD HOST happens
# to carry and the binary links them. This recipe is source-built with NO dist —
# every user runs it — so an unpinned feature makes the runtime dependency set a
# property of the machine rather than of the recipe. Measured:
# `check-dist-runtime-deps` against a source build here found 69 sonames no
# `[prereq.*]` declares (audio, X11, curl/ssh/usb/dbus), which is exactly why
# DECLARING them would have recorded one host's accident as a contract.
#
# What is left reachable is what `-M esp32c3 -icount 3 -nographic -drive
# file=...,if=mtd,format=raw -nic user,model=open_eth` needs (the invocation in
# `scripts/esp32/launch-esp32c3.sh` and `nros-tests/src/esp32.rs`): TCG, the raw
# block layer, slirp, and gcrypt for the fork's secure-boot crypto. The rest is
# off BY NAME, in groups: UI, audio, host-device passthrough, network/format
# block drivers, TLS, and the remaining host libraries.
#
# NOT `--audio-drv-list=` on its own, which is the fix the issue prescribed and
# which the tag REFUTES: `audio/meson.build` builds a module for every driver
# whose dependency `.found()`, not for the ones named in `audio_drv_list`, so an
# empty list only changes `CONFIG_AUDIO_DRIVERS` and leaves libasound/libpulse
# (and libpulse's libsndfile/FLAC/vorbis/ogg/X11 tail) linked. The per-driver
# `--disable-alsa --disable-pa ...` is what cuts them, and with all of them off
# the default list resolves to empty anyway, so the list flag buys nothing.
#
# Every flag token here is ACCEPTED BY THIS TAG — checked against the fork's own
# generated `scripts/meson-buildoptions.sh` and configure's case list at
# `esp-develop-9.2.2-20260417`, where an unrecognised option is `ERROR: unknown
# option`, a hard configure failure. What the resulting closure actually is
# stays UNMEASURED until someone runs `nros setup --tool esp32-qemu` and re-runs
# `check-dist-runtime-deps` (this recipe was not rebuilt to land the pin).
#
# Left auto DELIBERATELY: fdt (the riscv boards require it), pixman, zlib
# (`required: true`), and the slirp/gcrypt pair enabled above.
configure = "./configure --target-list=riscv32-softmmu --prefix={prefix} --enable-gcrypt --enable-slirp --disable-werror --disable-strip --disable-user --disable-capstone --disable-docs --disable-tools --disable-guest-agent --disable-gtk --disable-vnc --disable-sdl --disable-sdl-image --disable-curses --disable-spice --disable-spice-protocol --disable-dbus-display --disable-opengl --disable-virglrenderer --disable-png --disable-vte --disable-xkbcommon --disable-alsa --disable-pa --disable-jack --disable-oss --disable-sndio --disable-pipewire --disable-libusb --disable-usb-redir --disable-smartcard --disable-u2f --disable-canokey --disable-brlapi --disable-libudev --disable-mpath --disable-curl --disable-libssh --disable-rbd --disable-glusterfs --disable-libiscsi --disable-libnfs --disable-blkio --disable-fuse --disable-gnutls --disable-seccomp --disable-cap-ng --disable-attr --disable-virtfs --disable-numa --disable-selinux --disable-libdw --disable-libcbor --disable-libkeyutils --disable-auth-pam --disable-vde --disable-af-xdp --disable-bpf --disable-linux-aio --disable-linux-io-uring --disable-libpmem --disable-libdaxctl --disable-zstd --disable-lzo --disable-snappy --disable-bzip2 --disable-lzfse"
install = "ninja -C build -j$(nproc) && ninja -C build install"

# issue 0486 — espflash packs an ELF into the ESP32 flash image the QEMU runner
# and the e2e tests actually boot (`espflash save-image --merge`). It was
# documented in prose only (`docs/guides/esp32-setup.md`) and reachable solely by
# a hand-run `cargo install`, so a host that completed `just esp32 setup` still
# produced NO flash images — the pack step warned and the lane exited 0. That is
# issue 0399's shape one dependency over: 0399 declared `riscv-none-elf-gcc`
# because a documented-provisioned host could not COMPILE the example; this is
# the same claim about the PACK step.
#
# Source-built and pinned like every other cargo tool here (`[tool.sccache]`,
# `[tool.play_launch_parser]`) rather than a bare `cargo install espflash`, which
# would resolve against crates.io at whatever version is current that day — the
# drift the pinning convention and the project-wide `--locked` shim exist to
# prevent. The binary lives in the `espflash/` subdir of the workspace
# (`cargo-espflash/` is the separate cargo-subcommand front end and is not
# wanted here).
#
# NO `system = [...]`: verified by building it on a clean host 2026-08-10 —
# `serialport v4.9.0` compiles with no libudev dev package present, so the
# historical libudev requirement no longer applies. Probed rather than assumed,
# because an undeclared system dep is the RFC-0062 class that `[tool.sccache]`
# carries `--features vendored-openssl` to avoid.
[tool.espflash]
version = "4.5.0-nros1"
upstream = "v4.5.0" # = source.ref (esp-rs/espflash release tag)
[tool.espflash.source]
git = "https://github.com/esp-rs/espflash"
ref = "v4.5.0"
install = "cargo install --path espflash --root {prefix} --locked"

# 194.3c — genromfs: the NuttX rv-virt board's src/Makefile unconditionally bakes
# an etc/ ROMFS (RCSRCS = etc/init.d/{rc.sysinit,rcS}) via `genromfs`, so any
# rv-virt `make export` needs it on PATH. The qemu-armv7a board has no RCSRCS, so
# arm doesn't. Source-built (tiny single-file C tool; not apt — keeps "everything
# via nros setup"). Installs to {prefix}/bin/genromfs; activate puts the SDK-store
# bins on PATH. Only the qemu-riscv-nuttx board lists it.
[tool.genromfs]
version = "0.5.7-nros1"
upstream = "0.5.7"
[tool.genromfs.source]
git = "https://github.com/chexum/genromfs"
ref = "0.5.7"
configure = "make genromfs"
install = "install -D -m 0755 genromfs {prefix}/bin/genromfs"

# ninja — the generator every cmake configure in this repo emits for, and the
# JOBSERVER CLIENT half of the Phase 176 unified pool.
#
# WHY A VERSION FLOOR AND NOT "whatever the distro ships"
#
# Ninja gained GNU Make jobserver support in 1.13 ("Since version 1.13, Ninja
# builds can follow the GNU Make jobserver client protocol"), and only the
# FIFO flavour — the one make 4.4 speaks. Below 1.13 ninja simply ignores an
# inherited `MAKEFLAGS` and takes `-j <nproc>` of its own, so a build nested
# under a pool silently oversubscribes instead of sharing the budget. That is
# the same shape as `[prereq.openocd]`: a system copy is fine WHEN it is new
# enough, and `min` is what makes "new enough" decidable rather than a hope.
# Ubuntu 22.04 ships 1.10.1, so on that distro the chain falls through to the
# store and the user installs nothing by hand.
#
# Note the client/server split, because it decides what this buys: ninja is a
# jobserver CLIENT ONLY — it never hands tokens to the cargo IT spawns. Pairing
# it with pinned make 4.4 (the server) is what bounds a nested build; ninja
# alone does not.
#
# Source-built rather than dist: upstream ships prebuilt zips, but this index's
# `dist.*` rows are assets on the NEWSLabNTU/nano-ros-sdk mirror and none is
# seeded for ninja yet. Per the header, leaving `dist.<host>` out makes
# `nros setup` fall back to this recipe. Cheap and self-contained — cmake plus
# a C++ compiler, both already prereqs, and no autotools.
# Verified 2026-08-31: depth-1 fetch of v1.13.2 + this configure/install pair
# produces a `ninja --version` of 1.13.2.
[tool.ninja]
version = "1.13.2"
upstream = "v1.13.2" # = the ninja-build/ninja release tag
# PREBUILT FIRST — upstream publishes these, so we take them rather than
# rebuilding what they already built. The `[tool.ninja.source]` recipe below is
# the FALLBACK for a host they ship no asset for; `dist_for(host)` is consulted
# first, so it only runs where it has to.
#
# Each carries its own `install`, because the default unpack (`tar -xf` into the
# prefix) cannot take these: they are zips, and they hold a BARE `ninja` with no
# `bin/` directory. That is what an upstream asset looks like when it was not
# built to our mirror's shape, and it is why `DistArtifact.install` exists.
dist.linux-x86_64 = { url = "https://github.com/ninja-build/ninja/releases/download/v1.13.2/ninja-linux.zip", sha256 = "5749cbc4e668273514150a80e387a957f933c6ed3f5f11e03fb30955e2bbead6", install = "unzip -o {archive} -d {prefix}/bin && chmod +x {prefix}/bin/ninja" }
dist.linux-arm64 = { url = "https://github.com/ninja-build/ninja/releases/download/v1.13.2/ninja-linux-aarch64.zip", sha256 = "fd2cacc8050a7f12a16a2e48f9e06fca5c14fc4c2bee2babb67b58be17a607fc", install = "unzip -o {archive} -d {prefix}/bin && chmod +x {prefix}/bin/ninja" }
dist.macos-arm64 = { url = "https://github.com/ninja-build/ninja/releases/download/v1.13.2/ninja-mac.zip", sha256 = "c99048673aa765960a99cf10c6ddb9f1fad506099ff0a0e137ad8960a88f321b", install = "unzip -o {archive} -d {prefix}/bin && chmod +x {prefix}/bin/ninja" }
system = ["unzip"]
# Fallback only. Verified 2026-08-31 that it does produce a 1.13.2 binary, so a
# host off the three asset arches is not stranded.
[tool.ninja.source]
git = "https://github.com/ninja-build/ninja"
ref = "v1.13.2"
# BUILD_TESTING=OFF — the test target fetches googletest, and a provisioning
# step must not need the network mid-build.
configure = "cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF"
install = "cmake --build build -j$(nproc) && install -D -m 0755 build/ninja {prefix}/bin/ninja"

# make — the jobserver SERVER half. Source-built because upstream ships NO
# prebuilt binary: ftp.gnu.org carries release tarballs only, so the policy's
# fallback arm is the only arm available here.
#
# A TARBALL and not `git`, because GNU make's git tree at 4.4.1 ships no
# `configure` — only `bootstrap`, which wants autoconf/automake/gettext and
# pulls gnulib. That is what `[tool.*.source].url` was added for.
#
# The install step carries what the retired `just workspace install-make`
# recipe knew:
#   --without-guile   make's configure AUTODETECTS a host guile and links it,
#                     which made the binary unportable across the ROS
#                     distrobox (one tree, two distros): an Arch build linked
#                     libguile-3.0.so.1 that Ubuntu 22.04 could not satisfy and
#                     every box-side build died in the loader. Nothing here
#                     calls make's `$(guile ...)`.
#   ./build.sh        make's own bootstrap build — you need a make to build
#                     make, and this is how the project avoids that.
#   the ldd refusal   an install that silently linked guile is the failure
#                     above, deferred to someone else's machine.
#   gmake             cmake generators and RTOS kernel makefiles invoke `gmake`;
#                     without the alias a stray system make 4.3 answers and
#                     chokes on the inherited `--jobserver-auth=fifo:`.
[tool.make]
version = "4.4.1"
upstream = "4.4.1"
system = ["curl"]
[tool.make.source]
url = "https://ftp.gnu.org/gnu/make/make-4.4.1.tar.gz"
sha256 = "dd16fb1d67bfab79a72f5e8390735c49e3e8e70b4945a15ab1f81ddb78658fb3"
configure = "./configure --without-guile"
install = "./build.sh && if ldd make 2>/dev/null | grep -q guile; then echo 'refusing: built make links guile (see the index note)' >&2; exit 1; fi && install -D -m 0755 make {prefix}/bin/make && ln -sf make {prefix}/bin/gmake"

# mdBook — the book builder (`just setup-mdbook`, consumed by `just book`).
#
# phase-422 W2: retired from `scripts/setup-mdbook.sh` + a hand-kept
# `scripts/mdbook-checksums.txt`. That pair was a SECOND provisioning mechanism
# for a tool this schema already describes: its own version pin, its own host
# table, its own checksum file, its own "already at the pin?" compare — every
# one of which has exactly one home here. `[tool.make]` and `[tool.ninja]` moved
# off their bespoke `just workspace install-*` recipes for the same reason: a
# tool with two installers has two pins, and nothing makes them agree.
#
# PREBUILT, never `cargo install`: mdBook drags a large dependency tree and a
# docs tool has no business costing a compile.
#
# WHY musl ON BOTH LINUX ARCHES (carried over from the retired script)
#
# The release ships two Linux x86_64 builds, `-gnu` and `-musl`, and for aarch64
# only `-musl`. A `-gnu` build is dynamically linked against the glibc of the
# machine that BUILT it, and glibc's symbols are versioned — so it runs on a
# newer glibc and dies on an older one with `version 'GLIBC_2.xx' not found`, at
# exec time, from the loader. That is not hypothetical: it is exactly the class
# `[tool.verus]` below has to be PINNED around. A `-musl` build is statically
# linked, so the same file runs on Ubuntu 20.04, a 2026 Arch box and Alpine in
# CI, and for a tool that reads markdown and writes HTML the static-linking
# trade-offs that matter elsewhere (NSS, dlopen, locale) do not apply. Taking
# musl on x86_64 too, rather than gnu-where-available, keeps ONE code path per
# OS — a per-arch split is the asymmetry that works until the aarch64 runner is
# the one that breaks.
#
# Each dist carries its own `install`, like ninja's: these are UPSTREAM assets,
# not our mirror's shape — a `.tar.gz` holding a BARE `mdbook` with no `bin/`.
#
# sha256s VERIFIED 2026-09-05 by downloading each asset and hashing it; all four
# also match GitHub's own published `digest` field for the release.
[tool.mdbook]
version = "0.5.4"
smoke = [
    # `mdbook --version` prints `mdbook v0.5.4` — the `v` is the tool's, not the
    # tag's, which is why the retired script had to strip it from both sides
    # before comparing. Asserting the whole string keeps a re-cut tag from
    # passing as the version it claims.
    { run = "bin/mdbook --version", expect = "mdbook v0.5.4" },
]
upstream = "v0.5.4" # rust-lang/mdBook release tag (SSOT for the URLs below)
dist.linux-x86_64 = { url = "https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-musl.tar.gz", sha256 = "5222beabd3e37dc5be0d18ff99b79058469354db5c220153a1b92db5ba12be89", install = "mkdir -p {prefix}/bin && tar -xf {archive} -C {prefix}/bin && chmod +x {prefix}/bin/mdbook" }
dist.linux-arm64 = { url = "https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-aarch64-unknown-linux-musl.tar.gz", sha256 = "753e5c5c363ee8a56972344dcf91466f005a51db84a7aeffe427ae3ef83d6d44", install = "mkdir -p {prefix}/bin && tar -xf {archive} -C {prefix}/bin && chmod +x {prefix}/bin/mdbook" }
dist.macos-arm64 = { url = "https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-aarch64-apple-darwin.tar.gz", sha256 = "03e8a6d8b13a2971e0b3280affd03b388373c1485e26f73407c3a76b0b1838df", install = "mkdir -p {prefix}/bin && tar -xf {archive} -C {prefix}/bin && chmod +x {prefix}/bin/mdbook" }
dist.macos-x86_64 = { url = "https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-apple-darwin.tar.gz", sha256 = "a47d7bf0d5d670cff9ee6cce95537cbeb62dc10704d9e7131ffbd13e2b59a5de", install = "mkdir -p {prefix}/bin && tar -xf {archive} -C {prefix}/bin && chmod +x {prefix}/bin/mdbook" }

# Verus — unbounded deductive verification (`just verification verus`, run by
# `just verify-verus`).
#
# phase-422 W2: retired from `scripts/setup-verus.sh`, and THE PIN IS THE POINT.
# That script resolved its asset through the GitHub releases API — `latest` by
# request, a tag by default — so the thing it fetched was a query answered at
# run time rather than a fact recorded in the tree, and its checksum was not
# recorded at all. A tool provisioned that way has no pin to verify against.
#
# The pinned release is a DECISION, not a lag (issue 0368 F6 / phase-327 W6):
# `releases/latest` moved to a runner whose binaries demand `GLIBC_2.39` (Ubuntu
# 24.04+), and on the oldest supported LTS (22.04, glibc 2.35) that is a raw
# loader error. This is the newest release bisected to run there (2026-08-01:
# 0.2026.05.17 and 0.2026.06.28 run; 0.2026.07.05 / 07.12 / 07.18 / 07.27 all
# demand 2.39). Re-measured 2026-09-05 on the x86-linux asset: `verus` and
# `rust_verify` need at most GLIBC_2.34, `z3` 2.29 — all under 22.04's 2.35.
# Before bumping, check EVERY binary in the bundle, not just `verus`:
#   objdump -T <bin> | grep -o 'GLIBC_2\.[0-9]*' | sort -V | tail -1
#
# NO linux-arm64, deliberately: upstream publishes x86-linux, x86-macos,
# arm64-macos and x86-win only. An aarch64 Linux host has no dist, no source
# recipe, and `nros setup` says so — which is what the retired script's
# `Unsupported platform` arm did, one mechanism over.
#
# The asset is a zip holding a `verus-<platform>/` directory whose members must
# stay SIBLINGS: `verus` execs `rust_verify` and `z3` beside it and reads
# `verus-root` / `.vstd-fingerprint` / `libvstd.rlib` there. So the install step
# moves that whole directory into place AS `bin/`, rather than picking four
# binaries out of it — and moves the DIRECTORY, not `dir/*`, because a glob
# drops `.vstd-fingerprint` and verus then rebuilds vstd on every invocation.
#
# What is NOT expressible here, and stays in `just verification verus`: the
# rustup toolchain the release pins (a `verus --version` on a host without it
# prints `required rust toolchain <tc> not found`), and the informative degrade
# when the binary cannot run at all. Verification is gated in no CI tier, so a
# host that cannot run this tool must not have its setup fail.
#
# sha256s VERIFIED 2026-09-05 by downloading each asset and hashing it; all three
# also match GitHub's own published `digest` field for the release.
[tool.verus]
version = "0.2026.06.28.1847ab3"
smoke = [
    # Not an exit-status probe: see `[tool.arm-none-eabi-gcc]` for why that is
    # not the same question. `verus --version` prints a `Verus` banner followed
    # by `Version:`, `Profile:`, `Platform:` and the `Toolchain:` line — so this
    # fails loudly both when the dist cannot start (the glibc case above) and
    # when its pinned rust toolchain is absent.
    { run = "bin/verus --version", expect = "Verus" },
]
# The dist is a zip; `tar` cannot read one. Same declaration, same reason, as
# `[tool.ninja]`. Nothing else: the bundle's external closure is base glibc only.
system = ["unzip"]
upstream = "release/0.2026.06.28.1847ab3" # verus-lang/verus release tag (SSOT)
dist.linux-x86_64 = { url = "https://github.com/verus-lang/verus/releases/download/release/0.2026.06.28.1847ab3/verus-0.2026.06.28.1847ab3-x86-linux.zip", sha256 = "b12a622a2f44c31e72a459fc8b764e8d4bd2275e54995d21c405771b316a81e7", install = "rm -rf {prefix}/bin {prefix}/.unpack && unzip -q -o {archive} -d {prefix}/.unpack && mv {prefix}/.unpack/verus-x86-linux {prefix}/bin && rmdir {prefix}/.unpack && chmod +x {prefix}/bin/verus {prefix}/bin/cargo-verus {prefix}/bin/z3 {prefix}/bin/rust_verify" }
dist.macos-arm64 = { url = "https://github.com/verus-lang/verus/releases/download/release/0.2026.06.28.1847ab3/verus-0.2026.06.28.1847ab3-arm64-macos.zip", sha256 = "225978b94c0f75edeeee76a042bc865afe0e76e87ceb97a305ea89ab21183d98", install = "rm -rf {prefix}/bin {prefix}/.unpack && unzip -q -o {archive} -d {prefix}/.unpack && mv {prefix}/.unpack/verus-arm64-macos {prefix}/bin && rmdir {prefix}/.unpack && chmod +x {prefix}/bin/verus {prefix}/bin/cargo-verus {prefix}/bin/z3 {prefix}/bin/rust_verify" }
dist.macos-x86_64 = { url = "https://github.com/verus-lang/verus/releases/download/release/0.2026.06.28.1847ab3/verus-0.2026.06.28.1847ab3-x86-macos.zip", sha256 = "4d6b27a6e96079b56d910ec9290485467985aa9f8d68de03c5ca19a91312be75", install = "rm -rf {prefix}/bin {prefix}/.unpack && unzip -q -o {archive} -d {prefix}/.unpack && mv {prefix}/.unpack/verus-x86-macos {prefix}/bin && rmdir {prefix}/.unpack && chmod +x {prefix}/bin/verus {prefix}/bin/cargo-verus {prefix}/bin/z3 {prefix}/bin/rust_verify" }

# --- source packages (built with the app for the user's target) ---
#
# Phase 195.B — data-driven provisioning. Each source is a committed submodule,
# so `nros setup` runs `git submodule update --init <submodule>` into `dest`;
# `git`/`ref` record the canonical pin (SSOT — kept in lockstep with
# `.gitmodules` + the recorded gitlink, so the two can't drift). `dest` is
# workspace-relative — never a path baked into the `nros` binary.

[source.freertos-kernel]
version = "10.6.2"
dest = "third-party/freertos/kernel"
submodule = "third-party/freertos/kernel"

[source.lwip]
version = "2.2.0"
dest = "third-party/freertos/lwip"
submodule = "third-party/freertos/lwip"

[source.threadx]
version = "6.4.1"
# issue 0602 — this pointed at UPSTREAM (`eclipse-threadx/threadx`) at
# `4b6e8100`, while `.gitmodules` declares this fork and the superproject
# records `13d061a7`. Those two commits are parent and child, and the one
# between them is our own `fix(linux port): key LONG/ULONG and ALIGN_TYPE on the
# data model, not x86_64`.
#
# It is INERT to provisioning — `provision()` returns `Submodule` whenever
# `submodule` is set, and that arm runs `git submodule update --init` against the
# GITLINK; `git`/`ref` are read only in the Clone arm. The harm is that the entry
# is the one place stating where ThreadX comes from, and it named a push target
# we do not use: a clone whose `origin` matched it sends the vendored-fork
# workflow to upstream, which is what was observed on one machine.
dest = "third-party/threadx/kernel"
submodule = "third-party/threadx/kernel"

[source.zenoh-pico]
version = "1.7.2"
dest = "packages/rmw/zenoh/zpico-sys/zenoh-pico"
submodule = "packages/rmw/zenoh/zpico-sys/zenoh-pico"

# NuttX Rust libc fork — the qemu-arm-nuttx examples path-dep it via their
# .cargo/config (`libc = { path = third-party/nuttx/libc }`), so it must be
# provisioned by `nros setup qemu-arm-nuttx`, not hand-checked-out by the user.
[source.nuttx-libc]
version = "0.2-nuttx"
dest = "third-party/nuttx/libc"
submodule = "third-party/nuttx/libc"

# px4-rs Rust bindings fork. The px4 examples path-dep its crates, AND the root
# workspace lists `packages/testing/nros-tests` which path-deps px4-sitl-tests
# here — so cargo can't even *load* the workspace without it. Provisioned by
# `nros setup --source px4-rs`, never hand-checked-out. Non-recursive: this is
# the bindings tree only, not the giant PX4-Autopilot submodule.
[source.px4-rs]
version = "0.1.0"
dest = "third-party/px4/px4-rs"
submodule = "third-party/px4/px4-rs"

# CycloneDDS fork as an in-tree *source* (the submodule the Zephyr build patches
# in place) — distinct from `[tool.cyclonedds]` (the prebuilt/host-built ddsc the
# native+host RMW links). Same fork pin. Named `cyclonedds-src` so board/rmw
# package refs to `cyclonedds` keep resolving unambiguously to the tool.
# Provisioned by `nros setup --source cyclonedds-src`.
[source.cyclonedds-src]
version = "0.10.5-nros1"
dest = "third-party/dds/cyclonedds"
submodule = "third-party/dds/cyclonedds"

# Phase 197.2/197.4 — build-time source submodules, folded into the relevant
# board/rmw `packages` (approach A) so `nros setup <board>` provisions them and a
# bare-machine `nros setup <board> → build` works. The SDK index is the single
# home for every source ref (retired config/submodule-deps.toml).

# zenoh-pico TLS dep (zpico-sys C build gates on its presence).
[source.mbedtls]
version = "3.x"
dest = "packages/rmw/zenoh/zpico-sys/mbedtls"
submodule = "packages/rmw/zenoh/zpico-sys/mbedtls"

# Micro-XRCE-DDS Client + Micro-CDR — the vendored C sources nros-rmw-xrce-cffi's
# build.rs compiles (its presence gate prints `git submodule update --init …`).
[source.micro-xrce-dds-client]
version = "2.4.3-nros1"
dest = "packages/rmw/xrce/xrce-sys/micro-xrce-dds-client"
submodule = "packages/rmw/xrce/xrce-sys/micro-xrce-dds-client"

[source.micro-cdr]
version = "2.0.x"
dest = "packages/rmw/xrce/xrce-sys/micro-cdr"
submodule = "packages/rmw/xrce/xrce-sys/micro-cdr"

# NetX Duo network stack (ThreadX boards link it; virtio-net-netx CMake + the
# threadx board build.rs expect it checked out).
[source.threadx-netxduo]
version = "6.4.x"
dest = "third-party/threadx/netxduo"
submodule = "third-party/threadx/netxduo"

# NuttX kernel + apps — the qemu-arm-nuttx board build.rs / build-nuttx.sh expect
# them present (the export is built with the app, per Phase 194). The Rust libc
# fork is the separate `[source.nuttx-libc]` (it's a board package).
[source.nuttx-kernel]
version = "12.13.0"
dest = "third-party/nuttx/nuttx"
submodule = "third-party/nuttx/nuttx"

[source.nuttx-apps]
version = "12.13.0"
dest = "third-party/nuttx/nuttx-apps"
submodule = "third-party/nuttx/nuttx-apps"

# PX4-Autopilot — the heavy (>1 GB) reference tree (extended/opt-in). px4-rs (the
# bindings) is the separate `[source.px4-rs]`.
[source.px4-autopilot]
version = "1.17.0"
dest = "third-party/px4/PX4-Autopilot"
submodule = "third-party/px4/PX4-Autopilot"
# Phase 232.5 — pin the stable release tag `v1.17.0` (SHA `d6f12ad`) instead of
# the previous dev commit (`ecfe44a`, mislabeled 1.15.x, post-1.17.0-alpha1),
# which risked a silent uORB ABI drift. `v1.17.0` carries `msg/versioned/` (the
# 37 versioned core topics 232.1 enumerates) + the 6-field `orb_metadata` (232.4).
# The pin is now an advertised tag, so a shallow `git submodule update --depth 1`
# can reach it directly; nros ≥ 0.3.7 still falls back to an explicit depth-1
# fetch-by-SHA if needed. `recursive = false`: PX4's ~50 OWN sub-submodules are
# PX4's concern, pulled shallow by `just px4 setup` (`--depth 1 --recommend-shallow
# --recursive`), not nano-ros source provisioning.
shallow = true
recursive = false

# NOTE (197.4): opt-in dev/interop source repos (zenoh / rmw_zenoh / XRCE-agent
# upstreams, Tonbandgeraet tracing) are intentionally NOT modeled here yet — the
# released `nros` rejects unknown index fields/sections, so wiring opt-in
# `dev_sources` / `[reference.*]` needs an nros-cli schema change first (tracked
# in the Phase 197 workflow review). They remain plain `.gitmodules` submodules.

# --- license-gated (never hosted; instruct + nros doctor checks the env var) ---

[gated.arm-fvp]
version = "11.24"
env = "ARM_FVP_DIR"
installer = "arm-fvp-installer"

# --- RMW host packages (Phase 191.6.a): the RMW axis, orthogonal to the board.
# `nros setup <board> --rmw <name>` resolves `board.packages ∪ rmw.packages`
# (default `--rmw zenoh`). Boards list only platform/toolchain packages; the RMW
# daemon/tool lives here — no board×rmw pair enumeration. ---

[rmw.zenoh]
# Phase 197.4 (approach A) — the build-time source submodules are folded into
# `packages` so `nros setup <board>` is the complete provisioner (a bare-machine
# `nros setup <board> → build` works; build.rs gates on these). The released
# `nros` parses [rmw.*]/[board.*] with a strict schema (only `packages` +
# board descriptors), so no extra fields here.
# phase-362 — `zenohd` is gone from this list: the router comes from ROS
# (`rmw_zenoh_cpp`), which the user already has if they are talking to ROS 2,
# and which we could not provision correctly anyway. `zenoh-pico` stays — it is
# the FIRMWARE side and is genuinely ours to pin.
packages = ["zenoh-pico", "mbedtls"]

[rmw.xrce]
packages = ["xrce-agent", "micro-xrce-dds-client", "micro-cdr"]

[rmw.cyclonedds]
# phase-368 W4 — `rosidl` rides along: the cyclone type-support step
# (msg -> IDL) needs rosidl_adapter, and without a ROS install the vendored
# copy is the only source. The clean-container probe hit the "rosidl_adapter
# is not importable" error on the FIRST cyclonedds workspace build; a
# complete provisioner is the [rmw.*] contract (see rmw.zenoh's note). Its
# python deps (catkin_pkg, empy==3.3.4, lark) ride [python.*] and surface
# via `nros setup --check`.
packages = ["cyclonedds", "cyclonedds-src", "rosidl"]

# --- boards (Phase 191.1): board → required package set, the board→toolchain
# SSOT. `nros setup <board>` looks the board up here (no name guessing); an
# unknown board errors. `packages` lists [tool]/[source]/[gated] names; empty is
# valid (e.g. ESP32-C3's riscv32 toolchain is rustup-managed). `arch`/`platform`
# are descriptive. Keyed by the canonical board id (examples/<board>/ dir name
# or the board-crate name). ---

[board.native]
arch = "x86_64"
platform = "posix"
packages = [] # host daemon comes from the RMW axis (default rmw.zenoh)

[board.posix]
arch = "x86_64"
platform = "posix"
packages = [] # host daemon comes from the RMW axis (default rmw.zenoh)

[board.qemu-arm-baremetal]
arch = "cortex-m3"
platform = "bare-metal"
packages = ["arm-none-eabi-gcc", "qemu"]

[board.mps2-an385]
arch = "cortex-m3"
platform = "bare-metal"
packages = ["arm-none-eabi-gcc", "qemu"]

[board.qemu-arm-freertos]
arch = "cortex-m3"
platform = "freertos"
packages = ["arm-none-eabi-gcc", "qemu", "freertos-kernel", "lwip"]

[board.qemu-arm-nuttx]
arch = "cortex-a7"
platform = "nuttx" # NuttX kernel/apps are submodule SDKs (built with the app)
# nuttx-libc is the one source the Rust example path-deps, so `nros setup` must
# provision it. (Kernel/apps are pulled by the full west/make build, not here.)
packages = ["arm-none-eabi-gcc", "qemu", "nuttx-libc", "nuttx-kernel", "nuttx-apps"]

# 194.3c — the riscv (rv-virt) NuttX board: the 2nd-arch proof that the NuttX
# provisioning path is arch-agnostic. Same source set as qemu-arm-nuttx but the
# riscv cross-gcc; qemu already builds riscv64-softmmu (see [tool.qemu] configure
# --target-list). The rv-virt board bakes an `etc/` ROMFS at export time (the
# stock board's `RCSRCS = etc/init.d/{rc.sysinit,rcS}` → `genromfs`), so it
# needs the `genromfs` host tool — arm's config skips ROMFS and does not.
[board.qemu-riscv-nuttx]
arch = "riscv32" # rv-virt (rv32imac); riscv32imac-unknown-nuttx-elf
platform = "nuttx"
# genromfs: the rv-virt board bakes an etc/ ROMFS at export time (arm doesn't).
packages = ["riscv-none-elf-gcc", "qemu", "genromfs", "nuttx-libc", "nuttx-kernel", "nuttx-apps"]

[board.qemu-riscv64-threadx]
arch = "riscv64"
platform = "threadx"
packages = ["riscv-none-elf-gcc", "qemu", "threadx", "threadx-netxduo"]

[board.threadx-linux]
arch = "x86_64"
platform = "threadx"
# runs on the host; the zenoh daemon comes from rmw.zenoh
packages = ["threadx", "threadx-netxduo"]

[board.qemu-esp32-baremetal]
arch = "riscv32"
platform = "bare-metal"
# issue 0399 — the board compiles zpico C for riscv32imc and needs a riscv
# cross gcc. `riscv-none-elf-gcc` is the xPack multilib toolchain (rv32imc /
# ilp32 capable); declaring it here means `nros setup qemu-esp32-baremetal`
# provisions the compiler zpico-build's detection now looks for, instead of
# leaving a documented-provisioned host unable to build the example.
# issue 0486 — `espflash` joins `riscv-none-elf-gcc` for the same reason 0399
# added that one: without it a documented-provisioned host builds every ELF and
# then produces no flash image, with the lane exiting 0.
packages = ["riscv-none-elf-gcc", "espflash"]

[board.fvp-aemv8r-smp]
arch = "aarch64"
platform = "bare-metal"
packages = ["arm-fvp"]

[board.zephyr]
platform = "zephyr" # west + zephyr-sdk toolchain, provisioned outside the index
packages = []

# --- the CMAKE board vocabulary, as index keys (phase-422 W7) ---------------
#
# A board has TWO spellings in this tree and they are not the same word:
#
#   * the INDEX key — `examples/<dir>` / the board-crate name, which is what
#     `nros setup <board>` looks up (`resolve_packages`, an exact-key lookup
#     with no guessing);
#   * the CMAKE board id — `NANO_ROS_BOARD=<name>` → `cmake/board/
#     nano-ros-board-<name>.cmake`, which is what a `package.xml` deploy export
#     carries: `<nano_ros deploy="…" board="…" rmw="…"/>`.
#
# Measured 2026-09-05: the five `board=` values authored across `examples/`
# are `mps2-an385-freertos`, `nuttx-qemu-arm`, `nuttx-qemu-riscv`,
# `riscv64-qemu`, `threadx-linux`. Only the LAST was an index key — the one
# where the two vocabularies happen to agree — so `nros setup <board>` with
# the value a user READS OFF THEIR OWN `package.xml` failed for four of five,
# with "unknown board" listing names that appear nowhere in their manifest.
#
# These four are the same physical boards as their counterparts above, under
# the cmake spelling; each mirrors its counterpart's package set EXACTLY, and
# the pairing is asserted by `check-board-vocabulary`. This is a DUPLICATE,
# not an alias, because `BoardEntry` is `deny_unknown_fields` and has no alias
# key — giving the index one is a CLI schema change, which this additive step
# deliberately is not. When that lands, these four collapse into `aliases =`
# on the entries above and this block goes away; until then, EDIT BOTH.

# = [board.qemu-arm-freertos] (examples/qemu-arm-freertos)
[board.mps2-an385-freertos]
arch = "cortex-m3"
platform = "freertos"
packages = ["arm-none-eabi-gcc", "qemu", "freertos-kernel", "lwip"]

# = [board.qemu-arm-nuttx] (examples/qemu-arm-nuttx)
[board.nuttx-qemu-arm]
arch = "cortex-a7"
platform = "nuttx"
packages = ["arm-none-eabi-gcc", "qemu", "nuttx-libc", "nuttx-kernel", "nuttx-apps"]

# = [board.qemu-riscv-nuttx] (examples/qemu-riscv-nuttx); genromfs because the
# rv-virt board bakes an etc/ ROMFS at export time and arm's config does not.
[board.nuttx-qemu-riscv]
arch = "riscv32"
platform = "nuttx"
packages = ["riscv-none-elf-gcc", "qemu", "genromfs", "nuttx-libc", "nuttx-kernel", "nuttx-apps"]

# = [board.qemu-riscv64-threadx] (examples/qemu-riscv64-threadx)
[board.riscv64-qemu]
arch = "riscv64"
platform = "threadx"
packages = ["riscv-none-elf-gcc", "qemu", "threadx", "threadx-netxduo"]

# NOTE (197.4 → phase-327): index sections are rejected-unknown by whatever
# `nros` parses them, so adding a section IS a CLI schema change. phase-327 W1
# (RFC-0062) added [system.*]/[rust.*]/[python.*] below together with the
# in-tree CLI schema — a RELEASED pre-327 `nros` cannot parse this file
# anymore; contributors use the in-tree CLI (issue 0363 forces it fresh).


[source.rosidl]
# phase-327 / issue 0368 — rosidl_adapter for the cyclone msg->IDL step
# WITHOUT a ROS install: scripts/cyclonedds/msg_to_cyclone_idl.py resolves
# third-party/ros/rosidl/rosidl_adapter/scripts as its last ladder rung
# (env override and /opt/ros still win). Python deps ride [python.*]:
# catkin-pkg, empy (PINNED 3.3.4 — empy 4 breaks rosidl templates), lark.
version = "humble-5621b26"
git = "https://github.com/ros2/rosidl"
ref = "5621b26eff54596a356ad8abd72c06e7650d21f7"
dest = "third-party/ros/rosidl"

# --- OS packages (phase-327 W1, RFC-0062) -----------------------------------
#
# Abstract keys mapped per package manager. `nros setup --system` composes the
# detected manager's ONE install command and prints it (never runs it without
# --sudo); `nros setup --system --check` runs the probes (the doctor surface).
# Mappings verified on Ubuntu 22.04 (issue 0368's clean-host walk); dnf/pacman/
# brew mappings are best-effort and unverified — fix them as hosts appear.

[prereq.libglib2-dev]
role = "infra"
why = "qemu source builds (esp32-qemu meson configure)"
apt = ["libglib2.0-dev"]
dnf = ["glib2-devel"]
pacman = ["glib2"]
brew = ["glib"]
check = { pkg_config = "glib-2.0" }

[prereq.libpixman-dev]
role = "infra"
why = "qemu source builds (softmmu display layer)"
apt = ["libpixman-1-dev"]
dnf = ["pixman-devel"]
pacman = ["pixman"]
brew = ["pixman"]
check = { pkg_config = "pixman-1" }

[prereq.libgcrypt-dev]
role = "infra"
why = "qemu source builds (--enable-gcrypt)"
apt = ["libgcrypt20-dev"]
dnf = ["libgcrypt-devel"]
pacman = ["libgcrypt"]
brew = ["libgcrypt"]
# issue 0487 — BOTH, because the two distros ship different halves: Arch's
# libgcrypt 1.12 ships `libgcrypt.pc` and no `libgcrypt-config`; Ubuntu 22.04's
# 1.9 ships the script and no `.pc`. Probes are OR-ed.
check = { cmd = "libgcrypt-config", pkg_config = "libgcrypt" }

[prereq.ros-rmw-zenoh-cpp]
role = "package"
why = "the zenoh ROS interop lanes: the peer runs `source /opt/ros/<distro>/setup.bash && export RMW_IMPLEMENTATION=rmw_zenoh_cpp`, so the RMW must resolve in the ROS prefix. Without it those lanes report `[SKIPPED:capability]`, which reads as green rather than as absent coverage (2026-08-17: three issues closed unverifiable that way). The apt name is DISTRO-PARAMETRIC, and `{ros_distro}` is how the index says so (issue 1128): it expands from $ROS_DISTRO, defaulting to humble. Before that placeholder existed this row could only spell one distro, so it pinned humble and every consumer that cared composed `ros-${DISTRO}-...` itself — two spellings of one package, agreeing only on humble."
apt = ["ros-{ros_distro}-rmw-zenoh-cpp"]
# No dnf/pacman: ROS 2 is not packaged there, and docs/development/ros2-on-non-ubuntu.md
# routes those hosts through an Ubuntu distrobox, whose setup script installs this.
#
# No `check` probe: the artifact is the `rmw_zenohd` binary inside the
# `rmw_zenoh_cpp` package's lib dir — a file under a prefix that is not on
# PATH, and whose `.so` is not on the
# ldconfig path until ROS is sourced — so none of cmd/sharedlib/pkg_config/header
# answers honestly here. Reported as `unprobed`, which is the truthful answer;
# `just doctor` does the real check against $ROS_DISTRO.

[prereq.doxygen]
role = "workspace"
why = "C API reference docs (just docs-c; found undeclared by check-sysdep-remedies)"
apt = ["doxygen"]
dnf = ["doxygen"]
pacman = ["doxygen"]
brew = ["doxygen"]
check = { cmd = "doxygen" }

# Doxygen's call/collaboration diagrams are drawn by graphviz's `dot`, so a
# doxygen without it silently produces a docs build with no diagrams — a
# DEGRADED result, not an error, which is why it went undeclared while
# `.github/workflows/docs.yml` installed the two together in one apt line. The
# workflow was the only place that knew they belong together.
[prereq.graphviz]
role = "workspace"
why = "doxygen's diagrams (HAVE_DOT); without it the C API docs build with no graphs and say nothing about it"
apt = ["graphviz"]
dnf = ["graphviz"]
pacman = ["graphviz"]
brew = ["graphviz"]
check = { cmd = "dot" }

[prereq.gcc-arm-none-eabi]
role = "infra"
why = "ARM bare-metal cross gcc via the apt path (the [tool.arm-none-eabi-gcc] dist is the store alternative)"
# The LIBC is a separate package on Debian and was missing here, so the apt path
# produced a compiler that could build freestanding code and nothing that
# includes a standard header. Two gates paid for it: `check-sched-dim-arms`
# (freertos) failed a merge group on `string.h: No such file or directory`,
# while `cross_libc_precedence_gate` SKIPPED with "no usable libstdc++" — one
# absent package, one hard red and one silent coverage hole. The `[tool.*] dist`
# alternative never had this problem: ARM's own release ships newlib with it.
#
# Note the asymmetry that hid it: the RISC-V row already carried
# `picolibc-riscv64-unknown-elf`, so only the ARM side was half-declared.
apt = ["gcc-arm-none-eabi", "libnewlib-arm-none-eabi", "libstdc++-arm-none-eabi-newlib"]
dnf = ["arm-none-eabi-gcc-cs", "arm-none-eabi-newlib"]
pacman = ["arm-none-eabi-gcc", "arm-none-eabi-newlib"]
brew = ["arm-none-eabi-gcc"]
# KNOWN LIMITATION, stated rather than papered over: this is a PRESENCE probe
# and cannot see a half-installed toolchain. `cmd` returns Present the moment
# the binary exists, which is exactly what it did while `string.h` was absent —
# so the check said yes and the failure surfaced later, in an unrelated gate, as
# a missing header.
#
# `CheckProbe` supports `cmd` and `sharedlib` only, and is
# `#[serde(deny_unknown_fields)]`, so a `compiles = "..."` probe cannot simply
# be written here — adding one means teaching the CLI first. Until then the apt
# list above is what makes the toolchain complete, and this probe answers a
# narrower question than its name suggests.
check = { cmd = "arm-none-eabi-gcc" }

[prereq.cmake]
role = "package"
why = "every C/C++ configure step"
apt = ["cmake"]
dnf = ["cmake"]
pacman = ["cmake"]
brew = ["cmake"]
check = { cmd = "cmake" }

[prereq.unzip]
role = "workspace"
why = "unpacks the upstream ninja and verus release zips ([tool.ninja] / [tool.verus] dist install steps); tar cannot read a zip"
apt = ["unzip"]
dnf = ["unzip"]
pacman = ["unzip"]
brew = ["unzip"]
check = { cmd = "unzip" }

[prereq.curl]
role = "workspace"
why = "every dist download and the [tool.make] source tarball fetch shell out to it"
apt = ["curl"]
dnf = ["curl"]
pacman = ["curl"]
brew = ["curl"]
check = { cmd = "curl" }

[prereq.ninja]
role = "workspace"
why = "the generator every cmake configure emits for; >=1.13 also speaks the make-4.4 fifo jobserver protocol, so a nested build shares one token budget instead of taking nproc of its own"
# Same chain as `[prereq.openocd]`: a system copy is fine WHEN new enough.
# Ubuntu 22.04 ships 1.10.1 and Ubuntu 24.04 1.11.1, both below the jobserver
# floor, so on those distros this falls through to the store.
providers = ["system", "sdk"]
source = "ninja"
apt = ["ninja-build"]
dnf = ["ninja-build"]
pacman = ["ninja"]
brew = ["ninja"]
check = { cmd = "ninja", version = { run = "ninja --version", min = "1.13" } }

# make — the jobserver SERVER half, and the only half that hands out tokens.
#
# NOT `providers = ["system", "sdk"]` like ninja above, because there is no
# `[tool.make]` to fall through TO yet. `ToolSource` is git-only, and GNU
# make's git tree ships no `configure` — only `bootstrap`, which wants
# autoconf/automake/gettext and pulls gnulib. The repo already solved this the
# other way: the retired `just workspace install-make` built 4.4.1 from the RELEASE
# TARBALL into `third-party/make/`, carrying two hard-won details (`--without-guile`,
# and bootstrapping with a make that is not the one being replaced).
#
# So this entry is deliberately DIAGNOSIS ONLY: it makes `just doctor` say that
# the system make is too old for `--jobserver-style=fifo`, instead of leaving a
# silently-unbounded build. Provisioning it through `nros setup` needs tarball
# support in `[tool.*.source]` (`url` + `sha256` beside `git` + `ref`); adding a
# SECOND make provisioning path before then would be the drift this repo keeps
# paying for.
[prereq.make]
role = "workspace"
why = "GNU make >=4.4 serves `--jobserver-style=fifo`, the only jobserver flavour ninja 1.13 can join; 4.3 and older serve a pipe-fd jobserver that ninja ignores. install with `nros setup --tool make`"
apt = ["make"]
dnf = ["make"]
pacman = ["make"]
brew = ["make"]
check = { cmd = "make", version = { run = "make --version", min = "4.4" } }

[prereq.genromfs]
role = "infra"
why = "NuttX riscv rv-virt etc/ ROMFS image (the [tool.genromfs] source recipe is the store alternative)"
apt = ["genromfs"]
pacman = ["genromfs"]
check = { cmd = "genromfs" }

[prereq.socat]
role = "workspace"
why = "test-harness serial/TCP relays"
apt = ["socat"]
dnf = ["socat"]
pacman = ["socat"]
brew = ["socat"]
check = { cmd = "socat" }

[prereq.zstd]
role = "workspace"
why = "tar decompresses the prebuilt `.tar.zst` SDK dists via the external zstd binary (issue 0385; stock Ubuntu 22.04 ships no zstd)"
apt = ["zstd"]
dnf = ["zstd"]
pacman = ["zstd"]
brew = ["zstd"]
check = { cmd = "zstd" }

[prereq.libmbedtls]
role = "package"
why = "zenoh-pico TLS link (zpico-sys)"
apt = ["libmbedtls-dev"]
dnf = ["mbedtls-devel"]
pacman = ["mbedtls"]
brew = ["mbedtls"]
# issue 0603 — HEADER, not sharedlib. The consumer compiles
# `zenoh-pico/system/link/tls.c` against `mbedtls/entropy.h`; the runtime
# package `libmbedtls14` ships `libmbedtls.so.14`, which a prefix-matching
# `sharedlib = "libmbedtls.so"` accepted. So this gate said "present" on a host
# with no headers and `lane=tier2` died twenty minutes in, after building six
# embedded families. Same string `nros-zpico-build/src/runner.rs` checks before
# it fabricates the .pc files, so the gate and the build ask one question.
check = { header = "mbedtls/entropy.h" }

[prereq.clang]
role = "package"
why = "bindgen + C toolchain probes"
apt = ["clang"]
dnf = ["clang"]
pacman = ["clang"]
brew = ["llvm"]
check = { cmd = "clang" }

[prereq.libclang-dev]
role = "package"
why = "bindgen (z3-sys via ros-launch-manifest-check -> nros-launch-resolve build; issue 0368 F5)"
apt = ["libclang-dev"]
dnf = ["clang-devel"]
pacman = ["clang"]
brew = ["llvm"]
# issue 0603 swept the `-dev`-package-with-sharedlib-probe shape and DELIBERATELY
# left this one. bindgen `dlopen`s libclang at run time — it wants the LIBRARY,
# not `/usr/include/clang-c`. And the versioned dev packages (`libclang-14-dev`)
# install their headers under `/usr/lib/llvm-14/include`, so a `header` probe
# would report MISSING on a host that has the thing and works. Loadable is the
# right question here; the prefix match is deliberate too (libclang-14.so.1).
check = { sharedlib = "libclang" }

[prereq.libz3]
role = "package"
why = "ros-launch-manifest-check (z3) -> nros-launch-resolve build (issue 0368 F5)"
apt = ["libz3-dev"]
dnf = ["z3-devel"]
pacman = ["z3"]
brew = ["z3"]
# issue 0603 — same latent defect as libmbedtls, caught by the sweep rather than
# by a failure: `libz3.so` prefix-matches the runtime `libz3.so.4`, so a host
# with only `libz3-4` would read as present and z3-sys would then fail to find
# `z3.h`. Unlike libclang this dev package is unversioned and does install into
# `/usr/include`, so the header is the honest test.
check = { header = "z3.h" }

[prereq.python3-dev]
role = "package"
