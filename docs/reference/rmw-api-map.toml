# nano-ros RMW <-> ROS 2 rmw — the authored map.
#
# ONE source for two consumers: `scripts/rmw-api-parity.py` (the gate that
# fails on an unclassified contract symbol) and
# `scripts/gen-rmw-api-comparison.py` (the document). They read this file
# rather than each carrying a copy, because two copies of a map is how the
# prose ends up describing a tree that moved (phase-379 W3 claimed a missing
# shutdown hook months after it shipped).
#
# where:
#   vtable   — a slot in `nros_rmw_vtable_t`; per-backend
#   global   — a plain exported ABI function, defined ONCE, not per-backend
#   layer    — the capability ships, but somewhere other than the RMW seam
#   declined — deliberately absent, and `reason` says what constraint decided it
#
# status: what we DID about the symbol. `where` answers "which surface", which
# is a different question and was quietly doing both jobs — `declined` covered
# `rmw_wait` (decomposed into five live slots) and `rmw_init_publisher_allocation`
# (nothing crosses the seam) alike, and an INERT slot counted as answered.
#   same            — identical signature and name. Derived, never authored.
#   re-shaped       — one slot, one upstream symbol, different signature. Derived.
#   re-mapped       — the capability is answered, but NOT 1:1: decomposed, merged,
#                     or outside the RMW seam. `answers` names what provides it.
#                     Derived when several upstream symbols share one slot;
#                     authored otherwise, because prose is not queryable.
#   not-supported   — a DECISION, permanent, `reason` says which constraint made it.
#   not-implemented — a GAP, expected to close. MUST carry `issue`; the gate
#                     rejects it otherwise, so silence cannot turn a gap into a
#                     decision.

