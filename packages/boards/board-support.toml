# Board support registry — phase-320 W2.
#
# ONE table listing every board package, its support tier, and its maintainers.
# This is the SSoT the book's supported-boards table is generated from and the
# `check-board-tiers` gate validates against evidence.
#
# Why a single registry instead of a `tier` field in each `nros-board.toml`:
# only 12 of the 27 board directories have a descriptor at all, so a per-crate
# field could not cover the set — and the completeness check (every board is
# listed exactly once) is the whole point. This mirrors Rust's platform-support
# table rather than its per-target spec files.
#
# Why not tier DIRECTORIES: tier is metadata, not layout. Rust keeps target
# specs flat and the tier in target metadata precisely so a promotion is a
# one-line edit rather than a path change rippling through ~200 references.
#
# ---------------------------------------------------------------------------
# TIERS — each is a promise, and each is mechanically checkable.
#
#   1  Supported   `just ci` exercises it, it has asserted runtime coverage,
#                  and a nightly lane builds it. A regression fails before
#                  merge.
#   2  Verified    Asserted runtime coverage + a nightly lane, but not in
#                  `just ci`. Breakage is found within a day.
#   3  Build-only  Compiles; NO CI lane can boot it (hardware or a
#                  license-gated model is required). Nobody has booted it
#                  recently unless a maintainer did so by hand.
#   scaffold       Structurally incomplete. Explicitly NOT supported. Distinct
#                  from tier 3: tier 3 is finished-but-unverified, scaffold is
#                  unfinished. `embassy-stm32f4` is why this state existed — it
#                  was actively committed to, which reads as support unless the
#                  registry says otherwise. phase-337 W7 answered the state's
#                  own question: a scaffold nobody finishes is a delete, and
#                  every scaffold row left the tree with its crate.
#   infra          Not a board: shared traits, family drivers, ABI mirrors,
#                  PACs. Carries no platform and no tier promise.
#
# Gate predicates (scripts/check-board-tiers.py):
#   - tier 1|2  => the platform has >=1 `Runtime` cell in matrix.rs
#   - tier 3    => the platform has ZERO Runtime cells (build-only means it)
#   - scaffold  => zero Runtime cells AND zero fixture rows
#   - tier 1    => a nightly lane covers it (or it is the native host, which
#                  `just ci` runs directly — stronger than a nightly build)
#   - every board directory appears exactly once; every entry names a real one
#   - tier 1 => >=3 named maintainers, tier 2 => >=2, tier 3 => >=1 (phase-375
#     W1), with rows that predate the rule grandfathered by
#     scripts/board-maintainer-baseline.json — a list that only shrinks
#
# `maintainers` is ENFORCED since phase-375 W1 — see the note at the bottom.
# ---------------------------------------------------------------------------

# ===== tier 1 — supported ==================================================

[[board]]
crate = "nros-board-linux"
matrix_platform = "Linux"
tier = 1
execution_class = "host-executable"
maintainers = []
notes = "The reference platform: the densest Runtime coverage of any target, all three RMWs. phase-337 W8.a merged the `native` shim and the `posix` family driver into this one crate — the registry carried TWO rows for one implementation because `board_path_for` mapped both keys to the same ZST."

[[board]]
crate = "nros-board-zephyr"
matrix_platform = "ZephyrNativeSim"
nightly_token = "zephyr"
tier = 1
execution_class = "host-executable"
maintainers = []
notes = "CAVEAT: only ever built for native_sim/native/64. No real Zephyr hardware board is built by anything."

# phase-385 — QEMU MPS3-AN536, dual Cortex-R52 FreeRTOS: the emulated
# counterpart to `s32z270-freertos` (same CPU, same kernel port, same toolchain
# file) and the first place the ARMv8-R half of the FreeRTOS platform has ever
# run, since no emulator models the S32Z270 RTU (issue 0772).
#
# `scaffold`, and deliberately so: the board builds, boots and delivers Cyclone
# pub/sub, but it has no `PlatformId` variant, so NOTHING in the runtime matrix
# runs it. Phase-385 W4 defers that cell explicitly — "a new `MP::` platform
# variant [with] ~67 references across platform.rs, matrix.rs, lane_scope.rs
# and several test files, each with its own gate ... is its own commit, not a
# tail end of this one".
#
# So `matrix_platform` is ABSENT rather than borrowed from a sibling. That is
# what makes this row honest: scaffold promises nothing and owes no
# maintainers, which is exactly the board's state. Its two `fixtures.toml` rows
# build under `platform = "freertos"` with `NANO_ROS_BOARD`, so they are
# attributed to the existing platform and are not a runtime witness for this
# board. Give it a tier when W4 lands the cell, not before — a tier that is
# merely asserted is the drift this gate exists to catch.
[[board]]
crate = "nros-board-mps3-an536-freertos"
nightly_token = "freertos"
tier = "scaffold"
maintainers = []

[[board]]
crate = "nros-board-mps2-an385-freertos"
matrix_platform = "FreertosMps2"
nightly_token = "freertos"
link_check_example = "examples/qemu-arm-freertos/rust/talker"
tier = 2
execution_class = "cross-run"
maintainers = []

# phase-372 W2 — hardware-only board: no emulator models the S32Z270 RTU, so
# CI evidence is limited to the cross link-completeness the workspace lane
# proves; runtime evidence is the ASI reference consumer's board (the same
# real-downstream rationale as the Fvp row above). The NXP-licensed pieces
# (kernel GIC port, RTD NETC driver, PBcfg) are consumer-provisioned seams —
# see the bundle's nros-board.toml.
[[board]]
crate = "nros-board-s32z270-freertos"
# NO matrix_platform, deliberately. It read `FreertosMps2` "until a hardware
# witness exists" — reusing the family lane's PlatformId — and that is the
# declaration check-board-tiers exists to reject: FreertosMps2 HAS Runtime
# cells (RealtimeTiers, TierPriority C/C++), so a tier-3 row pointing at it
# claims build-only support from a platform whose cells assert running code.
# The cells are MPS2-AN385's; this board is a Cortex-R52 automotive part with
# no emulator here, and the two share only a kernel. That mismatch is the exact
# defect phase-320 W1.a fixed for FVP, one family over.
#
# The key is optional for tier 3 (only tiers 1 and 2 must name a platform), and
# a row without one is skipped by check-flavour-lanes and renders "—" in the
# support table — which is the honest answer: no matrix platform witnesses this
# board yet. Give it a real PlatformId when it gets a witness, not the
# neighbour's.
tier = 3
execution_class = "hardware"
maintainers = []
notes = "S32Z270 RTU Cortex-R52 (ASI phase-4 W5.b consumer). No matrix_platform: no witness exists for this board, and borrowing FreertosMps2's would claim its Runtime cells. Link-completeness is proven by the workspace cmake lane with the CRx_No_GIC default port."

# phase-337 W3.d — ONE crate, TWO witnesses, TWO tiers. This row and the
# `NuttxRiscv` row below are the reason W1.c re-keyed the registry by
# (crate, matrix_platform): tier is a per-witness promise ("`just ci` exercises
# it" is true of arm and false of rv-virt), so they cannot share a row.
[[board]]
crate = "nros-board-nuttx-qemu"
matrix_platform = "NuttxArm"
nightly_token = "nuttx"
link_check_example = "examples/qemu-arm-nuttx/rust/talker"
tier = 2
execution_class = "cross-run"
maintainers = []

[[board]]
crate = "nros-board-threadx-linux"
matrix_platform = "ThreadxLinux"
nightly_token = "threadx_linux"
link_check_example = "examples/threadx-linux/rust/talker"
tier = 1
execution_class = "host-executable"
maintainers = []

# phase-370 — the FreeRTOS POSIX simulator. Descriptor-only (no Rust board
# crate): the cells are C and C++, since the POSIX port has no Rust entry shape
# of its own. This is the freertos family's first lane that runs without QEMU.
[[board]]
crate = "nros-board-freertos-posix"
matrix_platform = "FreertosPosix"
nightly_token = "freertos_posix"
tier = 2
execution_class = "host-executable"
maintainers = []

# ===== tier 2 — verified ===================================================

[[board]]
crate = "nros-board-threadx-qemu-riscv64"
matrix_platform = "ThreadxRiscv64"
nightly_token = "threadx_riscv64"
tier = 2
execution_class = "cross-run"
maintainers = []
notes = "All three Action rows are BuildOnly by a deliberate wall-clock choice (182.5), not by breakage."

[[board]]
crate = "nros-board-mps2-an385"
matrix_platform = "QemuBaremetal"
nightly_token = "qemu"
tier = 2
execution_class = "cross-run"
maintainers = []
notes = "phase-337 W6.a folded `nros-board-rtic-mps2-an385` in as the `rtic` feature — one crate, two entry shapes (direct-exec + RTIC), one witness row."

# phase-337 W2 — the SECOND row for `nros-board-zephyr`, and the reason W1.c
# re-keyed this registry by (crate, matrix_platform): one crate, two witnesses,
# two different promises. The tier-1 row above is native_sim; this one is a real
# 32-bit Cortex-M3 running Zephyr's OWN IP stack over `eth_smsc911x`. There is NO
# board crate — the board is `cmake/zephyr/mps2-an385.conf`, which is RFC-0064's
# whole thesis working as intended.
[[board]]
crate = "nros-board-zephyr"
matrix_platform = "ZephyrQemuCortexM"
nightly_token = "zephyr"
tier = 2
execution_class = "cross-run"
maintainers = []
notes = "C and C++ pubsub are Runtime; service/action are BuildOnly pending the runner's peer half. NO RUST ROW: `zephyr-lang-rust` cannot compile for any board whose devicetree has gpio nodes (issue 0432), so a rust cell would not build and BuildOnly would be a lie. Tier 2 rather than 1 because `just ci` is host-only and this needs QEMU."

[[board]]
crate = "nros-board-esp32-qemu"
matrix_platform = "Esp32Qemu"
nightly_token = "esp32"
tier = 2
execution_class = "cross-run"
maintainers = []
notes = "Real two-way QEMU e2e (esp32_emulator.rs)."

[[board]]
crate = "nros-board-nuttx-qemu"
matrix_platform = "NuttxRiscv"
nightly_token = "nuttx"
tier = 2
execution_class = "cross-run"
maintainers = []
notes = "HONEST LABEL: C runtime-proven; Rust and C++ Pubsub are explicit CarveOuts and every EntryPubsub row is BuildOnly."

# ===== tier 3 — build-only =================================================

[[board]]
crate = "nros-board-zephyr"
matrix_platform = "Fvp"
sdk = "arm-fvp"  # `[tool.arm-fvp]` since 2026-09-06 — fetched, not gated
tier = 3
execution_class = "hardware"
maintainers = []
notes = "Runtime is maintainer-run via `just zephyr verify-fvp-runtime` — hence `execution_class = \"hardware\"`, which is what exempts this row from phase-375 W4's smoke floor. The model is NOT licence-gated (that claim stood here until 2026-09-06 and was wrong): `nros setup --tool arm-fvp` fetches it from a pinned Arm CDN permalink, and the board-import fixture was verified booting on it (`nros: smoke ok`) the same day. What still keeps CI out is cost and x86_64-only hosting, not permission. Kept in-tree: it is the ASI reference consumer's target (phase-292), a real downstream user the CI evidence cannot see. phase-337 W9.a folded the `nros-board-fvp-aemv8r-smp` CRATE into `nros-board-zephyr/boards/fvp-aemv8r-smp/` — the crate's Rust half (a `Config` and a `run` loop) had zero consumers, so what it actually shipped was a prj.conf, a DTS overlay and a board.cmake: a config bundle wearing a Cargo.toml. Third row for this crate, which is exactly what W1.c's (crate, matrix_platform) keying is for."

# ===== scaffold — explicitly not supported =================================
#
# EMPTY since phase-337 W7.b. The four boards that lived here
# (`embassy-stm32f4`, `esp32s3`, `s32z270dc2-r52`, `orin-spe`) contributed zero
# cells of any tier, so deleting them cost no coverage. The STATE stays declared
# above: it is what stops the next unfinished board from reading as support.

# phase-375 W6 — DECLARED at last. Both boards were already built and tested by
# this tree while appearing in no registry, no descriptor and no announcement:
# `examples/fixtures.toml` named them as raw Zephyr id STRINGS, which is a
# fourth way to add a board and the one with no record at all.
#
# `tier = "scaffold"` is the honest entry, and deliberately NOT a promotion.
# These rows are new; a tier with a promise needs a named maintainer (W1: 1/2/3
# for tiers 3/2/1) and neither has one. What changed today is that they are
# VISIBLE — a board nobody declared cannot be given a tier, an owner, or a
# demotion, which is what made the fourth route worse than any of the other
# three.
[[board]]
crate = "nros-board-qemu-cortex-a53"
tier = "scaffold"
maintainers = []

[[board]]
crate = "nros-board-mps2-an385-zephyr"
tier = "scaffold"
maintainers = []

# ===== infra — not boards ==================================================

[[board]]
crate = "nros-board-common"
tier = "infra"
maintainers = []
notes = "Build-helper library plus one trait; 2180 of 2252 code lines are behind `build-helpers`."

[[board]]
crate = "nros-board-cffi"
tier = "infra"
maintainers = []
notes = "Header ABI mirror with ZERO in-tree C consumers; kept alive by its own drift gate. Spec artifact, not a library."

[[board]]
crate = "nros-board-freertos"
tier = "infra"
maintainers = []
notes = "Real family driver: the MPS2 overlay is `pub use nros_board_freertos::Config` and carries zero config code. The pattern the forked boards should copy."

[[board]]
crate = "nros-board-nuttx"
tier = "infra"
maintainers = []
notes = "NuttX FAMILY DRIVER, not a façade: owns run_entry / run_tiers / the tier spin loops, which the one board overlay (nros-board-nuttx-qemu) delegates to. phase-337 W3 merged the two board crates below it; this layer stays."

[[board]]
crate = "nros-board-threadx"
tier = "infra"
maintainers = []
notes = "Real family driver: a 1120-line generic entry.py both ThreadX boards call into."

[[board]]
crate = "nros-board-threadx-port-riscv64"
tier = "infra"
maintainers = []
notes = "NOT a board: RFC-0064 layer 2, the ThreadX RISC-V64/GNU ARCH PORT. Upstream types ULONG as 8 bytes there; NetX Duo's packet code does `ULONG *` arithmetic assuming 4, and retyping it shifts every TX_THREAD offset the context-switch assembly loads — so the fork is a header plus five `.S` files, and it is arch, not board. Extracted from nros-board-threadx-qemu-riscv64 by phase-337 W4.a; a second riscv64 ThreadX board would need every line of it unchanged. threadx-linux has none because upstream's Linux port already types ULONG as 4 bytes — which is why the two ThreadX boards did NOT merge."

[[board]]
crate = "mps2-an385-pac"
tier = "infra"
maintainers = []
notes = "IRQ enum only. Kept because RTIC's `#[rtic::app(device = ...)]` needs a nameable path."

