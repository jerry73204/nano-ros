[package]
name = "nros-board-linux"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The Linux host board — the POSIX family driver plus the RMW selection point (phase-337 W8.a merged `nros-board-native` in)."
publish = false

# Host-only crate. A hosted Unix target lives under `std`, so no
# `no_std` attribute and no per-target gating on `target_os` — the
# whole point of this crate is to be the family driver for hosted
# Unix targets. Its REACH is `linux`, not `posix`: `apply_tier_affinity`
# calls `sched_setaffinity` with `cpu_set_t` / `CPU_SET`, which libc does
# not define for apple, so this crate does not build on macOS.

# issue 0287 — HOST-ONLY. `just check workspace-embedded` builds the whole
# workspace for a thumb target, and cargo unifies features across ALL members
# regardless of what firmware can reach. A host-only member therefore turns
# `std` on for everything and the lane dies in an unrelated crate
# (`can't find crate for \`std\`` in nros-serdes). Declared here rather than
# hand-listed in the justfile so the reason lives with the crate and the
# exclude list is derived — see scripts/build/host-only-members.sh.
[package.metadata.nros]
host-only = true
host-only-reason = "the Linux host board"

[dependencies]
# Phase 214.F.1 (Path B) — every dep this crate needs activates
# `nros/std` or `nros/platform-posix` on a shared workspace crate
# (nros-serdes, nros-core, nros-platform). Under workspace feature
# unification (resolver=2) those activations leak into embedded
# targets, even though this crate is host-only and cargo skips
# compiling it under `target_os = "none"`. Gating the entire
# `[dependencies]` block on `cfg(not(target_os = "none"))` removes
# the leak: under thumb/riscv-none the crate appears dep-less,
# so its feature flags drop out of the unified set.
[target.'cfg(not(target_os = "none"))'.dependencies]
# Trait surface (BoardEntry, BoardInit, BoardPrint, BoardExit, RuntimeCtx).
# Phase 248 C5c-platform (#60 T3, RFC-0031 platform amendment) — the POSIX
# family driver now brings the concrete `platform-posix` impl DIRECTLY (pulls
# `nros-platform-cffi` + the `posix-c-port` link directive + emits the
# `__FORCE_LINK_CFFI` anchor that keeps `libnros_platform_posix.a` in the link).
# This is the board-driven platform-selection point, mirroring C5a's RMW gate:
# the umbrella `nros` dep below stays platform-agnostic (no `platform-posix`).
nros-platform = { version = "0.5.0", path = "../../platform/nros-platform", default-features = false, features = ["platform-posix"] }
# issue 0710 — the platform-ABI log sink moved to `nros_platform_cffi::log`, so
# the boot funnel that installs it names the crate that owns the ABI. The
# umbrella above already PULLS this crate (see the note); naming it directly is
# what lets this board's `run`/`run_tiers` call `log::init_default()`.
nros-platform-cffi = { version = "0.5.0", path = "../../platform/nros-platform-cffi", features = ["posix-c-port"] }
# Phase 212.N.7 step-3.5 — Executor + ExecutorComponentRuntime so
# `BoardEntry::run` installs a live component runtime sink on the
# `RuntimeCtx` before invoking the user `setup` closure. `rmw-cffi`
# pulls the RMW backend registry; the actual RMW backend crate
# (`nros-rmw-zenoh`, `nros-rmw-cyclonedds`, ...) must be linked by
# the Entry pkg or a per-board shim crate so `Executor::open`
# resolves a backend at boot.
# phase-359 W10 — the `env` CAPABILITY, not the `std` flavour. This board is the
# hosted one, so it is the layer that legitimately has a process environment;
# `env` is what `ExecutorConfig::from_env` needs and nothing else here does.
#
# `std` is named explicitly because `env` requires it and does not grant it:
# `from_env` reads the process environment. Naming it changes nothing about what links
# — it linked before too — it only stops the standard library arriving in a
# build that never asked for it (ARCHITECTURE §2, clause (a)).
nros = { version = "0.5.0", path = "../../api/nros", default-features = false, features = ["alloc", "std", "env", "rmw-cffi", "macros"] }
# Phase 264 W3 — the family driver inits the default log sink at boot so a Node
# pkg's `log_info!` reaches stdout/stderr without per-app `nros_log::init`
# (board-agnostic Node pkgs can't pick the sink). Host → the platform sink.
# issue 0710 follow-up — a board IS the platform console, so it turns on the
# dispatch auto-install. Cargo unifies the feature into any image holding this
# crate; consumers with no port (host tools, the test harness) never get the
# link requirement. Gated by `check-board-log-sink.py`.
nros-log = { version = "0.5.0", path = "../../core/nros-log", default-features = false, features = ["alloc"] }
# phase-338 W3 — the `log` facade's host sink. nano-ros has TWO logging stacks
# split by board: posix + mps2-baremetal init `nros_log`, while freertos, nuttx
# and threadx bridge `log`. The node bodies inherited that split, so a Node pkg
# written against `log::info!` (what four of the five scheduled-platform copies
# use) compiled on native, ran, and printed NOTHING. Bridging `log` here lets
# ONE node body work on every board. Unifying the two stacks is phase-338 W7.
log = { version = "0.4", default-features = false }
# phase-296 W5.13 — host `sched_setaffinity` for the placement dim's LINUX
# `Native` realization (the first RUNTIME accept-arm proof of a core pin, issue
# #260). LINUX, not POSIX: `sched_setaffinity` / `cpu_set_t` / `CPU_SET` are
# absent from libc's apple module, and the call is not `cfg(target_os)`-gated —
# this dep is the reason the BOARD is named `linux` while the platform beneath
# it stays `posix`. Host-only; the cfg-gated dep block keeps it out of the
# embedded feature-unification set.
libc = "0.2"
# phase-337 W8.a — the RMW deps and features came from the deleted
# `nros-board-native` shim. The BOARD is the RMW selection point (Phase 248
# C5a): a declarative Entry pkg picks a backend through the board's `rmw-<x>`
# feature and the board's boot calls that backend's `register()`, so no app-side
# backend ownership is needed. These omit `linkme-register` because the explicit
# call replaces the linkme walk (Phase 249 P3.5b).
nros-rmw-zenoh = { path = "../../rmw/zenoh/nros-rmw-zenoh", features = ["platform-posix"], optional = true }
nros-rmw-xrce-cffi = { path = "../../rmw/xrce/nros-rmw-xrce-cffi", default-features = false, features = ["std"], optional = true }
nros-rmw-cyclonedds-sys = { path = "../../rmw/cyclonedds/nros-rmw-cyclonedds-sys", features = ["platform-posix"], optional = true }

[features]
# Default keeps the historic host zenoh wiring active so existing Entry pkgs /
# examples resolve a backend on first `Executor::open`. Droppable: DDS-/XRCE-only
# consumers build with `default-features = false` and select `rmw-xrce` /
# `rmw-cyclonedds`.
default = ["rmw-zenoh"]
rmw-zenoh = ["dep:nros-rmw-zenoh"]
rmw-xrce = ["dep:nros-rmw-xrce-cffi"]
rmw-cyclonedds = ["dep:nros-rmw-cyclonedds-sys"]
# Phase 252 (issue 0072) — forward a declared [safety] axis to the zenoh
# backend's safety-e2e (CRC attach/validate); `?` keeps it inert without
# rmw-zenoh. This host board validates the forwarding pattern the embedded
# boards use.
safety-e2e = ["nros-rmw-zenoh?/safety-e2e"]
