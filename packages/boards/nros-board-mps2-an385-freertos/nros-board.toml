# Phase 195.C — board profile descriptor. FreeRTOS on MPS2-AN385.

[[board]]
names = ["freertos", "freeRTOS", "FreeRTOS"]
platform = "freertos"
toolchain = "stable"
entry_kind = "board-run"
# phase-351 W4 — the stacks this board can be built with: the `config/freertos` platform manifest builds `system/freertos/lwip/network.c`.
supported_netstacks = ["lwip"]
board_crate = "nros-board-mps2-an385-freertos"
# Phase 252 (issue 0072) — forwards [safety] through the freertos family to zenoh.
cargo_config = '''
[target.thumbv7m-none-eabi]
runner = "qemu-system-arm -cpu cortex-m3 -machine mps2-an385 -nographic -semihosting-config enable=on,target=native -kernel"
rustflags = [
    "-C", "link-arg=-Tmps2_an385.ld",
    "-C", "link-arg=--nmagic",
    # phase-341 W1 — hoisted from the leaves (see nros-board-mps2-an385).
    "-C", "link-arg=--gc-sections",
]
'''

# Issue 0273 — the C startup (`c/board_mps2.c` `Reset_Handler`) jumps to the Rust
# `main` symbol (`extern int main(void)`); the pre-N.7 `_start` shape was retired
# (commit d99386173) and left `rust-lld: undefined symbol: main`. Match the C
# startup + the working fixtures (logging-smoke-freertos-mps2, threadx-qemu-riscv64):
# a `#[no_mangle] extern "C" fn main() -> !` (diverging main links against the C
# `int main(void)` decl; it never returns — the FreeRTOS scheduler owns the image).
[board.entry]
crate_root_extra = "use panic_semihosting as _;"
# The dependency the line above needs. A generated entry has no author to
# supply it, so it travels with the item (phase-383 W9.b).
crate_root_deps = ["panic-semihosting = \"0.6\""]

# RFC-0042 D2 / phase-241 wave C — declared capabilities (SSoT). FreeRTOS heap is
# gated by `configSUPPORT_DYNAMIC_ALLOCATION` (FreeRTOSConfig.h); declared true.
[board.capabilities]
heap = true
atomics = true
threads = true

# RFC-0048 §6 / phase-287 W5 — CMake toolchain file for `nros setup`'s preset.
[board.cmake]
toolchain_file = "cmake/toolchain/arm-freertos-armcm3.cmake"

# RFC-0079 — the PORT's priority address plan.
#
# Scheduling priority is one address space shared by application tiers and
# system tasks. Before this, tiers were hand-pinned into it with no record of
# what was already there — the DHCP/static-IP collision RFC-0079 describes,
# measured at 34 of 38 pins in the tree colliding, preempting, or unverifiable.
#
# Every number here is READ FROM the port, not chosen here, and
# `check-tier-priority-plan` cross-references them: a plan free to drift from
# the code it describes would be a second spelling of the same fact.
[board.priority_plan]
direction = "bigger-is-urgent"
# configMAX_PRIORITIES = 8 (nros-board-freertos/config/FreeRTOSConfig.h), so the
# usable band is 0..7 and 0 is the idle task's.
range = [1, 7]
# zenoh-pico's read and lease tasks plus the lwIP netif poll task, all three at
# 4 (nros-board-common/src/freertos_config.rs, FreertosScheduling::default).
# They persist for the life of the image, which is what makes them RESERVED.
reserved.transport = [4, 4]
# What tiers may be allocated. Deliberately BELOW the transport band: a tier
# that outranks the link cannot be drained or refilled by it (issue 0623, then
# measured again in 0736).
pool.app = [1, 3]
# NOT reserved, and worth saying so because the first draft of the collision
# report got it wrong: `app_priority = 3` is the priority app_task is CREATED
# at, and `run_tiers` immediately replaces it with the boot tier's own
# (freertos_run_tiers.c `freertos_apply_tier_priority`, entry.rs
# `nros_freertos_set_current_task_priority`). A starting value is not a
# standing occupant, so 3 belongs to the pool.
