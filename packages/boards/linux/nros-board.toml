# Board profile descriptor for the HOST target.
# Crate-less: the generated package depends on `nros-platform-cffi` (emitted by
# the CLI's per-platform extra-deps path) rather than on the board crate.
#
# THE WORDS (CLAUDE.md "Naming") answer two different questions:
#
#   native   ROLE — this is the host build, not a cross build
#   posix    REACH — works on any POSIX-compliant system
#   linux    REACH — works only on Linux
#
# So `native` sits beside either reach word; `posix` and `linux` cannot sit
# beside each other.
#
# This board's reach is `linux`, and that is MEASURED. `nros-board-linux`'s
# `apply_tier_affinity` calls `sched_setaffinity` with `cpu_set_t`/`CPU_SET`,
# ungated by `cfg(target_os)`, and libc 0.2.189 defines those for linux,
# android, freebsd, dragonfly, fuchsia and cygwin — and NOT for apple. The
# crate therefore cannot build on macOS, so `posix` was a false claim.
#
# (Strictly the reach is "Linux and some BSDs, not macOS". `linux` is the
# closest of the three available words; making `posix` true would mean
# cfg-gating the affinity call to a loud no-op off Linux, which is a product
# change nobody has asked for.)
#
# `platform = "posix"` is unchanged and correct: `nros-platform-posix` IS
# POSIX-clean — `sched_yield`, `sched_get_priority_{min,max}`,
# `pthread_setschedparam`, `SCHED_FIFO`, and its one `__linux__` selects
# `MSG_NOSIGNAL` behind a portable `#else`. The platform layer names
# software-stack facts; the board layer names what we claim to support. The
# Linux-only call lives in the BOARD crate, which is why the two layers
# legitimately carry different words.

[[board]]
names = ["native", "linux"]
platform = "posix"
toolchain = "stable"
entry_kind = "hosted-main"
# phase-351 W4 — this board makes NO netstack choice: the host kernel owns the stack. An empty
# list is a statement, not an omission: a deploy naming one is refused.
supported_netstacks = []

# RFC-0042 D2 / phase-241 wave C — declared capabilities (SSoT).
[board.capabilities]
heap = true
atomics = true
threads = true

# RFC-0079 — the PORT's priority address plan.
#
# STATIC, unlike Zephyr's: Linux's SCHED_FIFO range is fixed by POSIX
# (`sched_get_priority_min/max` report 1..99 here) rather than by a per-image
# Kconfig, so the band is a literal the checker can judge with nothing but the
# repo.
#
# The transport band sits at the TOP, and the tiers below it. That direction is
# the one thing this port could not express until issue 0765: tier priorities
# were advisory, so nothing was applied and there was no ordering to get wrong.
# Once they became real the default was the WRONG way round — a SCHED_FIFO tier
# outranks every SCHED_OTHER thread unconditionally, and zenoh-pico's read and
# lease tasks are SCHED_OTHER, so every tier preempted the link it publishes
# over with no arrangement in which it did not.
[board.priority_plan]
tier_key = "posix"
direction = "bigger-is-urgent"
# `sched_get_priority_{min,max}(SCHED_FIFO)` on glibc/Linux. Cross-checked
# against the value the board actually uses by `check-tier-priority-plan`.
range = [1, 99]
# zenoh-pico's read and lease tasks. A RANGE rather than a point because the
# two are configured separately and a future flush task joins them; the board
# places them at the floor, 90, leaving room above for anything an operator
# deliberately puts higher.
reserved.transport = [90, 99]
# What tiers may be allocated. The existing pins (10, 40, 80) already live here
# — this plan describes where they were, it does not move them.
pool.app = [1, 89]

# RFC-0079's `reserved.foreign` — threads nano-ros does not create — is EMPTY
# here, and that is a measured claim rather than an omission.
#
# `scripts/dev/priority-thread-probe.py <pid>` enumerates a live image's
# threads out of `/proc/<pid>/task/*/stat` and classifies each against this
# plan. On the native realtime entry it finds four, all ours: the boot tier on
# the main thread, `nros-tier-high`, and zenoh-pico's read and lease tasks.
# Nothing else in the process holds a real-time priority, so there is no
# foreign band to reserve.
#
# The distinction matters because on the RTOS ports there ARE foreign
# occupants (lwIP's `tcpip_thread`, NuttX work queues) whose positions those
# plans can only assert. LINUX is the one port where the claim is checkable
# today, and this is it checked — the probe reads `/proc/<pid>/task/*/stat`,
# which is Linux, not POSIX, so a macOS or BSD host could not run it either.
reserved.foreign = []
