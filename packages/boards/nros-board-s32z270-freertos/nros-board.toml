# Phase 372 W2 — board profile descriptor. FreeRTOS on NXP S32Z270 RTU
# (Cortex-R52 lock-step, the X-S32Z27X-DC automotive kit).
#
# The LICENSED pieces stay consumer-side by design (phase-372 W3):
#   * the FreeRTOS kernel + GIC port come from the NXP distribution via
#     FREERTOS_DIR / FREERTOS_PORT (this bundle defaults to the in-tree
#     kernel's GCC/ARM_CRx_No_GIC so a clean checkout LINK-COMPLETES;
#     hardware needs the NXP GCC/ARM_CR52_GIC port — WITH the consumer's
#     Thumb-resume CPSR patch, see the phase doc),
#   * the NETC ethernet driver (NXP RTD) arrives through the strong
#     `nros_board_register_netif` / `nros_board_poll_netif` overrides —
#     this bundle's weak defaults fail loud,
#   * the RTD PBcfg set (S32 Config Tools output) compiles into the
#     consumer's entry, not here.

[[board]]
names = ["s32z270-freertos", "s32z270", "S32Z270"]
platform = "freertos"
toolchain = "stable"
platform_feature = "platform-freertos"
link_kind = "none"
entry_kind = "board-run"
supported_netstacks = ["lwip"]
board_crate = "nros-board-s32z270-freertos"
cargo_config = '''
[target.armv8r-none-eabihf]
rustflags = [
    "-C", "link-arg=-Ts32z270_rtu.ld",
    "-C", "link-arg=--nmagic",
    "-C", "link-arg=--gc-sections",
]
'''

[board.entry]

[board.capabilities]
heap = true
atomics = true
threads = true

# RFC-0048 §6 — CMake toolchain file for `nros setup`'s preset.
[board.cmake]
toolchain_file = "cmake/toolchain/arm-freertos-armcr52.cmake"
