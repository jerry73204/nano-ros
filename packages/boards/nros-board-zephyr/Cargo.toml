# Phase 212.N.2 — Zephyr family driver crate.
#
# Empty `[workspace]` stub: this crate sits OUTSIDE the nano-ros
# Cargo workspace (mirrors the other wave-2 family driver crates).
# Built standalone via `cd packages/boards/nros-board-zephyr && cargo check`.
[workspace]

[package]
name = "nros-board-zephyr"
version = "0.4.0"
edition = "2024"
license = "Apache-2.0"
description = "Zephyr family driver crate for nros — link-up gate only (Zephyr owns main / BSP)."
repository = "https://github.com/NEWSLabNTU/nano-ros"
publish = false

[lib]
name = "nros_board_zephyr"

[features]
# issue #128 (half 2) — `ZephyrBoard::run_tiers` (per-tier k_thread entry).
# Off by default: link-up-gate-only consumers keep the tiny dep graph; the
# `nros::main!` Zephyr arm's multi-tier emit needs an entry crate that
# enables this on its `nros-board-zephyr` dep.
tiers = ["dep:nros", "dep:log", "dep:nros-log", "dep:nros-platform-cffi"]
# phase-296 W5.5 — gate the k_thread_deadline_set call path. On ⇒ real-time
# tiers with a deadline get kernel EDF ordering; off ⇒ executor-only
# (cooperative) deadline monitor. Must match the image's CONFIG_SCHED_DEADLINE.
zephyr-edf = []

[dependencies]
nros-platform = { path = "../../platform/nros-platform", default-features = false }
nros = { path = "../../api/nros", default-features = false, features = ["alloc", "rmw-cffi", "macros"], optional = true }
# run_tiers wires the nros_log dispatcher to the platform console at boot
# (mirrors nros-board-linux); without it a Node pkg's `log_info!` on a
# Zephyr multi-tier entry produced no output at all.
nros-log = { path = "../../core/nros-log", default-features = false, optional = true }
# issue 0710 — the platform-ABI log sink moved to `nros_platform_cffi::log`,
# so the boot funnel that installs it names the crate that owns the ABI. A
# board IS the platform edge, so this edge is where it belongs; what it
# replaces is `nros-log` declaring the extern itself and every binary that
# logged inheriting the link requirement.
# Optional to match `nros-log` above: both ride the `tiers` feature.
nros-platform-cffi = { path = "../../platform/nros-platform-cffi", optional = true }
log = { version = "0.4", optional = true }
