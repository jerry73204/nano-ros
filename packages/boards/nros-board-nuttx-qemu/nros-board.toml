# Board profile descriptors for the ONE NuttX QEMU board crate — phase-337 W3.
#
# Two WITNESSES, one crate. Both upper layers (kernel + arch port) come from
# upstream NuttX, so the in-tree crate is pure board overlay and the entire
# per-arch delta is DATA: the two `nuttx-config/<arch>/defconfig`s, the two
# `<arch>-nuttx-toolchain.cmake`s, the two FFI subcrates' `.cargo/config.toml`
# and the `cargo_config` blocks below. Nothing arch-specific lives in the Rust
# or C sources (phase-322 W1.a measured 1059 byte-identical lines across the
# two former crates).
#
# `[board.capabilities]` / `[board.cmake]` bind to the LAST `[[board]]` above
# them (TOML array-of-tables), so each witness carries its own pair — do not
# reorder them out from under their entry.

# ── arm: QEMU ARM virt (Cortex-A7 + virtio-net). Tier 1. ────────────────────
[[board]]
# phase-351 / issue 0606 — the arm witness's DOWNSTREAM ids: `nuttx-qemu-arm` (workspace deploys) and
# `qemu-armv7a-nsh` (the NuttX board config the copy-out examples name).
names = ["nuttx", "NuttX", "nuttx-qemu-arm", "qemu-armv7a-nsh"]
platform = "nuttx"
toolchain = "nightly"
platform_feature = "platform-nuttx"
link_kind = "nuttx-staging"
entry_kind = "board-run"
# phase-351 W4 — this board makes NO netstack choice: NuttX owns NIC+IP; the entry only pushes an address. An empty
# list is a statement, not an omission: a deploy naming one is refused.
supported_netstacks = []
board_crate = "nros-board-nuttx-qemu"
# Phase 252 (issue 0072) — forwards [safety] through the nuttx family to zenoh.
cargo_config = '''
[build]
target = "armv7a-nuttx-eabihf"

[unstable]
# phase-359 W7 — was `["std", "panic_abort"]`. The family is `no_std`, so the
# standard library is no longer compiled from source for this target.
#
# This makes the vendored `libc` fork at `third-party/nuttx/libc` UNNECESSARY —
# all four of its patches exist to make std's NuttX port link
# (`_SC_HOST_NAME_MAX`, the pthread symbols, `pthread_attr_t`'s size, the
# `poll()` ABI shim) and nothing in nano-ros's own Rust needs them. The
# `[patch.crates-io]` below is left in place and simply goes unused: actually
# retiring the fork touches the SDK index, `nros-sizes-build` and the CLI's
# patch emission, which is its own change and belongs after this one is proven
# on hardware, not bundled ahead of it.
build-std = ["core", "alloc", "panic_abort"]
build-std-features = ["compiler-builtins-mem"]

# #127 — STATIC image-link args only (board-centric link convention,
# RFC-0032 "third leg"). The dynamic pieces (processed dramboot.ld in the
# board OUT_DIR, the vectortab+builtins-stub boot archive, the -L search
# dirs for OUT_DIR / $NUTTX_DIR/staging / arch/arm/src/board) PROPAGATE
# from this board crate's build.rs (`nros_board_common::nuttx_image_link`).
# ZERO entry build.rs. The cpu flags make the gcc driver pick the
# cortex-a7 hard-float multilib, so the trailing `-lgcc` resolves the ARM
# intrinsics without an absolute `-print-libgcc-file-name` path.
# `-Tdramboot.ld` is by NAME — GNU ld resolves it through the propagated
# `-L` search path. The kernel libs are mutually recursive ->
# `--start-group`; the Rust rlibs precede this group, so libsched's
# `nsh_main` reference resolves to the board crate's.
[target.armv7a-nuttx-eabihf]
linker = "arm-none-eabi-gcc"
rustflags = [
    "-C", "link-arg=-mcpu=cortex-a7",
    "-C", "link-arg=-mfloat-abi=hard",
    "-C", "link-arg=-mfpu=neon-vfpv4",
    "-C", "link-arg=-Tdramboot.ld",
    "-C", "link-arg=--entry=__start",
    "-C", "link-arg=-nostartfiles",
    "-C", "link-arg=-nodefaultlibs",
    "-C", "link-arg=-Wl,--start-group",
    "-C", "link-arg=-lsched",
    "-C", "link-arg=-ldrivers",
    "-C", "link-arg=-lboards",
    "-C", "link-arg=-lc",
    "-C", "link-arg=-lmm",
    "-C", "link-arg=-larch",
    "-C", "link-arg=-lxx",
    "-C", "link-arg=-lapps",
    "-C", "link-arg=-lnet",
    "-C", "link-arg=-lcrypto",
    "-C", "link-arg=-lfs",
    "-C", "link-arg=-lbinfmt",
    "-C", "link-arg=-lopenamp",
    "-C", "link-arg=-lboard",
    "-C", "link-arg=-lgcc",
    "-C", "link-arg=-Wl,--end-group",
]

[env]
CC_armv7a_nuttx_eabihf = "arm-none-eabi-gcc"
CFLAGS_armv7a_nuttx_eabihf = "-mcpu=cortex-a7 -mfloat-abi=hard -mfpu=neon-vfpv4"

# #127 blocker-1: the patched libc for build-std lives UNDER this single
# [patch.crates-io] table (the pinned nightly's `std` references
# `libc::_SC_HOST_NAME_MAX`, which crates.io libc does not define for
# NuttX; the fork at third-party/nuttx/libc adds it). Renderers /
# fix-up scripts must never append a second `[patch.crates-io]` header —
# duplicate tables are invalid TOML (see nuttx-libc-patch.sh).
[patch.crates-io]
libc = { path = "${workspace}/third-party/nuttx/libc" }
'''
# NuttX is BoardRun but ships no entry block — the hosted `fn main` shim drives
# it (preserves the pre-195.C behaviour byte-for-byte).

# RFC-0042 D2 / phase-241 wave C — declared capabilities (SSoT).
[board.capabilities]
heap = true
atomics = true
threads = true

# RFC-0048 §6 / phase-287 W5 — CMake toolchain file for `nros setup`'s preset.
[board.cmake]
toolchain_file = "cmake/toolchain/armv7a-nuttx-eabi.cmake"

# ── riscv: QEMU rv-virt (rv32imac + virtio-net). Tier 2. ────────────────────
# `target_contains` is what separates the two witnesses when a caller asks for
# a board by a name both could answer to; the names themselves are distinct, so
# this is belt-and-braces against an alias being added later.
[[board]]
# phase-351 / issue 0606 — the riscv witness's downstream id, as used by the realtime workspaces.
names = ["nuttx-riscv", "NuttX-riscv", "nuttx-qemu-riscv"]
target_contains = "riscv"
platform = "nuttx"
toolchain = "nightly"
platform_feature = "platform-nuttx"
link_kind = "nuttx-staging"
entry_kind = "board-run"
# phase-351 W4 — this board makes NO netstack choice: NuttX owns NIC+IP; the entry only pushes an address. An empty
# list is a statement, not an omission: a deploy naming one is refused.
supported_netstacks = []
board_crate = "nros-board-nuttx-qemu"
# Phase 252 (issue 0072) — forwards [safety] through the nuttx family to zenoh.
cargo_config = '''
[build]
target = "riscv32imac-unknown-nuttx-elf"

[unstable]
# phase-359 W7 — was `["std", "panic_abort"]`. The family is `no_std`, so the
# standard library is no longer compiled from source for this target.
#
# This makes the vendored `libc` fork at `third-party/nuttx/libc` UNNECESSARY —
# all four of its patches exist to make std's NuttX port link
# (`_SC_HOST_NAME_MAX`, the pthread symbols, `pthread_attr_t`'s size, the
# `poll()` ABI shim) and nothing in nano-ros's own Rust needs them. The
# `[patch.crates-io]` below is left in place and simply goes unused: actually
# retiring the fork touches the SDK index, `nros-sizes-build` and the CLI's
# patch emission, which is its own change and belongs after this one is proven
# on hardware, not bundled ahead of it.
build-std = ["core", "alloc", "panic_abort"]
build-std-features = ["compiler-builtins-mem"]

[target.riscv32imac-unknown-nuttx-elf]
linker = "riscv-none-elf-gcc"
rustflags = [
    "-C", "link-arg=-march=rv32imac",
    "-C", "link-arg=-mabi=ilp32",
]

[env]
CC_riscv32imac_unknown_nuttx_elf = "riscv-none-elf-gcc"
CFLAGS_riscv32imac_unknown_nuttx_elf = "-march=rv32imac -mabi=ilp32"
# 194.3c.1/.2/.3 — arch knobs the shared build helpers read (defaults are arm).
NUTTX_CROSS = "riscv-none-elf-gcc"
NUTTX_ARCH = "risc-v"
NUTTX_ARCH_CFLAGS = "-march=rv32imac -mabi=ilp32"
NUTTX_PLATFORM_CFLAGS = "-march=rv32imac -mabi=ilp32"
NUTTX_LIBGCC_FLAGS = "-march=rv32imac -mabi=ilp32"
NUTTX_VECTORTAB_OBJ = ""
NUTTX_ARCH_INCLUDES = "arch/risc-v/src/chip arch/risc-v/src/common"
NUTTX_LINKER_SCRIPT = "boards/risc-v/qemu-rv/rv-virt/scripts/ld.script"
NUTTX_BOARD_MAKEDEFS = "boards/risc-v/qemu-rv/rv-virt/scripts/Make.defs"
NUTTX_DEFCONFIG_DIR = "rv-virt:netnsh"

[patch.crates-io]
libc = { path = "${workspace}/third-party/nuttx/libc" }
'''
# NuttX is BoardRun, no entry block — hosted `fn main` shim drives it (the
# nsh_main override in src/entry.rs), identical to the arm witness.

# RFC-0042 D2 / phase-241 wave C — declared capabilities (SSoT).
[board.capabilities]
heap = true
atomics = true
threads = true

# RFC-0048 §6 / phase-287 W5 — CMake toolchain file for `nros setup`'s preset.
[board.cmake]
toolchain_file = "cmake/toolchain/riscv32imac-nuttx-elf.cmake"

# RFC-0079 — the PORT's priority address plan. Applies to both `[[board]]`
# entries above: arm and riscv share one kernel and one set of defaults.
#
# Read from the vendored kernel, not chosen here (sys/types.h):
#   SCHED_PRIORITY_MIN 1, SCHED_PRIORITY_DEFAULT 100, SCHED_PRIORITY_MAX 255
[board.priority_plan]
direction = "bigger-is-urgent"
range = [1, 255]

# INHERITED, not chosen — and that distinction is the point.
#
# zenoh-pico's read and lease threads are pthreads created with the default
# attr, so under PTHREAD_INHERIT_SCHED they take the priority of whichever
# thread opened the session. That is the boot task, which keeps app_main's
# SCHED_PRIORITY_DEFAULT (100) through session open and the spawn loop. Nobody
# decided 100; it is where two defaults met.
#
# Until issue 0736 the port could not have decided otherwise even in principle:
# `zpico_set_task_config` DISCARDED the priority on NuttX, lumped in with
# Linux/macOS under a hosted privilege concern that does not apply to an RTOS.
# It can now state a band (`zpico_nuttx_set_priority`), and no board calls it
# yet — deliberately, because measurement showed the value is not issue 0736's
# answer and which side of the tiers it belongs on is issue 0506's open
# question. So this records the CURRENT fact and will change when that is
# decided.
reserved.transport = [100, 100]

# Tiers allocate strictly below the transport band. Sharing a priority with it
# is not an ordering at all — equal-priority FIFO threads round-robin, so which
# of the app and the link runs first is unspecified.
pool.app = [1, 99]
