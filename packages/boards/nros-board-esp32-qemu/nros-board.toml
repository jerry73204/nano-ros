# Phase 195.C — board profile descriptor. ESP32-C3 under QEMU (esp-hal).

[[board]]
# phase-341 W3 — 2 leaves deploy to `qemu-esp32-baremetal`.
# phase-351 / issue 0606 — `esp32dev` is the PlatformIO board id (`framework = "espidf"` deploys).
names = ["esp32-qemu", "esp32dev", "esp32", "esp32c3", "esp32-c3", "qemu-esp32-baremetal"]
platform = "esp32"
toolchain = "nightly"
local_aliases = ["platform-esp32-qemu"]
entry_kind = "board-run"
# phase-351 W4 — the stacks this board can be built with: `Cargo.toml` names the smoltcp network provider (ethernet only).
supported_netstacks = ["smoltcp"]
chip = "esp32c3"
board_crate = "nros-board-esp32-qemu"
# Phase 252 (issue 0072) — forwards [safety] to its zenoh backend.
cargo_config = '''
[build]
target = "riscv32imc-unknown-none-elf"

[target.riscv32imc-unknown-none-elf]
rustflags = [
    "-C", "link-arg=-Tlinkall.x",
    "-C", "force-frame-pointers",
    # phase-341 W1 — hoisted from the leaves; 2 of 4 carried it.
    "-C", "link-arg=--gc-sections",
]

[env]
ESP_LOG = "info"

[unstable]
build-std = ["core", "alloc"]
'''

[board.entry]
signature = "#[esp_hal::main]\nfn main() -> !"
crate_root_extra = "use esp_backtrace as _;\nnros_board_esp32_qemu::esp_bootloader_esp_idf::esp_app_desc!();"
# `esp_backtrace` is the panic handler; `nros_board_esp32_qemu` is the board
# crate the emitter already depends on, so only the former is listed.
crate_root_deps = ["esp-backtrace = { version = \"~0.18.0\", features = [\"esp32c3\", \"panic-handler\", \"println\"] }"]
closure_extra = "\n                .clock_us(nros_board_esp32_qemu::nros_platform_esp32_qemu::clock::clock_us)"

# RFC-0042 D2 / phase-241 wave C — declared capabilities (SSoT).
[board.capabilities]
heap = true
atomics = true
threads = true
