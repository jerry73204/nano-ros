[package]
name = "nros-tests"
version.workspace = true
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "Integration tests for nros"

# issue 0287 — HOST-ONLY. `just check workspace-embedded` builds the whole
# workspace for a thumb target, and cargo unifies features across ALL members
# regardless of what firmware can reach. A host-only member therefore turns
# `std` on for everything and the lane dies in an unrelated crate
# (`can't find crate for \`std\`` in nros-serdes). Declared here rather than
# hand-listed in the justfile so the reason lives with the crate and the
# exclude list is derived — see scripts/build/host-only-members.sh.
[package.metadata.nros]
host-only = true
host-only-reason = "the host test harness"

[dependencies]
# Test framework
rstest = "0.24"
duct = "0.13"
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.15"
thiserror = "2.0"
once_cell = "1.20"
# Phase 211.A — orchestration plan JSON inspection in `orchestration_e2e`.
serde_json = "1.0"
# issue 0609 — rmw_zenoh_cpp's shipped session config is real JSON5 (comments,
# unquoted keys, trailing commas), and we must READ it to overlay our settings
# rather than replace it. `serde_json` cannot parse that; this can. Already in
# the workspace lock as a transitive dep, so this adds an edge, not a version.
json5 = "0.4"
# issue #52 / 0303 — `qos_override_e2e` reads the ws-qos-rust committed model and
# runs its QoS override through the SAME lowering the bake uses, so the fixture
# cannot drift from what the entry would emit. Host-only, like every dep here.
serde_yaml_ng = "0.10"
nros-orchestration-ir = { workspace = true }
# phase-336 — the shared build-profile table. The fixture resolvers derive
# `target/<triple>/<profile>/` from it instead of re-implementing the mapping
# the builder used.
nros-cargo-profile = { path = "../../tooling/nros-cargo-profile" }
ros-launch-manifest-model = { git = "https://github.com/NEWSLabNTU/ros-launch-manifest.git", tag = "v0.1.23" }
# Phase 212.M.11 + M.12 — TOML parsing for the example-canonical-shape
# + pre-212-file regression tests. Reads
# `[package.metadata.nros.{component,entry,deploy.*}]` out of each
# example's `Cargo.toml`. Both 212.M.11 sibling + 212.M.12 sibling tests
# consume the same dep.
toml = "0.9"
# Phase 212.H.8 — in-process LoC counter for the adapter-shim +
# workspace-metadata budget gates. Replaces the previous shell-out to
# the `tokei` CLI binary so the test runs on a stock dev machine without
# `cargo install tokei`. `default-features = false` drops the CLI bits
# (clap/colored/env_logger) — we only need the library.
tokei = { version = "14", default-features = false }

# Async support for waiting
parking_lot = "0.12"

# Phase 208.D.3 — `px4-sitl-tests` moved to the out-of-workspace
# crate `packages/testing/nros-px4-sitl-test/`. Keeping it as an
# optional path-dep here broke fresh-shell `cargo build` because
# cargo resolves optional path-deps at workspace-load time, and the
# `px4-rs` submodule is absent on a clean clone (audit blocker P3).
# Run the SITL E2E via `just px4 test-sitl`.

# Non-blocking I/O for process output capture
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Phase 100.8 — Orin SPE IVC link transport mock E2E test. The
# `unix-mock` backend implements the IVC channel API on top of an
# `AF_UNIX SOCK_DGRAM` pair, so the framing protocol can be exercised
# on any POSIX host without an SDK Manager install.
nvidia-ivc = { path = "../../drivers/ipc/nvidia-ivc", features = ["unix-mock", "std"] }

# Workspace dependencies for type access (optional). phase-361 W3 — both now
# default to `no_std`; the test harness always runs hosted, so ask for `std`.
nros-core = { path = "../../core/nros-core", default-features = false, features = ["std"], optional = true }
nros-serdes = { path = "../../core/nros-serdes", default-features = false, features = ["std"], optional = true }

# RMW abstraction layer (optional, for in-process integration tests)
# `nros-rmw` defaults to no-std; tests always run with std, so opt in
# explicitly to keep rich error-context / logging available.
nros-rmw = { path = "../../core/nros-rmw", default-features = false, features = ["std"], optional = true }

# Node + executor API (optional, for trigger condition integration tests).
# Phase 141.C — `wake-latency-probe` feature pulls in
# `wake_probe::{parse_csv, percentile_ns}` for the
# `wake_latency_cortex_m3` host runner.
nros-node = { path = "../../core/nros-node", default-features = false, features = ["std", "rmw-cffi", "ros-humble", "wake-latency-probe"], optional = true }

# Phase 124.A.8.b — zenoh-pico backend (lending feature on) for the
# loan E2E test. Optional so the default test build doesn't pull
# zenoh-pico unnecessarily.
nros-rmw-zenoh = { path = "../../rmw/zenoh/nros-rmw-zenoh", features = ["lending", "platform-posix"], optional = true }
# Phase 169.2 — the retired Rust DDS backend and multi-RMW bridge test
# were deleted alongside the Rust DDS examples.
# Phase 124.A.8.b — posix C symbols (nros_platform_*) for the loan E2E
# binary. Without `posix-c-port`, nros-platform-cffi declares the
# canonical symbols extern without providing them, and link fails.
nros-platform-cffi = { path = "../../platform/nros-platform-cffi", features = ["posix-c-port"], optional = true }

# Phase 88.14 — `nros-log` facade for the host-side logging tests.
nros-log = { path = "../../core/nros-log" }

# Phase 212.L.5 — top-level init API tests. The `nros` umbrella's
# `init` module is platform/RMW-independent (no backend pulled), so we
# depend on it with only `std`.
# `env` — phase-359 W10 moved `nros::init` / `ContextSource` behind a
# capability feature (`1badb6f72`), and `tests/init_api.rs` exercises exactly
# that API, so the test crate has to name it. Without it the items are
# "configured out" and the suite fails to COMPILE — which stayed hidden while
# `check-feature-contract` was red, because ci-matrix stopped before the tests.
nros = { path = "../../api/nros", default-features = false, features = ["std", "macros", "env"] }
# Phase 212.N.7 — the `nros::component!()` macro emits a
# `pub fn register(runtime: &mut ::nros_platform::RuntimeCtx<'_>)`
# wrapper. Tests that invoke that wrapper directly need `nros-platform`
# nameable in scope; gated on `component-runtime-test` because only the
# m5a4 dispatch suite touches it today.
nros-platform = { path = "../../platform/nros-platform", default-features = false, features = ["platform-posix"], optional = true }

[features]
default = []
types = ["nros-core", "nros-serdes"]
rmw = ["nros-rmw", "nros-core", "nros-serdes"]
safety-e2e = ["rmw", "nros-rmw/safety-e2e"]
trigger-test = [
    "dep:nros-node",
    "nros-core",
    "nros-serdes",
    # Phase 124.B.8 — wake-latency microbench needs an actual RMW
    # backend so `Executor::open` returns a session (otherwise
    # `Transport(ConnectionFailed)` and the cv-wait path is never
    # reached). zenoh-pico auto-registers via `.init_array` on POSIX.
    "dep:nros-rmw-zenoh",
    "dep:nros-platform-cffi",
    # Phase 128.C.3 — per-backend rmw-*-cffi features removed; the
    # umbrella `rmw-cffi` enables the walker that discovers whichever
    # backend the manifest pulled in via `dep:nros-rmw-<name>`.
    "nros-node/rmw-cffi",
    # phase-359 W10 — `nros-node/std` used to be here. None of the three
    # `trigger-test` targets touches nros-node's std-only surface (the
    # wall-clock spin loops and `open_threaded`); they drive `spin_once` and
    # the wake primitives, which are `alloc`. The forward made this test crate
    # one more grantor of the core's `std` flavour, which is what the campaign
    # removes. This crate's OWN `std` is not in question — it is a host test
    # harness and uses std freely; what it stops doing is imposing that on
    # `nros-node`.
]
# issue 0612 — the POSIX signalfd wake path. `signal-fd-wake` needs `alloc`,
# `rmw-cffi` and `std` on `nros-node` (three `compile_error!`s say so); the
# first two arrive with `trigger-test`, the third with this crate's own
# `nros-node` feature list. What `trigger-test` supplies that `nros-node`'s own
# test dir could not is a REGISTERED BACKEND and a router fixture: the wake path
# is gated `all(alloc, rmw-cffi)`, and turning `rmw-cffi` on is exactly what
# removes `nros_node::mock`, so in that crate no invocation both compiled the
# code under test and could open a session.
signal-fd-wake-test = [
    "trigger-test",
    "nros-node/signal-fd-wake",
]
# Phase 169.2 — multi-RMW bridge test deleted with the retired Rust
# DDS backend.
# Feature kept commented for archaeology.
# multi-rmw-bridge = [
#     "trigger-test",
# ]
# Phase 212.M.5.a.2 — Executor-backed component runtime E2E. Pulls in
# the runtime via the `nros` umbrella (`rmw-cffi` + `platform-posix`)
# plus the trigger-test fixtures so a real zenohd backs `Executor::open`.
component-runtime-test = [
    "trigger-test",
    "nros/rmw-cffi",
    # Phase 248 C5c — platform symbols come from the directly-pulled
    # `nros-platform` (below), not the retired `nros/platform-posix` forward.
    "nros-platform/platform-posix",
    # Phase 212.M-F.23 Wave 2 — declarative parameter dispatch. Lets the
    # component_dispatch param test reach `Executor::declare_parameter` /
    # `get_parameter` / `params()` (all `#[cfg(param-services)]`) so it can
    # assert the runtime stood up the param services + seeded the default.
    "nros/param-services",
    "dep:nros-platform",
]
# Phase 216.A.6 — dispatch substrate integration test. Pulls in
# `nros-platform` so `phase216_a_dispatch_strategy` can reach
# `NodeDispatchRuntime` / `NullNodeRuntime` / `SignaledCallback`
# without dragging in the heavier `component-runtime-test` chain
# (which would pull `nros-rmw-zenoh` + zenohd just to assert a
# `panic!` message).
phase216-substrate = [
    "dep:nros-platform",
]

# Phase 124.A.8.b — zero-copy loan E2E via real zenoh-pico backend.
# Pulls nros-node + nros-rmw-zenoh with the `lending` feature so the
# customised ZENOH_VTABLE (124.A.4.b) is installed at backend
# auto-register time.
loan-e2e = [
    "dep:nros-node",
    "nros-core",
    "nros-serdes",
    "nros-node/rmw-lending",
    "dep:nros-rmw-zenoh",
    "dep:nros-platform-cffi",
]
[lib]
name = "nros_tests"
path = "src/lib.rs"

