[package]
name = "nros-log"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "ROS 2 style leveled logging facade for nros (Phase 88)"
authors.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
keywords = ["ros2", "logging", "embedded", "no-std"]
categories = ["embedded", "no-std", "development-tools::debugging"]

# Phase 88 — portable facade. NO target deps. Per-platform log
# delivery lives in each `nros-platform-<rtos>` crate via the
# `nros_platform_log_write` / `nros_platform_log_flush` ABI; the
# `PlatformSink` here is the only sink that calls the ABI.
#
# `default = ["max-level-trace", "buffer-size-256"]` keeps the
# library-only case zero-cost: pull the crate in, get types +
# macros, no sink wired until the app calls `nros_log::init(...)`.
#
# Compile-time level ceiling: pick at most one `max-level-*`.
# Macros below the ceiling expand to `()` so the format call is
# dead-code-eliminated.
#
# Buffer-size family controls the `heapless::String<N>` used for
# call-site formatting. Bigger N = larger stack frame per call;
# smaller N = more truncation. Pick at most one.

[features]
default = ["max-level-trace", "buffer-size-256"]
std = ["alloc"]
alloc = []

# Issue #503 — populate `Record::timestamp_ns` from the platform's
# monotonic clock (`nros_platform_clock_us`, the same universal export
# the executor's timer accounting links), and have `PlatformSink`
# prefix rendered lines with `[sssss.uuuuuu]`. Opt-in: the extern is a
# link-time requirement on the final binary — every real image
# satisfies it via its `nros-platform-<rtos>` port, but host tools
# composing custom sinks without a platform port would not, hence not
# a default. Resolution is whatever the platform delivers (issue #502
# covers the FreeRTOS/ThreadX coarseness).
platform-clock = []


max-level-trace = []
max-level-debug = []
max-level-info  = []
max-level-warn  = []
max-level-error = []
max-level-off   = []

# Issue 0710 follow-up — how many records `nros_log::early` holds before
# `init` installs the sinks. Same shape as `buffer-size-<N>` below and for the
# same reason: a 64 KB MCU and a Linux host do not want the same number. The
# else-branch default is 4; `early-records-0` declines the ring and restores
# the pre-0708 behaviour of dropping, with the overflow COUNT still kept so the
# loss stays reportable.
early-records-0  = []
early-records-8  = []
early-records-16 = []

# phase-417 W4.d — how many loggers `get_or_create_logger` may CREATE for names
# nobody registered at compile time (`rclcpp::get_logger("x")`'s shape, and what
# `nros_log_get_logger` in the C API needs). Same family shape and same reason
# as `early-records-<N>`: static arenas, and a 64 KB MCU and a Linux host do not
# want the same number. `dynamic-loggers-0` declines the arenas entirely and
# leaves lookup-only behaviour, which is the right build for an image whose
# loggers are all `static`. Else-branch default is 16.
dynamic-loggers-0  = []
dynamic-loggers-8  = []
dynamic-loggers-32 = []

buffer-size-128  = []
buffer-size-256  = []
buffer-size-512  = []
buffer-size-1024 = []

# phase-417 — ARMS the `#[deprecated]` on the pre-rename `nros_debug!` ..
# `nros_fatal!` forwarders. Off by default, and the reason is structural rather
# than timid: this workspace sets `warnings = "deny"` (root `Cargo.toml`
# `[workspace.lints.rust]`), so an always-armed deprecation is not a migration
# STEP -- it is a hard compile error in every crate that has not moved yet, i.e.
# the flag day RFC-0087's two-step alias exists to avoid. Measured at the rename:
# 9 errors in `nros-rmw-cffi` alone stopped the workspace build.
#
# So the attribute is authored, reviewed and inert, and the migration batch is
# `--features deprecate-legacy-names` -> fix what it names -> delete the
# forwarders. Turning it on before the call sites move breaks the build; that is
# the point of it being a switch.
deprecate-legacy-names = []

# Optional `log` crate bridge (Phase 88.10). Lets ecosystem crates
# that target `log::info!` etc. feed through the same dispatcher.
log-compat = ["dep:log"]

[dependencies]
heapless = { workspace = true }
log = { workspace = true, optional = true }
# Phase 88.16.E — `compare_exchange` on `AtomicBool` / `AtomicPtr`
# isn't available on `core::sync::atomic` for RISC-V `imc` and
# similar CAS-less targets. `portable-atomic` provides the atomics;
# target-specific dependency entries below select the fallback only
# where the target needs it.
portable-atomic = { version = "1", default-features = false }

# phase-337 W2.b — one spelling of "this target needs the interrupt-disable
# polyfill", shared with nros-smoltcp and nros-board-esp32-qemu. A target
# triple (the old gate here) and an arch list (the old gate in nros-smoltcp)
# were two different approximations of the same question; the arch list was
# wrong on thumbv7m, which HAS native CAS and where the feature hard-conflicts
# with the `critical-section` the `zephyr` crate enables. Ask directly instead:
# no CAS => needs the polyfill, and bare-metal only, because the polyfill
# disables interrupts. Still scoped, so host and SMP-capable targets do not
# inherit the single-core assumption through feature unification.
[target.'cfg(all(target_os = "none", not(target_has_atomic = "ptr")))'.dependencies]
portable-atomic = { version = "1", default-features = false, features = ["unsafe-assume-single-core"] }

# Integration tests pull the POSIX C impl of `nros_platform_log_*`
# in via `nros-platform-cffi[posix-c-port]` so `PlatformSink ->
# nros_platform_log_write` actually resolves at link time without
# needing a separate `nros-platform-posix` cargo dep on the host
# (cffi already wraps the C build via its `cc` build dep).
#
# Phase 214.F.2 — target-gate the dev-dep. Cargo feature unification
# doesn't honour [dev-dependencies] boundaries during target-aware
# resolution unless they live under [target.<cfg>.dev-dependencies].
# Host targets still see the cffi dev-dep (cargo test works
# unchanged); embedded (`target_os = "none"`) sees an empty set so
# the `posix-c-port → feature "std"` activation path collapses.
[target.'cfg(not(target_os = "none"))'.dev-dependencies]
nros-platform-cffi = { path = "../../platform/nros-platform-cffi", default-features = false, features = ["posix-c-port"] }

[lints]
workspace = true

