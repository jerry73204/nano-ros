[package]
name = "nros-orchestration-ir"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared per-tier orchestration schema + resolver (RFC-0015), consumed by both the nros CLI codegen and the nros::main! proc-macro."

# issue 0287 — HOST-ONLY. `just check workspace-embedded` builds the whole
# workspace for a thumb target, and cargo unifies features across ALL members
# regardless of what firmware can reach. A host-only member therefore turns
# `std` on for everything and the lane dies in an unrelated crate
# (`can't find crate for \`std\`` in nros-serdes). Declared here rather than
# hand-listed in the justfile so the reason lives with the crate and the
# exclude list is derived — see scripts/build/host-only-members.sh.
[package.metadata.nros]
host-only = true
host-only-reason = "host-side orchestration IR consumed by the CLI"

[dependencies]
# issue 0382 — `structure.nodes` preserves launch declaration order.
indexmap = "2"
serde = { version = "1", features = ["derive"] }
# phase-307 — `sidecar_slots`, the ONE callback-slot accounting rule both bakes
# read source-metadata sidecars with. Value-based on purpose: the proc-macro
# cannot dep nros-cli-core for the typed schema, and a mirrored struct would be
# the drift this crate exists to prevent.
serde_json = "1"
# phase-330 W7 — `model_location::launch_to_model_rel` reads the bringup's
# `system.toml` ([system] default_launch + [[model]] declarations) to map the
# user-facing (launch, args) input to the model artifact path. Host-only crate.
toml = "0.8"
thiserror = { workspace = true }
# RFC-0052 — the shared SystemModel tier schema. Both consumers of this crate
# (the CLI's codegen-system and the nros::main! proc-macro) resolve tiers from
# a resolved model, so the model→ir tier conversion lives here (one SSoT, no
# drift). Path crosses into the cli sub-workspace's vendored submodule — fine,
# a path dep groups by lockfile, not visibility (same rationale as nros-macros
# depping nros-pkg-index / nros-launch-parser).
# `[tiers.*]` duration keys accept both the canonical and the deprecated
# `_us` spelling; the parser is rlm's own, never a second one here.
ros-launch-manifest-types = { git = "https://github.com/NEWSLabNTU/ros-launch-manifest.git", tag = "v0.1.23" }
ros-launch-manifest-sched = { git = "https://github.com/NEWSLabNTU/ros-launch-manifest.git", tag = "v0.1.23" }
# W5.13 follow-up — `mapper_input` adapts a resolved `SystemModel` into the
# `MapperInput` the realizer ranks; the model types live in the sibling crate.
ros-launch-manifest-model = { git = "https://github.com/NEWSLabNTU/ros-launch-manifest.git", tag = "v0.1.23" }
# issue 0303 — `qos_override` lowers `qos_overrides.<topic>.<role>.<policy>`
# params into the codes the entry bakes. The role/policy NUMBERING is
# `nros-rmw`'s (it owns the decoder every runtime uses), so the lowering must
# reference those constants rather than respelling them — respelling is how the
# four decoder copies drifted in the first place. Types + consts only; no
# default features, so no backend comes with it.
nros-rmw = { workspace = true, default-features = false }

[lints]
workspace = true
