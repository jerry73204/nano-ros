[package]
name = "rosidl-codegen"
version.workspace = true
publish = false
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Code generator for ROS 2 Rust bindings"
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
keywords = ["ros2", "rosidl", "codegen", "robotics"]
categories = ["development-tools::build-utils"]

[dependencies]
serde.workspace = true
toml.workspace = true
# phase-304 W1 (RFC-0056) — REP-2011 RIHS01 type-hash (SHA-256 of the canonical
# type description). Host-side codegen only.
sha2 = "0.10"
rosidl-parser.workspace = true
rosidl-resolve.workspace = true
rosidl-lower.workspace = true
# issue 0896 layer 1 — codegen computes a message's serialized-size bound with
# THE size rule, not a copy of it. `nros_serdes::size::max_serialized_size` is
# the same function the runtime uses, so the C constant and the Rust const
# cannot disagree about encoding rules. Path dep across the workspace boundary:
# `packages/cli` is its own workspace, and this is a core crate.
nros-serdes = { path = "../../core/nros-serdes", default-features = false }
# phase-429 W2 — the CODEGEN VERSION this emitter emits. Same cross-workspace
# path dep as `nros-serdes` above and for the same reason: the token is a
# RUNTIME fact, and a binary that emits code must carry the number of the
# runtime it was built against rather than a second copy of it.
nros-core = { path = "../../core/nros-core", default-features = false }
minijinja.workspace = true
# phase-432 W2.5b (RFC-0091 §6b) — the filter registry is keyed by `Language`,
# so a variant added to the one enumeration has a compile-time home here. That
# crate is `serde`-and-nothing-else by design (see its module docs), so this
# costs the codegen graph nothing.
nros-lang.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
# phase-432 W2.5b — `machinery::tokenize` is minijinja's OWN lexer. The filter
# closure check must tell a `|` that is a filter call from a `|item|` closure in
# the Rust the packs EMIT; a regex cannot, the lexer can. Dev-only, so the
# shipped binary never carries the unstable API.
minijinja = { workspace = true, features = ["unstable_machinery"] }
tempfile = "3.0"
criterion = "0.7"
walkdir = "2.0"
similar = "2.6"

[[bench]]
name = "generation_benchmark"
harness = false
