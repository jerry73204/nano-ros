description = "Stage 2 of the codegen pipeline (RFC-0068, amended by RFC-0091): lower a resolved ROS interface into a language-neutral IR (storage, plainness, serialized size) under a CodegenConfig. Target-AGNOSTIC — the compiler resolves layout, and a representation two languages must share is pinned in the generated source"
