[package]
name = "nros-lang"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The target-language enumeration shared by every codegen consumer (RFC-0091 §3). One enumeration, many narrowings — and a narrowing derives rather than re-spells."

[dependencies]
serde = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[features]
# NO default feature. `check-feature-contract` clause (b): a `no_std`-capable
# crate that defaults to `std` splits itself into two compile identities in one
# build — the consumer that names it and the consumer that does not get
# different crates. `std` here only adds the `std::error::Error` impl on
# `UnknownLanguage`; the type, its parsing and its serde repr are all
# `core`+`alloc`.
std = ["serde/std"]
