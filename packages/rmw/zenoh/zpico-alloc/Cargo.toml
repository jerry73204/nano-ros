[package]
name = "zpico-alloc"
version.workspace = true
publish = false
edition = "2024"
description = "Free-list allocator for zenoh-pico z_malloc/z_free on bare-metal"
license = "MIT OR Apache-2.0"
repository.workspace = true
authors.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
keywords = ["allocator", "bare-metal", "no-std", "embedded", "zenoh"]
categories = ["embedded", "no-std", "memory-management"]

[dependencies]
# phase-391 W2 — the O(1) allocator behind the funnel. `default-features = false`
# keeps its `std` feature off; rlsf is `#![no_std]` unconditionally.
#
# Already a transitive dependency of `nros-board-esp32-qemu` (via esp-alloc), so
# it is proven to build for a bare-metal target in this tree, and it is present
# in the local registry — which matters because `--locked` is injected
# project-wide by the scripts/bin/cargo shim.
# `unstable` is an EMPTY, purely additive feature in rlsf 0.2.3 -- it gates
# extra APIs and nothing else; the only nightly `feature(...)` in that crate
# is behind `doc_cfg`, which stays off. It is enabled for
# `Tlsf::allocation_usable_size`, without which a freed block's size is
# unknown and `used_bytes` can only ever grow (phase-412).
rlsf = { version = "0.2.3", default-features = false, features = ["unstable"] }

# The counters below use atomic READ-MODIFY-WRITE (`fetch_add`), which
# `core::sync::atomic` does not provide on every target this crate builds for:
# esp32-c3 is `riscv32imc-unknown-none-elf`, which has load/store atomics and no
# RMW, so `AtomicUsize::fetch_add` simply does not exist there —
#
#   error[E0599]: no method named `fetch_add` found for struct `Atomic<usize>`
#     --> packages/rmw/zenoh/zpico-alloc/src/lib.rs:395:32
#
# `portable-atomic` supplies them. Same shape `nros-board-esp32-qemu` already
# uses, including the split below: the `unsafe-assume-single-core` feature is a
# claim about the SYSTEM (no other core can race the emulated RMW), so it is
# enabled only for the bare-metal no-RMW targets that need it, and never
# unconditionally — that crate's own comment records the accident of doing so.
portable-atomic = { version = "1", default-features = false }

[target.'cfg(all(target_os = "none", not(target_has_atomic = "ptr")))'.dependencies]
portable-atomic = { version = "1", default-features = false, features = [
    "unsafe-assume-single-core",
] }

[features]
default = []
## Track peak heap usage (adds two atomics per heap) and expose the reusable
## `HeapStats` counter for instrumenting the RTOS allocator wrappers.
stats = []
## phase-361 W8.c / issue 0594 — `global-alloc` is GONE. It implemented
## `GlobalAlloc` for `FreeListHeap` so a board could install the free-list heap
## as its `#[global_allocator]` directly. Its only consumer,
## `nros-platform-mps2-an385`, did exactly that — and thereby bypassed
## `nros_platform_alloc`, the sole allocation funnel RFC-0034 D6 defines and
## `check-no-direct-kernel-alloc.sh` enforces. The heap is still the arena; the
## Rust side now reaches it through `PlatformAlloc`, and `nros-platform` owns
## the one lang item. Shipping a second ready-made allocator is what this phase
## is removing.

[lints]
workspace = true
