# The "fast path" — invoked by `just test` — excludes heavy-dep
# binaries by referencing the test-groups defined above via the
# nextest 0.9.133+ `group(...)` filterset predicate. The filter
# lives in `justfile` because `group(...)` is CLI-only; see
# https://nexte.st/docs/filtersets/reference/ and
# https://github.com/nextest-rs/nextest/pull/3273.
#
# Groups currently excluded from the fast path:
#   * qemu-baremetal       — MPS2-AN385 (all lanes; W4 retired the shared sub-group)
#   * qemu-freertos        — FreeRTOS on MPS2-AN385
#   * qemu-nuttx           — NuttX on MPS2-AN385
#   * qemu-threadx-riscv   — ThreadX on QEMU RV64
#   * (esp32 lanes are excluded by `binary(esp32_emulator)` — the blanket
#     qemu-esp32 group died in W4; only the shared-pubsub-image trio keeps
#     a group)
#   * threadx-linux        — ThreadX Linux sim + veth bridge
#   * qemu-zephyr          — Zephyr native_sim (NSOS), zenoh variants
#   * qemu-zephyr-xrce     — Zephyr native_sim, XRCE variant (shared Agent port)
#   * zephyr-fvp           — ARM FVP runtime smoke (license-gated install)
#   * ros2-interop         — needs ROS 2 CLI on PATH
#   * xrce_ros2_interop    — needs XRCE Agent + ROS 2
#
# When a new heavy test binary lands, assign it to one of these
# groups via a `[[profile.default.overrides]]` entry — `just test`
# will automatically pick up the exclusion.

# Phase 150.T — three smoke tests build a tmpdir cmake project that
# triggers full cold-cache cmake + cargo compilation (zenoh-pico +
# zpico-sys + nros-cpp). Default 60s terminate-after is too tight;
# bump to 600s so cold-cache builds finish without spurious TIMEOUT.
[[profile.default.overrides]]
# phase-373 W4 — `cpp_parameters` folded into `parameters_roundtrip` (its cpp
# CASE). The old `test(cpp_parameters_roundtrip)` would have gone silently
# inert, which is the failure mode this file has hit before.
filter = "binary(cmake_add_subdirectory) or binary(cmake_platform_matrix) or binary(parameters_roundtrip)"
slow-timeout = { period = "60s", terminate-after = 10 }

# ── phase-318 W5.b — QEMU host-load cap (RFC-0061) ─────────────────────────────
#
# QEMU-bearing lanes flake under load, not because of the code but because of the
# host: 287-W7 saw six NuttX lanes fail in-sweep and pass solo. A tier whose reds
# are routinely noise trains people to ignore reds, which is how a REAL red hides
# (issue 0337 sat red for 60+ runs). Capping concurrency is what makes tier 3's
# result readable.
#
# This is a RESOURCE group in the issue-#141 sense — the resource is the host's
# capacity to emulate, shared by every QEMU binary. `qemu-baremetal` above caps
# its own family at 3; this catches the RTOS emulator lanes that had no cap.
#
# The filter mirrors the platform families in `PlatformId`
# (see scripts/test/lane-filter.sh, which derives its tokens the same way).
# `ci_lane::tests::lane_filter_tokens_cover_every_non_native_platform` gates the
# script; this list is its manual twin and must move with it.
[test-groups.qemu-emulated]
max-threads = 4

[[profile.default.overrides]]
filter = "binary(~freertos) or binary(~nuttx) or binary(~threadx) or binary(~zephyr) or binary(~esp32) or binary(~fvp)"
test-group = "qemu-emulated"

# phase-329 W2 consolidated ten `*_applied` binaries into ONE
# `sched_dims_applied_e2e::sched_dims_applied` that iterates every sched-dim
# cell IN ONE PROCESS. The six overrides above named the deleted binaries and
# nothing named the survivor, which broke `cargo nextest` outright — an
# override whose `binary(...)` matches nothing is a hard config error, so every
# filtered run failed to start, not just the realtime ones.
#
# The survivor boots the zephyr / nuttx / threadx / freertos images the groups
# above serialize, so it gets max-threads = 1 and their slowest budget. NOTE the
# residual: nextest groups bound concurrency WITHIN a group, so this test can
# still run alongside `realtime_tiers_e2e` cells that share those ports. If it
# flakes that way, the fix is to merge it into those groups rather than to widen
# the timeout.
# issue 0571 — ONE group for every consolidated multi-platform consumer, and
# the resolution of the residual the paragraph above predicted.
#
# phase-329 folded per-cell binaries into single tests that each iterate EVERY
# platform's cells in one process. Five such tests exist, and they boot the same
# baked images on the same allocator ports as one another. Per-cell groups could
# express that; a single test cannot be in five groups, so the five per-cell
# groups (`nuttx-realtime-rust-port`, `nuttx-realtime-cpp-port`,
# `threadx-realtime-rust-port`, `freertos-realtime-cpp-port`,
# `zephyr-realtime-rust-port`) had NO live members at all — every filter naming
# them selected a test name that consolidation deleted. They are retired here.
#
# One group holding all five consumers is the expressible answer: conservative
# (it serializes pairs that may not actually collide) but never wrong.
#
# RESIDUAL, unchanged and stated: a consumer can still run alongside a
# PER-PLATFORM binary whose port it reuses (`realtime_tiers`'s nuttx-arm rust
# cell reuses rtos_e2e's talker image and port 8200). nextest allows one group
# per test, so that cannot be expressed at the same time as this one. If it
# flakes that way, move the per-platform partner into this group too.
[test-groups.matrix-consumers-serial]
max-threads = 1

[[profile.default.overrides]]
filter = "binary(sched_dims_applied_e2e)"
test-group = "matrix-consumers-serial"
slow-timeout = { period = "120s", terminate-after = 3 }
retries = 2

# issue 0564 — the 0413 consolidation cost, one binary further out. phase-329 W1
# folded 15 per-cell `realtime_tiers_*` files into ONE test that iterates every
# RealtimeTiers cell in a single process, and the timeout budget did not follow.
# Unlike 0413's native-only sweep this one BOOTS QEMU images (zephyr, nuttx-arm,
# nuttx-riscv, freertos, threadx) and waits for five 100 ms-tier deliveries per
# cell, so its wall clock is the sum of sixteen boot+observe rows.
#
# Measured on this host: 127 s and 204 s on two consecutive runs — the variance
# is why the kill window is generous rather than snug against the larger figure.
# The default (30 s period, terminate-after 2 = 60 s hard kill) truncated it
# mid-sweep, and that is worse than slow: rows are evaluated IN ORDER, so the
# kill meant the later cells were never run at all. Two genuine NuttX Rust
# failures had been sitting behind it unseen (issue 0565).
[[profile.default.overrides]]
# phase-373 W1 — `qos_zephyr_ros2_interop_e2e` is in this group too, but it is
# assigned by its own override far ABOVE, not from here: `binary(~zephyr)` sits
# between this block and the top of the file and would claim it first. Naming it
# here as well would be a second spelling that never takes effect.
filter = "binary(realtime_tiers_e2e) or binary(entry_e2e) or binary(multihost_e2e) or binary(roundtrip_xprocess_e2e)"
test-group = "matrix-consumers-serial"
slow-timeout = { period = "180s", terminate-after = 3 }
